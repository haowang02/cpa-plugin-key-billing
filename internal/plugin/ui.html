<style>
/* Keep the embedded page aligned with the management panel's three themes. */
:root{
  --bg-secondary:#faf9f5; --bg-primary:#f0eee8; --bg-tertiary:#e9e6df; --bg-hover:var(--bg-tertiary);
  --floating-surface:#fffdf9; --floating-shadow:0 12px 26px #00000024;
  --text-primary:#2d2a26; --text-secondary:#6d6760; --text-tertiary:#a29c95;
  --border-color:#e3e1db; --border-primary:#d5d2cb; --border-hover:#cecac4;
  --primary-color:#8b8680; --primary-hover:#7f7a74; --primary-active:#726d67; --primary-contrast:#fff;
  --error-color:#c65746;
  --success-badge-bg:#d1fae5; --success-badge-text:#065f46; --success-badge-border:#6ee7b7;
  --failure-badge-bg:#c6574624; --failure-badge-text:#8a3a30; --failure-badge-border:#c6574659;
  --count-badge-bg:#8b86802e; --count-badge-text:var(--primary-active);
  --info-badge-bg:var(--count-badge-bg); --info-badge-text:var(--count-badge-text); --info-badge-border:transparent;
  --amber-color:#d97706; --amber-text:#92400e;
  --amber-10:color-mix(in srgb, var(--amber-color) 10%, transparent);
  --amber-30:color-mix(in srgb, var(--amber-color) 30%, transparent);
  --quota-high-color:#10b981; --quota-medium-color:#e0aa14; --quota-low-color:var(--error-color);
  --primary-10:color-mix(in srgb, var(--primary-color) 10%, transparent);
  --shadow:0 1px 2px 0 #00000014;
  --radius-md:8px;
  --event-row-bg:transparent;--event-row-border:var(--border-color);
  --event-code-bg:var(--bg-secondary);--event-code-border:var(--border-primary);
  --event-error-rail:var(--error-color);
}
[data-theme=white]{
  --bg-secondary:#fff; --bg-primary:#fff; --bg-tertiary:#f6f6f6;
  --floating-surface:#fff; --floating-shadow:0 12px 26px #0000001f;
  --border-color:#e5e5e5; --border-primary:#d9d9d9; --border-hover:#ccc;
  --event-code-bg:var(--bg-tertiary);
}
[data-theme=dark]{
  --bg-secondary:#151412; --bg-primary:#1d1b18; --bg-tertiary:#262320; --bg-hover:#2e2a26;
  --floating-surface:#2a2723; --floating-shadow:0 14px 30px #0006;
  --text-primary:#f6f4f1; --text-secondary:#c9c3bb; --text-tertiary:#9c958d;
  --border-color:#3a3530; --border-primary:#4a453f; --border-hover:#5a544d;
  --primary-hover:#9a948e; --primary-active:#a6a099;
  --success-badge-bg:#064e3b4d; --success-badge-text:#6ee7b7; --success-badge-border:#059669;
  --failure-badge-bg:#c657463d; --failure-badge-text:#f1b0a6; --failure-badge-border:#c6574680;
  --count-badge-bg:#8b868047;
  --amber-color:#f59e0b; --amber-text:#fcd34d;
  --amber-10:color-mix(in srgb, var(--amber-color) 14%, transparent);
  --amber-30:color-mix(in srgb, var(--amber-color) 38%, transparent);
  --quota-high-color:#0fae78; --quota-medium-color:#ffd862; --quota-low-color:#cf4b3a;
  --shadow:0 1px 3px 0 #0000004d;
  --event-code-bg:var(--bg-secondary);--event-code-border:var(--border-primary);
}
:root[data-cpamp-plugin-host=true]{
  /* CPAMP exposes its design tokens inside same-origin plugin frames. Keep the
     plugin's component rules, but resolve their colors and geometry from the
     host so generic bridge rules cannot leave controls half CPAMC, half CPAMP. */
  --bg-secondary:var(--app-bg,#eff2f7);
  --bg-primary:var(--app-surface,#fff); --bg-tertiary:var(--app-surface-muted,#f6faff);
  --bg-hover:var(--app-accent-soft,var(--bg-tertiary));
  --floating-surface:var(--app-surface-strong,var(--bg-primary)); --floating-shadow:var(--glass-shadow,none);
  --text-primary:var(--app-text-primary,#2c3e50); --text-secondary:var(--app-text-regular,#5f6c7b);
  --text-tertiary:var(--app-text-muted,#8b95a6);
  --border-color:var(--app-border,#d8e5f2); --border-primary:var(--app-border-strong,var(--border-color));
  --border-hover:color-mix(in srgb,var(--primary-color) 28%,var(--border-color));
  --primary-color:var(--color-primary,#3b82f6); --primary-hover:var(--color-primary-light-3,#60a5fa);
  --primary-active:var(--color-primary-dark-2,#2563eb); --primary-contrast:#fff;
  --error-color:var(--color-danger,#ef4444);
  --success-badge-bg:var(--data-badge-success-bg,#f0fdf4);
  --success-badge-text:var(--data-badge-success-text,#16a34a);
  --success-badge-border:var(--data-badge-success-border,#bbf7d0);
  --failure-badge-bg:var(--data-badge-danger-bg,#fef2f2);
  --failure-badge-text:var(--data-badge-danger-text,#dc2626);
  --failure-badge-border:var(--data-badge-danger-border,#fecaca);
  --count-badge-bg:var(--data-badge-neutral-bg,#f8fafc);
  --count-badge-text:var(--data-badge-neutral-text,#475569);
  --info-badge-bg:var(--data-badge-info-bg,#eff6ff);
  --info-badge-text:var(--data-badge-info-text,#2563eb);
  --info-badge-border:var(--data-badge-info-border,#bfdbfe);
  --amber-color:var(--color-warning,#f59e0b); --amber-text:var(--data-badge-warning-text,#d97706);
  --amber-10:var(--data-badge-warning-bg,#fffbeb); --amber-30:var(--data-badge-warning-border,#fde68a);
  --quota-high-color:var(--success-color,var(--color-success,#10b981));
  --quota-medium-color:var(--warning-color,var(--color-warning,#e0aa14));
  --quota-low-color:var(--danger-color,var(--color-danger,var(--error-color)));
  --primary-10:var(--primary-ring,color-mix(in srgb,var(--primary-color) 10%,transparent));
  --table-header-bg:var(--app-surface-strong,var(--bg-primary));
  --table-header-bg:rgb(from var(--bg-primary) r g b / 1);
  --shadow:var(--glass-shadow,none); --radius-md:var(--app-radius-md,12px);
  --event-row-bg:var(--surface-subtle,var(--bg-tertiary));
  --event-row-border:var(--border-subtle,var(--app-border,var(--border-color)));
  --event-code-bg:var(--app-surface-strong,var(--bg-primary));
  --event-code-border:var(--app-border-strong,var(--border-primary));
  --event-error-rail:var(--color-danger,var(--error-color));
}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg-secondary);color:var(--text-primary);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Fira Sans","Droid Sans","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background-color .3s,color .3s}
a{color:var(--primary-active)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px}
h1{font-size:18px;margin:0}
h2{font-size:15px;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--text-tertiary)}
.small{font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
.card{background:var(--bg-primary);border:1px solid var(--border-color);border-radius:var(--radius-md);
  box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
button{appearance:none;min-height:35px;font:inherit;font-weight:400;line-height:1.5;border:1px solid var(--border-primary);
  background:var(--bg-primary);color:var(--text-primary);box-shadow:none;
  border-radius:var(--radius-md);padding:6px 12px;cursor:pointer;
  transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s}
button:hover:not(:disabled){border-color:var(--border-hover);background:var(--bg-hover)}
button:disabled{opacity:.6;cursor:not-allowed}
:root:not([data-cpamp-plugin-host=true]) button:focus-visible{
  outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--primary-color) 18%,transparent)}
button.primary{background:var(--primary-color);border-color:var(--primary-color);color:var(--primary-contrast)}
button.primary:hover:not(:disabled){background:var(--primary-hover);border-color:var(--primary-hover);color:var(--primary-contrast)}
button.danger{color:var(--error-color)}
button.danger:hover:not(:disabled){border-color:var(--error-color)}
button.link{min-height:0;border:none;background:none;padding:2px 4px;color:var(--primary-active)}
button.link:hover:not(:disabled){background:none;color:var(--text-primary);text-decoration:underline}
button.link.danger:hover:not(:disabled){color:var(--error-color)}
input,select,textarea{font:inherit;color:var(--text-primary);background:var(--bg-secondary);
  border:1px solid var(--border-primary);border-radius:var(--radius-md);padding:6px 9px;
  transition:background-color .15s,border-color .15s,box-shadow .15s}
input:not([type=checkbox]):not([type=radio]),select{min-height:35px}
input:focus,select:focus,textarea:focus{border-color:var(--primary-color);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--primary-color) 18%,transparent);outline:none}
input[type=number]{width:110px}
.native-select{position:relative;display:inline-flex;align-items:center;color:var(--text-secondary)}
.native-select::after{content:"";position:absolute;right:13px;top:50%;width:8px;height:8px;
  border-right:2px solid currentColor;border-bottom:2px solid currentColor;
  transform:translateY(-70%) rotate(45deg);pointer-events:none}
.native-select>select{-webkit-appearance:none;appearance:none;padding-right:34px;color:var(--text-primary)}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--text-secondary)}
label.field>input,label.field>select{font-weight:400}
:root:not([data-cpamp-plugin-host=true]) label.field>input,
:root:not([data-cpamp-plugin-host=true]) label.field>select{font-size:14px;line-height:1.5}
.table-scroll{width:100%;max-width:100%;overflow-x:auto;overscroll-behavior-inline:contain;
  -webkit-overflow-scrolling:touch}
table{width:max-content;min-width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border-color);vertical-align:middle}
th{font-size:12px;color:var(--text-secondary);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--bg-hover)}
.table-scroll .muted{color:var(--text-secondary)}
/* The management panel floats its own action bar (refresh, language, theme,
   sign out) over the top-right corner of this iframe, so that corner holds
   nothing: the header stays left-aligned and tall enough that the content below
   it clears the overlay. */
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:52px;padding-right:200px;margin-bottom:16px}
@media (max-width:768px){.head{padding-right:0;min-height:0;margin-bottom:12px}}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--border-color)}
.tabs button[data-tab],.tabs button[data-account-tab]{min-height:0;border:none;border-bottom:2px solid transparent;border-radius:0;padding:8px 14px;
  background:none;color:var(--text-secondary);box-shadow:none;font-weight:600;line-height:1.5}
.tabs button[data-tab]:hover,.tabs button[data-account-tab]:hover{background:none;color:var(--text-primary)}
.tabs button[data-tab].active,.tabs button[data-account-tab].active{color:var(--text-primary);border-bottom-color:var(--primary-color)}
.tag{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;
  line-height:1.5;white-space:nowrap;border:1px solid transparent}
.tag.ok{background:var(--success-badge-bg);color:var(--success-badge-text);border-color:var(--success-badge-border)}
.tag.warn{background:var(--amber-10);color:var(--amber-text);border-color:var(--amber-30)}
.tag.bad{background:var(--failure-badge-bg);color:var(--failure-badge-text);border-color:var(--failure-badge-border)}
.tag.info{background:var(--info-badge-bg);color:var(--info-badge-text);border-color:var(--info-badge-border)}
.tag.plain{background:var(--count-badge-bg);color:var(--count-badge-text)}
:root[data-cpamp-plugin-host=true] body{
  background-color:var(--app-bg,#eff2f7);background-image:var(--app-bg-gradient,none);
  background-attachment:fixed;
  font-family:var(--cpamp-plugin-font-family,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif)
}
:root[data-cpamp-plugin-host=true] input,
:root[data-cpamp-plugin-host=true] select,
:root[data-cpamp-plugin-host=true] textarea{
  min-height:34px;border-color:var(--app-input-border,var(--border-primary));
  background:var(--app-input-bg,var(--app-surface-strong,var(--bg-primary)));box-shadow:none
}
:root[data-cpamp-plugin-host=true] input:not([type=checkbox]):not([type=radio]),
:root[data-cpamp-plugin-host=true] select{padding-block:5px}
:root[data-cpamp-plugin-host=true] label.field>input,
:root[data-cpamp-plugin-host=true] label.field>select{font-size:13px;line-height:1.5}
:root[data-cpamp-plugin-host=true] input:focus,
:root[data-cpamp-plugin-host=true] select:focus,
:root[data-cpamp-plugin-host=true] textarea:focus{
  border-color:var(--app-input-border-focus,var(--primary-color));
  background:var(--app-input-bg-focus,var(--app-surface-strong,var(--bg-primary)));
  box-shadow:inset 0 0 0 1px var(--focus-inset)
}
:root[data-cpamp-plugin-host=true] .card{
  border-color:var(--glass-border,var(--border-color));border-radius:var(--app-radius-lg,20px);

}
:root[data-cpamp-plugin-host=true] .stat{border-radius:var(--app-radius-md,12px)}
:root[data-cpamp-plugin-host=true] .key-picker,
:root[data-cpamp-plugin-host=true] .model-picker-list{
  background:var(--app-surface-strong,var(--bg-primary))
}
:root[data-cpamp-plugin-host=true] button:not(.link){
  min-height:34px;padding:0 12px;border-color:var(--app-border,var(--border-color));
  border-radius:var(--app-radius-md,12px);background:var(--app-surface-muted,var(--bg-tertiary));
  font-weight:600;line-height:1.2
}
:root[data-cpamp-plugin-host=true] button:not(.link):hover:not(:disabled){
  border-color:var(--border-hover);background:var(--app-accent-soft,var(--bg-hover));color:var(--primary-color)
}
:root[data-cpamp-plugin-host=true] button.primary{
  border-color:var(--primary-solid,var(--primary-color));background:var(--primary-solid,var(--primary-color));
  color:var(--primary-contrast)
}
:root[data-cpamp-plugin-host=true] button.primary:hover:not(:disabled){
  border-color:var(--primary-solid-hover,var(--primary-hover));
  background:var(--primary-solid-hover,var(--primary-hover));color:var(--primary-contrast)

:root[data-cpamp-plugin-host=true] button.danger:not(.link){

}
:root[data-cpamp-plugin-host=true] button.link{
  min-height:0;padding:2px 4px;border:0;border-radius:0;background:none;box-shadow:none;font-weight:500;line-height:1.5
}
:root[data-cpamp-plugin-host=true] .tabs{
  width:max-content;max-width:100%;padding:4px;gap:4px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
  border:1px solid color-mix(in srgb,var(--border-color) 82%,transparent);border-radius:14px;
  background:color-mix(in srgb,var(--surface-subtle,var(--bg-tertiary)) 78%,var(--bg-primary));
  box-shadow:inset 0 1px 2px #0f17210d;scrollbar-width:none
}
:root[data-cpamp-plugin-host=true] .tabs::-webkit-scrollbar{display:none}

}

:root[data-cpamp-plugin-host=true] thead,

}
.usage{display:flex;flex-direction:column;gap:5px;min-width:118px;max-width:210px}
.usage>span{font-size:12px;white-space:nowrap}
.bar{height:6px;border-radius:999px;background:color-mix(in srgb,var(--text-primary) 8%,transparent);overflow:hidden;min-width:56px}
.quota-fill{display:block;height:100%;border-radius:999px;transition:width 360ms cubic-bezier(.23,1,.32,1)}
.quota-fill.high{background:var(--quota-high-color)}
.quota-fill.medium{background:var(--quota-medium-color)}
.quota-fill.low{background:var(--quota-low-color)}

.concurrency-editor{display:flex;align-items:center;gap:7px;min-width:172px}
.concurrency-editor .native-select,.concurrency-editor select{width:112px;min-width:112px}
.concurrency-editor .small{white-space:nowrap}

.notice.err{background:var(--failure-badge-bg);color:var(--failure-badge-text);border-color:var(--failure-badge-border)}
.notice.ok{background:var(--success-badge-bg);color:var(--success-badge-text);border-color:var(--success-badge-border)}
.hidden{display:none!important}
.gate{max-width:520px;margin:9vh auto;padding:20px}

<script>
"use strict";
/* Mirror the panel's live theme. A cross-origin parent cannot be read, so the
 * fallback uses its persisted preference or the operating system. This runs
 * before the body to avoid painting in the wrong theme. */
(function () {
  const STORE_KEY = "cli-proxy-theme";
  const PLUGIN_STORE_KEY = "cpa-key-billing:theme";
  const PREFIX = "enc::v1::";
  const SALT = "cli-proxy-api-webui::secure-storage";

  function parentDocument() {
    if (window.parent === window) return null;
    try { return window.parent.document; } catch (_) { return null; }
  }

  function storedTheme() {
    let raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (_) { return ""; }
    if (!raw) return "";
    try {
      if (raw.startsWith(PREFIX)) {
        const secret = new TextEncoder().encode(SALT + "|" + location.host + "|" + navigator.userAgent);
        const binary = atob(raw.slice(PREFIX.length));
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i) ^ secret[i % secret.length];
        raw = new TextDecoder().decode(bytes);
      }
      const theme = JSON.parse(raw)?.state?.theme;
      return typeof theme === "string" ? theme : "";
    } catch (_) { return ""; }
  }

  const systemDark = () => !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);

  function resolve(theme) {
    if (theme === "dark" || theme === "white") return theme;
    if (theme === "" || theme === "auto") return systemDark() ? "dark" : "white";
    return "";
  }

  function currentTheme() {
    const doc = parentDocument();
    if (doc) return doc.documentElement.getAttribute("data-theme") || "";
    try {
      const own = localStorage.getItem(PLUGIN_STORE_KEY);
      if (own === "dark" || own === "white") return own;
    } catch (_) {}
    return resolve(storedTheme());
  }

  function apply(theme) {
    const root = document.documentElement;
    if (theme === "dark" || theme === "white") root.setAttribute("data-theme", theme);
    else root.removeAttribute("data-theme");
    root.style.colorScheme = theme === "dark" ? "dark" : "light";
  }

  const sync = () => apply(currentTheme());
  sync();

  const doc = parentDocument();
  if (doc) {
    new MutationObserver(sync).observe(doc.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  } else {
    window.addEventListener("storage", (event) => { if (!event.key || event.key === STORE_KEY) sync(); });
  }
  if (window.matchMedia) {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", sync);
  }
  window.billingTheme = {
    current: currentTheme,
    toggle() {
      const next = currentTheme() === "dark" ? "white" : "dark";
      try { localStorage.setItem(PLUGIN_STORE_KEY, next); } catch (_) {}
      apply(next);
      window.dispatchEvent(new CustomEvent("billing-theme-change", { detail: next }));
      return next;
    },
  };
})();
</script>

<script>
"use strict";
const PLUGIN_BASE = "/v0/management/plugins/cpa-key-billing";
const ACCOUNT_BASE = "/v0/resource/plugins/cpa-key-billing/account";
const $ = (id) => document.getElementById(id);

/* A same-origin iframe can borrow the panel's obfuscated management key. When
 * it is unavailable, the standalone login can use its own encrypted vault. */
const PANEL_STORE_KEY = "cli-proxy-auth";
const PANEL_KEY = "managementKey";
const PANEL_PREFIX = "enc::v1::";
const PANEL_SALT = "cli-proxy-api-webui::secure-storage";
const CREDENTIAL_DB = "cpa-key-billing-credentials";
const CREDENTIAL_STORE = "vault";
const CREDENTIAL_KEY = "wrapping-key";

function panelDeobfuscate(raw) {
  if (typeof raw !== "string" || !raw.startsWith(PANEL_PREFIX)) return raw;
  const secret = new TextEncoder().encode(PANEL_SALT + "|" + location.host + "|" + navigator.userAgent);
  const binary = atob(raw.slice(PANEL_PREFIX.length));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i) ^ secret[i % secret.length];
  return new TextDecoder().decode(bytes);
}

function panelStoredValue(name) {
  let raw = null;
  try { raw = localStorage.getItem(name); } catch (_) { return null; }
  if (!raw) return null;
  try { return JSON.parse(panelDeobfuscate(raw)); } catch (_) { return null; }
}

function readPanelKey() {
  const session = panelStoredValue(PANEL_STORE_KEY);
  const fromStore = session && session.state && session.state.managementKey;
  if (typeof fromStore === "string" && fromStore.trim()) return fromStore.trim();

  const direct = panelStoredValue(PANEL_KEY);
  if (typeof direct === "string" && direct.trim()) return direct.trim();

  return "";
}

const embedded = window.parent !== window;
document.body.classList.toggle("embedded", embedded);
let authKey = "";
let currentRole = "";
let loginMode = location.hash === "#account" ? "account" : "admin";
let loginModeRequest = 0;
let state = { keys: [], plans: [], prices: [], groups: [], status: null, stats: null, logs: null, events: null };
let accountState = { overview: null, prices: null, logs: null, models: [] };
let accountTab = "usage";

function credentialRequest(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error("浏览器凭据存储失败"));
  });
}

function openCredentialDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB || !window.crypto?.subtle) {
      reject(new Error("当前浏览器不支持安全记住凭据"));
      return;
    }
    const request = indexedDB.open(CREDENTIAL_DB, 1);
    request.onupgradeneeded = () => request.result.createObjectStore(CREDENTIAL_STORE);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error("浏览器凭据存储失败"));
  });
}

async function credentialValue(name) {
  const db = await openCredentialDB();
  try {
    return await credentialRequest(db.transaction(CREDENTIAL_STORE).objectStore(CREDENTIAL_STORE).get(name));
  } finally {
    db.close();
  }
}

async function putCredentialValue(name, value) {
  const db = await openCredentialDB();
  try {
    const transaction = db.transaction(CREDENTIAL_STORE, "readwrite");
    transaction.objectStore(CREDENTIAL_STORE).put(value, name);
    await new Promise((resolve, reject) => {
      transaction.oncomplete = resolve;
      transaction.onerror = () => reject(transaction.error || new Error("浏览器凭据存储失败"));
      transaction.onabort = () => reject(transaction.error || new Error("浏览器凭据存储失败"));
    });
  } finally {
    db.close();
  }
}

async function deleteCredential(role) {
  try {
    const db = await openCredentialDB();
    try {
      const transaction = db.transaction(CREDENTIAL_STORE, "readwrite");
      transaction.objectStore(CREDENTIAL_STORE).delete(role);
      await new Promise((resolve, reject) => {
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error || new Error("浏览器凭据存储失败"));
      });
    } finally {
      db.close();
    }
  } catch (_) {}
}

async function wrappingKey() {
  let key = await credentialValue(CREDENTIAL_KEY);
  if (key) return key;
  key = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  await putCredentialValue(CREDENTIAL_KEY, key);
  return key;
}

async function rememberCredential(role, credential) {
  const key = await wrappingKey();
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(credential));
  await putCredentialValue(role, { iv: Array.from(iv), data: Array.from(new Uint8Array(data)) });
}

async function recalledCredential(role) {
  try {
    const saved = await credentialValue(role);
    if (!saved?.iv || !saved?.data) return "";
    const key = await wrappingKey();
    const data = await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(saved.iv) },
      key, new Uint8Array(saved.data));
    return new TextDecoder().decode(data).trim();
  } catch (_) {
    await deleteCredential(role);
    return "";
  }
}

// The plugin stores "every model" as an empty selection rather than as a group
// holding every model, so this identifier only ever travels: the picker offers
// it as a checkbox and the plugin normalizes a selection carrying it back to the
// empty one. Both are the same grant, and it is what a new key starts with.
const ALL_GROUP_ID = "all";
const ALL_GROUP_NAME = "全部模型";
const CONCURRENCY_OPTIONS = [0, 1, 2, 3, 5, 10, 20, 50];
const CUSTOM_CONCURRENCY = "__custom__";
const LOG_BATCH_SIZE = 50;
const LOG_EXPORT_BATCH_SIZE = 1000;
const LOG_LOAD_MORE_THRESHOLD_PX = 320;
const LOG_CSV_COLUMNS = [
  "at", "scope", "auth_index", "executor_type", "reasoning_effort", "service_tier",
  "upstream_model", "billing_model", "failed", "latency_ms", "ttft_ms", "accounting_quality",

// CLIProxyAPI HTML-escapes every string in a plugin management response, so a
// label saved as "A & B" comes back as "A &amp; B". Left alone it would gain
// another layer on every round trip, so responses are decoded on arrival.
const ENTITIES = [[/&lt;/g, "<"], [/&gt;/g, ">"], [/&#34;/g, '"'], [/&#39;/g, "'"], [/&amp;/g, "&"]];
function unescapeDeep(value) {
  if (typeof value === "string") {
    let out = value;
    for (const [pattern, replacement] of ENTITIES) out = out.replace(pattern, replacement);
    return out;
  }
  if (Array.isArray(value)) return value.map(unescapeDeep);
  if (value && typeof value === "object") {
    const out = {};
    for (const key of Object.keys(value)) out[key] = unescapeDeep(value[key]);
    return out;
  }
  return value;
}

class AuthError extends Error {}

async function api(method, path, body, opts) {
  const init = { method, headers: { "Authorization": "Bearer " + authKey } };
  if (body !== undefined && body !== null) {
    init.headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(body);
  }
  const resp = await fetch(location.origin + path, init);
  const text = await resp.text();
  let payload = null;
  if (text) { try { payload = JSON.parse(text); } catch (_) { payload = null; } }
  if (!resp.ok) {
    const detail = payload && payload.error ? (payload.error.message ?? payload.error) : text;
    const message = typeof detail === "string" ? unescapeDeep(detail).trim() : "";
    if (resp.status === 401 || resp.status === 403) {
      throw new AuthError(message || (currentRole === "account" ? "API Key 无效或已被拒绝" : "管理密钥无效或已被拒绝"));
    }
    throw new Error(message || ("HTTP " + resp.status));
  }
  return (opts && opts.raw) ? payload : unescapeDeep(payload);
}

const plugin = (method, path, body) => api(method, PLUGIN_BASE + path, body);

function modelIDs(payload) {
  const list = (payload && payload.data) || (payload && payload.models) || (Array.isArray(payload) ? payload : []);
  const seen = new Set();
  return list.map((item) => String(typeof item === "string" ? item : item?.id || item?.name || "").trim())
    .filter((model) => {
      const key = model.toLowerCase();
      if (!key || seen.has(key)) return false;
      seen.add(key);
      return true;
    });
}

function usd(value) {
  const amount = Number(value || 0);
  if (amount === 0) return "$0";
  const absolute = Math.abs(amount);
  const digits = absolute >= 1 ? 2 : absolute >= 0.01 ? 4 : 6;
  const compact = amount.toLocaleString("en-US", { maximumFractionDigits: digits });
  const rounded = Number(compact.replaceAll(",", ""));
  if (rounded === 0) return "<$0.000001";
  const tolerance = Number.EPSILON * Math.max(1, absolute) * 8;
  if (Math.abs(amount - rounded) <= tolerance) return "$" + compact;
  return "$" + amount.toLocaleString("en-US", {
    minimumFractionDigits: digits,
    maximumFractionDigits: digits,
  });
}
function remainingQuota(usedPercent) {
  const used = Number(usedPercent || 0);
  const percent = 100 - Math.max(0, Math.min(100, Number.isFinite(used) ? used : 0));
  return { percent, level: percent >= 70 ? "high" : percent >= 30 ? "medium" : "low" };
}
function int(value) { return Number(value || 0).toLocaleString("zh-CN"); }
function tokens(value) {
  const n = Number(value || 0);
  if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return String(n);
}
function exactTokens(value) {
  return Math.trunc(Number(value || 0)).toLocaleString("en-US");
}
function latency(value) {
  const milliseconds = Number(value || 0);
  if (!Number.isFinite(milliseconds) || milliseconds <= 0) return "—";
  if (milliseconds < 1000) return Math.round(milliseconds) + " ms";
  return (milliseconds / 1000).toFixed(2) + " s";
}
function outputTPS(cost, latencyMS, measured) {
  const totalLatency = Number(latencyMS || 0);
  const totalOutputTokens = Number(cost.billed_output_tokens || 0);
  if (!measured || !Number.isFinite(totalLatency) || totalLatency <= 0 ||
      !Number.isFinite(totalOutputTokens) || totalOutputTokens < 0) return "—";
  return (totalOutputTokens * 1000 / totalLatency).toFixed(1) + " t/s";
}
function cacheReadRate(cacheRead, totalInput) {
  const input = Number(totalInput || 0);
  if (input <= 0) return "0.00%";
  return (Number(cacheRead || 0) / input * 100).toFixed(2) + "%";
}
function tokenThreshold(value) {
  const n = Number(value || 0);
  if (n >= 1e9) return String(Number((n / 1e9).toFixed(3))) + "B";
  if (n >= 1e6) return String(Number((n / 1e6).toFixed(3))) + "M";
  if (n >= 1e3) return String(Number((n / 1e3).toFixed(3))) + "K";
  return exactTokens(n);
}
function when(value) {
  if (!value) return "—";
  const date = new Date(value);
  if (isNaN(date.getTime()) || date.getFullYear() < 2000) return "—";
  return date.toLocaleString("zh-CN", { hour12: false });
}

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attrs || {})) {
    if (name === "class") node.className = value;
    else if (name === "text") node.textContent = value;
    else if (name.startsWith("on")) node.addEventListener(name.slice(2), value);
    else if (value !== null && value !== undefined && value !== false) node.setAttribute(name, value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  return node;
}
function table(headers, rows) {
  if (!rows.length) return el("div", { class: "empty", text: "暂无数据" });
  const head = el("tr", {}, headers.map((h) => el("th", { class: h.num ? "num" : "" }, h.label ?? h)));
  return el("div", { class: "table-scroll" },
    el("table", {}, el("thead", {}, head), el("tbody", {}, rows)));
}
function replaceContent(target, ...children) {
  if (target.childNodes.length === children.length &&
      children.every((child, index) => target.childNodes[index].isEqualNode(child))) return;
  target.replaceChildren(...children);
}
function periodText(period) {
  if (!period) return "—";
  switch (period.kind) {
    case "weekly": return "7 天";
    case "monthly": return "30 天";
    case "custom": return "每 " + int(period.seconds) + " 秒";
    case "never": return "不重置";
    default: return "24 小时";
  }
}

let noticeTimer = 0;
function notify(message, kind) {
  const node = $(currentRole === "account" ? "account-notice" : "notice");
  node.textContent = message;
  node.className = "notice show " + (kind || "ok");
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { node.className = "notice"; }, kind === "err" ? 9000 : 4000);
}
function fail(err) {
  if (err instanceof AuthError) { showGate(currentRole || loginMode, err.message); return; }
  notify(err.message || String(err), "err");
}
async function guard(fn) { try { await fn(); } catch (err) { fail(err); } }

function ask(title, text, value) {
  return new Promise((resolve) => {
    $("dlg-title").textContent = title;
    $("dlg-text").textContent = text || "";
    $("dlg-input").value = value || "";
    $("dlg-input").classList.toggle("hidden", value === undefined);
    const close = (result) => { $("dlg").close(); resolve(result); };
    $("dlg-ok").onclick = () => close(value === undefined ? true : $("dlg-input").value);
    $("dlg-cancel").onclick = () => close(null);
    $("dlg").showModal();
    if (value !== undefined) $("dlg-input").focus();
  });
}

function previewCredential(value) {

}

async function setLoginMode(mode, preserveError) {

  if (!embedded) {
    const url = new URL(location.href);
    url.hash = loginMode === "account" ? "account" : "";

  const account = loginMode === "account";
  $("gate-mode-admin").classList.toggle("active", !account);
  $("gate-mode-admin").setAttribute("aria-selected", String(!account));
  $("gate-mode-account").classList.toggle("active", account);
  $("gate-mode-account").setAttribute("aria-selected", String(account));
  $("gate-key-label").textContent = account ? "API Key" : "管理密钥";
  $("gate-username").value = account ? "api-key" : "administrator";
  $("gate-key").placeholder = account ? "输入 API Key" : "输入 Management Key";
  $("gate-submit").textContent = account ? "查看我的用量" : "进入管理控制台";
  $("gate-key").value = "";
  if (!preserveError) {
    $("gate-error").textContent = "";
    $("gate-error").className = "notice err";
  }
  const saved = await recalledCredential(loginMode);
  if (ticket !== loginModeRequest) return;
  if (saved) $("gate-key").placeholder = "已记住密码，可直接继续";
  $("gate-remember").checked = !!saved;
}

async function reloadAll() {
  // Everything the page renders outside the two log tabs arrives in one call:
  // a reload happens on every tab switch and after every edit, and each call is
  // a separate authenticated round trip.
  //
  // The two logs stay out of it. They are the payloads that grow with traffic
  // rather than with configuration, so each is fetched only while its own tab
  // is open, and the billing log arrives incrementally in bounded batches.
  const [overview, events] = await Promise.all([
    plugin("GET", "/overview"),
    document.querySelector('[data-tab="events"].active') ? plugin("GET", "/events") : Promise.resolve(null),
    document.querySelector('[data-tab="logs"].active') ? loadLogs() : Promise.resolve(null),
  ]);
  state.status = overview.status;
  // Deleted keys stay in the directory so the summary still counts their spend
  // and the billing log can still name them. Dropping them here is what keeps
  // them out of the key list, the plan bindings and the plan editor alike.
  state.keys = (overview.keys || []).filter((view) => !view.deleted_at);
  state.plans = overview.plans || [];
  state.prices = overview.prices || [];
  state.groups = overview.model_groups || [];
  state.stats = overview.stats;
  if (events) state.events = events.events || [];
  render();
}

  accountTab = ["usage", "prices", "logs"].includes(tab) ? tab : "usage";
  document.querySelectorAll("[data-account-tab]").forEach((button) => {
    const active = button.dataset.accountTab === accountTab;
    button.classList.toggle("active", active);
    button.setAttribute("aria-selected", String(active));
  });
  for (const name of ["usage", "prices", "logs"]) {
    $("account-tab-" + name).classList.toggle("hidden", name !== accountTab);
  }
  if (reload !== false && currentRole === "account") {
    const wasRefreshing = !!refreshPromise;
    const pending = refreshCurrentView(false);
    if (wasRefreshing) pending.finally(() => {
      if (currentRole === "account" && accountTab === tab) refreshCurrentView(false);
    });
  }
}

function renderAccountLogs() {
  hideCostTooltip();
  const view = accountState.logs;
  const note = $("account-log-note");
  const scroller = $("account-logs");
  if (!view) {
    note.textContent = "";
    if (logLoading) {
      scroller.replaceChildren(el("div", { class: "empty", text: "加载中…" }));
    } else if (logLoadError) {
      scroller.replaceChildren(el("div", { class: "empty" },
        el("div", { text: "计费日志加载失败" }),
        el("button", { style: "margin-top:10px", onclick: () => guard(() => loadLogs(false, true)) }, "重试")));
    } else {
      scroller.replaceChildren(el("div", { class: "empty", text: "暂无数据" }));
    }
    return;
  }
  populateLogFilters(view.filter_options, true);
  labelLogStatuses($("account-log-status"), view.status_counts);
  updateLogFilterControls(true);
  const entries = view.entries || [];
  note.textContent = "已加载 " + int(entries.length) + " / " + int(view.total) + " 条";
  const previousScrollTop = scroller.scrollTop;
  const previousScrollLeft = scroller.scrollLeft;
  const rows = entries.map((entry) => {
    const statusMarks = [];
    if (entry.failed) statusMarks.push(el("span", { class: "tag bad", text: "失败" }));
    if (entry.accounting_quality && entry.accounting_quality !== "complete") {
      statusMarks.push(el("span", { class: "tag warn",
        text: entry.accounting_quality === "inconsistent" ? "Token 明细异常" : "Token 未分类" }));
    }
    if (!statusMarks.length) statusMarks.push(el("span", { class: "tag ok", text: "正常" }));
    const cost = {
      uncached_input_tokens: entry.uncached_input_tokens || 0,
      cache_read_tokens: entry.cache_read_tokens || 0,
      cache_write_tokens: entry.cache_write_tokens || 0,
      billed_output_tokens: entry.output_tokens || 0,
    };
    const input = cost.uncached_input_tokens + cost.cache_read_tokens + cost.cache_write_tokens;
    const output = cost.billed_output_tokens;
    const measured = entry.accounting_quality === "complete";
    const tokens = (value) => measured ? exactTokens(value) : "—";
    const hasTTFT = Number(entry.ttft_ms || 0) > 0;
    return el("tr", {},
      el("td", { class: "small" }, when(entry.at)),
      el("td", { class: "small" }, el("div", { class: "log-cell-line mono" }, entry.billing_model || "—")),
      el("td", { class: "small" },
        el("div", { class: "log-cell-line mono" }, entry.executor_type || "执行器未知"),
        el("div", { class: "log-source muted" }, entry.source || "来源未知")),
      el("td", { class: "small" },
        el("div", { class: "log-cell-line mono" }, entry.reasoning_effort || "—"),
        el("div", { class: "log-cell-line muted" }, entry.service_tier || "—")),
      el("td", { class: "log-status" }, statusMarks),
      el("td", { class: "num" },
        el("div", {}, outputTPS(cost, entry.latency_ms, measured)),
        el("div", { class: "muted small", title: hasTTFT ? "首字延迟 · 总延迟" : "总延迟" },
          hasTTFT ? latency(entry.ttft_ms) + " · " + latency(entry.latency_ms) : latency(entry.latency_ms))),
      el("td", { class: "num" }, tokens(input)),
      el("td", { class: "num" },
        el("div", {}, tokens(cost.cache_read_tokens)),
        measured ? el("div", { class: "muted small" }, cacheReadRate(cost.cache_read_tokens, input)) : null),
      el("td", { class: "num" }, tokens(cost.cache_write_tokens)),
      el("td", { class: "num" },
        el("div", {}, tokens(output)),
        measured && entry.reasoning_tokens
          ? el("div", { class: "muted small" }, "推理 " + exactTokens(entry.reasoning_tokens)) : null),
      el("td", { class: "num" }, usd(entry.total_usd)));
  });

  const content = [table(
    ["时间", "模型", "执行器 / 来源", "推理 / 速度", "状态", { label: "TPS / 延迟", num: true },
      { label: "输入", num: true }, { label: "缓存读取", num: true }, { label: "缓存写入", num: true },
      { label: "输出", num: true }, { label: "费用", num: true }], rows)];
  if (logLoadingMore) {
    content.push(el("div", { class: "log-load-state", role: "status", text: "正在加载更多…" }));
  } else if (!logAutoLoadMore && logHasMore) {
    content.push(el("div", { class: "log-load-state" },
      el("button", { onclick: () => guard(() => loadLogs(true, true)) }, "重试加载")));
  }
  replaceContent(scroller, ...content);
  scroller.scrollTop = previousScrollTop;
  scroller.scrollLeft = previousScrollLeft;
  requestAnimationFrame(() => maybeLoadMoreLogs(true));
}
