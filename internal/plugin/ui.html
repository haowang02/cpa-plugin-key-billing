      function authProviderIcon(category) {
        const key =
          category === "gemini-cli" || category === "gemini-interactions"
            ? "gemini"
            : category;
        const icon = AUTH_PROVIDER_ICONS[key];
        if (!icon) return null;
        const svg = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "svg",
        );
        svg.setAttribute("viewBox", icon.viewBox);
        svg.setAttribute("aria-hidden", "true");
        for (const item of icon.paths) {
          const path = document.createElementNS(svg.namespaceURI, "path");
          for (const [name, value] of Object.entries(item))
            if (name !== "d") path.setAttribute(name, value);
          path.setAttribute("d", item.d);
          svg.append(path);
        }
        return el(
          "span",
          {
            class: "auth-provider-icon",
            "data-provider": key,
            "aria-hidden": "true",
          },
          svg,
        );
      }

      function authUI(account) {
        const prefix = account ? "account-auth" : "auth";
        return {
          owner: account ? accountState : state,
          body: $(prefix + "-files-body"),
          enabledOnly: $(prefix + "-enabled-only"),
          provider: $(prefix + "-provider"),
          search: $(prefix + "-search"),
          bulk: $(prefix + "-refresh-filtered"),
        };
      }

      const AUTH_QUOTA_CACHE_PREFIX = "cpa-key-billing.auth-quotas.v1.";

      function resetAuthQuotaMemory(account) {
        const role = account ? "account" : "admin";
        const owner = account ? accountState : state;
        authQuotaGeneration[role]++;
        owner.authQuotas.clear();
        owner.authQuotaLoading.clear();
        owner.authQuotaErrors.clear();
        const bulk = authUI(account).bulk;
        if (bulk) {
          bulk.dataset.loading = "false";
          setLabeledActionIcon(bulk, "refresh", "更新限额");
        }
      }

      function authQuotaStorageKey(role) {
        const scope = authQuotaScope[role];
        return scope ? AUTH_QUOTA_CACHE_PREFIX + role + "." + scope : "";
      }

      function persistAuthQuotaCache(account) {
        const role = account ? "account" : "admin";
        const key = authQuotaStorageKey(role);
        if (!key) return;
        const owner = account ? accountState : state;
        try {
          sessionStorage.setItem(
            key,
            JSON.stringify({ entries: [...owner.authQuotas] }),
          );
        } catch (_) {}
      }

      function clearAuthQuotaCache(account) {
        const role = account ? "account" : "admin";
        const key = authQuotaStorageKey(role);
        if (key) {
          try {
            sessionStorage.removeItem(key);
          } catch (_) {}
        }
        authQuotaScope[role] = "";
        resetAuthQuotaMemory(account);
      }

      async function activateAuthQuotaCache(account, credential) {
        const role = account ? "account" : "admin";
        resetAuthQuotaMemory(account);
        authQuotaScope[role] = "";
        if (!window.crypto?.subtle) return;
        let digest;
        try {
          const bytes = new TextEncoder().encode(role + "|" + credential);
          digest = new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
        } catch (_) {
          return;
        }
        authQuotaScope[role] = [...digest]
          .slice(0, 16)
          .map((value) => value.toString(16).padStart(2, "0"))
          .join("");
        let cached;
        try {
          cached = JSON.parse(
            sessionStorage.getItem(authQuotaStorageKey(role)) || "null",
          );
        } catch (_) {
          return;
        }
        if (!Array.isArray(cached?.entries)) return;
        const owner = account ? accountState : state;
        for (const entry of cached.entries) {
          if (
            Array.isArray(entry) &&
            typeof entry[0] === "string" &&
            entry[1] &&
            typeof entry[1] === "object"
          ) {
            owner.authQuotas.set(entry[0], entry[1]);
          }
        }
      }

      function loadAuthFiles(account, deferRender) {
        account = account === true;
        const load = account
          ? detailLoads.accountAuthFiles
          : detailLoads.adminAuthFiles;
        return loadResource(
          load,
          () =>
            account ? accountAPI("/auth-files") : plugin("GET", "/auth-files"),
          (result) => updateAuthFiles(account, result.files || []),
          () => renderAuthFiles(account),
          deferRender,
        );
      }

      function updateAuthFiles(account, files) {
        const role = account ? "account" : "admin";
        const owner = account ? accountState : state;
        const byIndex = new Map(files.map((file) => [file.auth_index, file]));
        const previous = new Map(
          (owner.authFiles || []).map((file) => [
            file.auth_index,
            file.cache_revision || "",
          ]),
        );
        const changed = new Set(
          files
            .filter(
              (file) =>
                previous.has(file.auth_index) &&
                previous.get(file.auth_index) !== (file.cache_revision || ""),
            )
            .map((file) => file.auth_index),
        );
        const staleIndex = (index) => {
          const file = byIndex.get(index);
          if (!file || changed.has(index)) return true;
          const result = owner.authQuotas.get(index);
          return (
            !!file.cache_revision &&
            !!result &&
            result.auth_revision !== file.cache_revision
          );
        };
        const stale = [
          ...owner.authQuotas.keys(),
          ...owner.authQuotaErrors.keys(),
          ...owner.authQuotaLoading,
        ].some(staleIndex);
        owner.authFiles = files;
        if (!stale) return;
        authQuotaGeneration[role]++;
        for (const index of owner.authQuotas.keys())
          if (staleIndex(index)) owner.authQuotas.delete(index);
        for (const index of owner.authQuotaErrors.keys())
          if (staleIndex(index)) owner.authQuotaErrors.delete(index);
        owner.authQuotaLoading.clear();
        persistAuthQuotaCache(account);
      }

      function authQuotaCacheCurrent(account, owner, generation, index) {
        const role = account ? "account" : "admin";
        const currentOwner = account ? accountState : state;
        return (
          owner === currentOwner &&
          generation === authQuotaGeneration[role] &&
          (owner.authFiles || []).some((file) => file.auth_index === index)
        );
      }

      function authPlanLabel(category, value) {
        const plan = String(value || "").trim();
        if (!plan) return "";
        if (category === "codex") {
          const labels = new Map([
            ["free", "Free"],
            ["plus", "Plus"],
            ["team", "Team"],
            ["pro-5x", "Pro 5x"],
            ["pro-20x", "Pro 20x"],
            ["enterprise", "Enterprise"],
          ]);
          const known = labels.get(plan.toLocaleLowerCase());
          if (known) return known;
        }
        return plan;
      }

      function filteredAuthFiles(account) {
        const ui = authUI(account);
        const provider = ui.provider.value;
        const search = ui.search.value.trim().toLocaleLowerCase();
        return (ui.owner.authFiles || []).filter((file) => {
          if (ui.enabledOnly.checked && file.disabled) return false;
          if (provider && file.category !== provider) return false;
          if (!search) return true;
          const currentPlan = ui.owner.authQuotas.get(file.auth_index)?.plan;
          return [file.name, file.email, currentPlan, file.category].some(
            (value) =>
              String(value || "")
                .toLocaleLowerCase()
                .includes(search),
          );
        });
      }

      function quotaRemaining(row) {
        let percent = null;
        if (Number.isFinite(Number(row.remaining_fraction)))
          percent = Number(row.remaining_fraction) * 100;
        else if (Number.isFinite(Number(row.used_percent)))
          percent = 100 - Number(row.used_percent);
        else if (
          Number(row.limit) > 0 &&
          Number.isFinite(Number(row.remaining))
        )
          percent = (Number(row.remaining) / Number(row.limit)) * 100;
        if (percent === null) return null;
        percent = Math.max(0, Math.min(100, percent));
        return {
          percent,
          level: percent >= 70 ? "high" : percent >= 30 ? "medium" : "low",
        };
      }

      function compactResetDate(value) {
        const date = value instanceof Date ? value : new Date(value);
        if (isNaN(date.getTime())) return "";
        const pad = (part) => String(part).padStart(2, "0");
        return (
          pad(date.getMonth() + 1) +
          "/" +
          pad(date.getDate()) +
          " " +
          pad(date.getHours()) +
          ":" +
          pad(date.getMinutes())
        );
      }

      function compactResetAfter(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) return "";
        if (seconds < 60) return "不到1分钟后";
        if (seconds >= 86400) return Math.floor(seconds / 86400) + "天后";
        if (seconds >= 3600) return Math.floor(seconds / 3600) + "小时后";
        return Math.floor(seconds / 60) + "分钟后";
      }

      function quotaResetMeta(row, fetchedAt) {
        const seconds = Number(row.reset_after_seconds);
        let resetAt = row.reset_at ? new Date(row.reset_at) : null;
        if (
          (!resetAt || isNaN(resetAt.getTime())) &&
          Number.isFinite(seconds) &&
          seconds >= 0
        ) {
          const fetched = new Date(fetchedAt);
          const base = isNaN(fetched.getTime())
            ? Date.now()
            : fetched.getTime();
          resetAt = new Date(base + seconds * 1000);
        }
        const after =
          Number.isFinite(seconds) && seconds >= 0
            ? seconds
            : resetAt && !isNaN(resetAt.getTime())
              ? Math.max(0, Math.floor((resetAt.getTime() - Date.now()) / 1000))
              : NaN;
        return {
          at: resetAt ? compactResetDate(resetAt) : "",
          after: compactResetAfter(after),
        };
      }

      function quotaAmount(row) {
        if (
          !Number.isFinite(Number(row.used)) &&
          !Number.isFinite(Number(row.limit)) &&
          !Number.isFinite(Number(row.remaining))
        )
          return "";
        const money = row.money_cents === true;
        const format = (value) =>
          money
            ? usd(Number(value) / 100)
            : Number(value).toLocaleString("zh-CN", {
                maximumFractionDigits: 2,
              });
        if (
          Number.isFinite(Number(row.used)) &&
          Number.isFinite(Number(row.limit))
        )
          return format(row.used) + " / " + format(row.limit);
        if (Number.isFinite(Number(row.remaining)))
          return "剩余 " + format(row.remaining);
        if (Number.isFinite(Number(row.used)))
          return "已用 " + format(row.used);
        if (Number.isFinite(Number(row.limit)))
          return "额度 " + format(row.limit);
        return "";
      }

      function quotaLabel(row) {
        const label = String(row.label || "");
        const group = String(row.group_label || "");
        return group && group.toLocaleLowerCase() !== label.toLocaleLowerCase()
          ? group + " · " + label
          : group || label;
      }

      function renderQuotaRow(row, fetchedAt) {
        const label = quotaLabel(row);
        const remaining = quotaRemaining(row);
        const value = remaining ? remaining.percent.toFixed(0) + "%" : "—";
        const reset = quotaResetMeta(row, fetchedAt);
        const amount = quotaAmount(row);
        const stats = [el("span", { class: "auth-quota-value", text: value })];
        if (amount) stats.push(el("span", { text: amount }));
        if (reset.at) stats.push(el("span", { text: reset.at }));
        if (reset.after) stats.push(el("span", { text: "· " + reset.after }));

          "div",
          { class: "auth-quota-row" },
          el(
            "div",
            { class: "auth-quota-line" },
            el("span", {
              class: "auth-quota-label",
              title: label,
              text: label,
            }),
            el("span", { class: "auth-quota-stats" }, stats),
          ),
          el(
            "div",
            {

              role: "progressbar",

              "aria-valuemin": "0",
              "aria-valuemax": "100",

      const AUTH_QUOTA_TIMEOUT_MS = 65000;
      const AUTH_QUOTA_BATCH_CONCURRENCY = 3;

      async function refreshAuthQuota(file, account, shouldRender = true) {
        const owner = account ? accountState : state;
        const role = account ? "account" : "admin";
        const generation = authQuotaGeneration[role];
        if (owner.authQuotaLoading.has(file.auth_index)) return;
        owner.authQuotaLoading.add(file.auth_index);
        owner.authQuotaErrors.delete(file.auth_index);
        if (shouldRender) renderAuthFiles(account);
        try {
          const path =
            "/auth-files/quota?auth_index=" +
            encodeURIComponent(file.auth_index);
          const opts = { timeoutMS: AUTH_QUOTA_TIMEOUT_MS };
          const result = account
            ? await accountAPI(path, opts)
            : await plugin("GET", path, null, opts);
          if (
            authQuotaCacheCurrent(account, owner, generation, file.auth_index)
          ) {
            owner.authQuotas.set(file.auth_index, result);
            persistAuthQuotaCache(account);
          }
        } catch (error) {
          if (
            authQuotaCacheCurrent(account, owner, generation, file.auth_index)
          ) {
            owner.authQuotaErrors.set(
              file.auth_index,
              error.message || String(error),
            );
          }
        } finally {
          if (
            authQuotaCacheCurrent(account, owner, generation, file.auth_index)
          ) {
            owner.authQuotaLoading.delete(file.auth_index);
            if (shouldRender) renderAuthFiles(account);
          }
        }
      }

      async function refreshFilteredAuthQuotas(account) {
        const ui = authUI(account);
        const role = account ? "account" : "admin";
        const generation = authQuotaGeneration[role];
        const files = filteredAuthFiles(account).filter(
          (file) =>
            file.quota_supported &&
            !ui.owner.authQuotaLoading.has(file.auth_index),
        );
        if (!files.length || ui.bulk.dataset.loading === "true") return;
        ui.bulk.dataset.loading = "true";
        ui.bulk.disabled = true;
        let next = 0;
        let completed = 0;
        try {
          const worker = async () => {
            while (next < files.length) {
              const file = files[next++];
              await refreshAuthQuota(file, account, false);
              if (generation !== authQuotaGeneration[role]) return;
              completed++;
              setLabeledActionIcon(
                ui.bulk,
                "refresh",
                "更新中 " + completed + " / " + files.length,
              );
              renderAuthFiles(account);
            }
          };
          await Promise.all(
            Array.from(
              { length: Math.min(AUTH_QUOTA_BATCH_CONCURRENCY, files.length) },
              worker,
            ),
          );
        } finally {
          if (generation === authQuotaGeneration[role]) {
            ui.bulk.dataset.loading = "false";
            setLabeledActionIcon(ui.bulk, "refresh", "更新限额");
            renderAuthFiles(account);
          }
        }
      }

      async function copyAPIKey(button, view) {
        button.disabled = true;
        try {
          const list = await api("GET", "/v0/management/api-keys", null, {
            raw: true,
          });
          const salt = "cli-proxy-api:caller-scope:v1\u0000";
          const encoder = new TextEncoder();
          let key = "";
          for (const value of (list && list["api-keys"]) || []) {
            const candidate = String(value || "").trim();
            const digest = await crypto.subtle.digest(
              "SHA-256",
              encoder.encode(salt + candidate),
            );
            const scope = Array.from(new Uint8Array(digest), (byte) =>
              byte.toString(16).padStart(2, "0"),
            ).join("");
            if (scope === view.scope) {
              key = candidate;
              break;
            }
          }
          if (!key) throw new Error("该 API Key 已不在 CLIProxyAPI 配置中");
          await navigator.clipboard.writeText(key);
          button.classList.add("copied");
          setActionIcon(button, "check", "已复制");
          setTimeout(() => {
            if (!button.isConnected) return;
            button.classList.remove("copied");
            setActionIcon(button, "copy", "复制 API Key");
          }, 2000);
        } finally {
          button.disabled = false;
        }
      }

      async function saveConcurrency(view, raw) {
        const text = String(raw ?? "").trim();
        if (!/^\d+$/.test(text))
          throw new Error("并发限制必须是 0 到 10000 之间的整数");
        const limit = Number(text);
        if (!Number.isSafeInteger(limit) || limit < 0 || limit > 10000) {
          throw new Error("并发限制必须是 0 到 10000 之间的整数");
        }
        await plugin("POST", "/keys/concurrency", {
          scope: view.scope,
          concurrency_limit: limit,
        });
        notify(limit ? "并发限制已更新为 " + limit : "已取消并发限制");
        await refreshPage("foreground");
      }

      function cycleNote(view, periodKind) {
        if (view.unlimited) return "—";

          periodKind ||
          state.plans.find((plan) => plan.id === view.plan_id)?.period?.kind;

      function routeName(id) {
        const route = state.routes.find((entry) => entry.id === id);

      function credentialLabel(item) {
        if (item.source === "auth-files") return item.provider + " · " + (item.display_name || "未提供邮箱");
        return "AI 供应商 · " + item.provider + " · " + item.display_name;
      }

      function credentialProviderFromValue(value) {
        const separator = String(value).indexOf("\u0000");
        if (separator <= 0 || separator === String(value).length - 1) return null;
        return { source: String(value).slice(0, separator), provider: String(value).slice(separator + 1) };
      }

      function credentialProviderLabel(item) {
        return (item.source === "auth-files" ? "认证文件" : "AI 供应商") + " · " + item.provider;
      }

      function bindingKey(binding) { return binding.kind + "\u0000" + binding.value; }

      function bindingName(binding) {
        if (binding.kind === "route") return routeName(binding.value);
        if (binding.kind === "model") return "单模型 · " + binding.value;
        if (binding.kind === "credential_provider") {
          const provider = credentialProviderFromValue(binding.value);
          return provider ? credentialProviderLabel(provider) : "凭证类别已不存在";
        }
        const credential = state.credentials.find((item) => item.ref === binding.value);
        return credential ? credentialLabel(credential) : "上游凭证已不存在";
      }

      function routeTrigger(view) {

        const parts = names.flatMap((entry, index) => [
          index ? "、" : null,
          el("span", { class: entry.mono ? "mono" : "" }, entry.text),
          entry.tag ? el("span", { class: "tag warn settings-item-chip", text: entry.tag }) : null,

        return el(

            class: "route-trigger",
            title: names.map((entry) => entry.text + (entry.tag ? " · " + entry.tag : "")).join("、"),

            onclick: (event) => openRoutePicker(view, event.currentTarget),

          parts,

      // Glob rows are pricing rules, not callable models.
      function catalogModels() {
        return (state.prices || [])
          .map((row) => row.pattern)
          .filter((pattern) => pattern && !/[*?]/.test(pattern))
          .sort(compareModelId);
      }

      // Keep retired selections so a temporary provider outage cannot rewrite access.
      function retiredModels(selected) {
        const known = new Set(
          catalogModels().map((model) => model.toLowerCase()),
        );
        return [...selected]
          .filter((model) => !known.has(model.toLowerCase()))
          .sort(compareModelId);
      }

      function matchesTerm(text, term) {
        return !term || String(text).toLowerCase().includes(term);
      }

      let routePicker = {
        scope: "",
        all: true,
        bindings: new Map(),
        expanded: { routes: true, credentials: true, models: true },
        searching: false,
        beforeSearch: null,
        anchor: null,
      };

      function openRoutePicker(view, anchor) {
        routePicker = {
          scope: view.scope,
          all: !(view.route_bindings || []).length,
          bindings: new Map((view.route_bindings || []).map((binding) => [bindingKey(binding), binding])),
          expanded: { routes: true, credentials: true, models: true },
          searching: false,
          beforeSearch: null,
          anchor,
        };
        $("route-picker-search").value = "";
        $("route-picker").classList.remove("hidden");
        renderRoutePicker();
        positionRoutePicker();
        $("route-picker-search").focus();
      }

      function closeRoutePicker() {
        routePicker.scope = "";
        routePicker.anchor = null;
        $("route-picker").classList.add("hidden");
      }

      function positionRoutePicker() {
        const node = $("route-picker");
        if (!routePicker.anchor || node.classList.contains("hidden")) return;
        const anchorRect = routePicker.anchor.getBoundingClientRect();
        const rect = node.getBoundingClientRect();
        const margin = 8;
        let left = anchorRect.left;
        if (left + rect.width > innerWidth - margin)
          left = innerWidth - rect.width - margin;
        let top = anchorRect.bottom + 4;
        if (top + rect.height > innerHeight - margin) {
          const above = anchorRect.top - rect.height - 4;
          top =
            above >= margin
              ? above
              : Math.max(margin, innerHeight - rect.height - margin);
        }
        node.style.left = Math.round(Math.max(margin, left)) + "px";
        node.style.top = Math.round(top) + "px";
      }

      function pickerOption(checked, disabled, kind, label, note, onToggle, iconName, disabledReason, tag) {
        return el(
          "label",
          {
            class:
              "route-picker-option " + kind + (disabled ? " disabled" : ""),
            title: disabled
              ? disabledReason || "已选择「" + ALL_ROUTE_NAME + "」。如需设置其他范围，请先取消选择该规则。"
              : null,
          },
          el("input", {
            type: "checkbox",
            checked: checked || undefined,
            disabled: disabled || undefined,
            onchange: (event) => onToggle(event.target.checked),
          }),
          iconName ? actionIcon(iconName) : null,
          el("span", { title: label }, label),
          tag ? el("span", { class: "tag warn settings-item-chip", text: tag }) : null,
          note ? el("span", { class: "count" }, note) : null,
        );
      }

      function renderRoutePicker() {
        const term = $("route-picker-search").value.trim().toLowerCase();
        const list = $("route-picker-list");
        const sections = [];

        const routeOptions = [];
        if (matchesTerm(ALL_ROUTE_NAME, term)) {
          routeOptions.push(
            pickerOption(
              routePicker.all,
              false,
              "route",
              ALL_ROUTE_NAME,
              "全部",
              (checked) => {
                routePicker.all = checked;
                if (checked) routePicker.bindings.clear();
                renderRoutePicker();
              },
            ),
          );
        }
        for (const route of state.routes.filter((entry) => entry.id !== ALL_ROUTE_ID)) {
          if (!matchesTerm(route.name || route.id, term)) continue;
          const binding = { kind: "route", value: route.id };
          routeOptions.push(
            pickerOption(
              !routePicker.all && routePicker.bindings.has(bindingKey(binding)),
              routePicker.all,
              "route",
              route.name || route.id,
              "自定义",
              (checked) => {
                if (checked) routePicker.bindings.set(bindingKey(binding), binding);
                else routePicker.bindings.delete(bindingKey(binding));
                renderRoutePicker();
              },
            ),
          );
        }
        for (const binding of routePicker.bindings.values()) if (binding.kind === "route" && !state.routes.some((route) => route.id === binding.value) && matchesTerm(binding.value, term)) routeOptions.push(pickerOption(true, false, "route", "路由规则已不存在，请重新选择", binding.value, (checked) => { if (!checked) routePicker.bindings.delete(bindingKey(binding)); renderRoutePicker(); }));
        sections.push(pickerSection("routes", "路由规则", routeOptions, term ? "没有匹配的路由规则" : "暂无路由规则"));

        const selectedProviderValues = new Set([...routePicker.bindings.values()].filter((binding) => binding.kind === "credential_provider").map((binding) => binding.value));
        for (const item of state.credentials) {
          if (selectedProviderValues.has(providerKey(item))) routePicker.bindings.delete(bindingKey({ kind: "credential", value: item.ref }));
        }
        const credentialOptions = routeProviderChoices(selectedProviderValues)
          .filter((item) => matchesTerm(credentialProviderLabel(item) + " 整类 类别", term))
          .map((item) => {
            const binding = { kind: "credential_provider", value: providerKey(item) };
            const label = credentialProviderLabel(item);
            const available = state.credentials.some((credential) => credential.source === item.source && credential.provider.toLowerCase() === item.provider.toLowerCase());
            return pickerOption(!routePicker.all && routePicker.bindings.has(bindingKey(binding)), routePicker.all, "credential-provider", label, available ? "" : "暂无凭证", (checked) => {
              if (checked) {
                routePicker.bindings.set(bindingKey(binding), binding);
                for (const credential of state.credentials) {
                  if (credential.source === item.source && credential.provider.toLowerCase() === item.provider.toLowerCase()) routePicker.bindings.delete(bindingKey({ kind: "credential", value: credential.ref }));
                }
              } else routePicker.bindings.delete(bindingKey(binding));
              renderRoutePicker();
            }, "layers", null, "整类");
          });
        credentialOptions.push(...state.credentials.filter((item) => matchesTerm(credentialLabel(item), term)).map((item) => {
          const binding = { kind: "credential", value: item.ref };
          const providerBinding = { kind: "credential_provider", value: providerKey(item) };
          const covered = routePicker.bindings.has(bindingKey(providerBinding));
          const disabled = routePicker.all || covered;
          const disabledReason = covered ? "已选择「" + credentialProviderLabel(item) + "」整类，该类别下的单个凭证无需重复选择。" : "";
          return pickerOption(!routePicker.all && routePicker.bindings.has(bindingKey(binding)), disabled, "credential", credentialLabel(item), item.unavailable ? "不可用" : "", (checked) => { if (checked) routePicker.bindings.set(bindingKey(binding), binding); else routePicker.bindings.delete(bindingKey(binding)); renderRoutePicker(); }, "key", disabledReason);
        }));
        for (const binding of routePicker.bindings.values()) if (binding.kind === "credential" && !state.credentials.some((item) => item.ref === binding.value) && matchesTerm(binding.value, term)) credentialOptions.push(pickerOption(true, routePicker.all, "credential", "上游凭证已不存在", binding.value.slice(0, 16) + "…", (checked) => { if (!checked) routePicker.bindings.delete(bindingKey(binding)); renderRoutePicker(); }, "key"));
        sections.push(pickerSection("credentials", "上游凭证", credentialOptions, term ? "没有匹配的上游凭证" : "暂无上游凭证"));

        const modelOptions = catalogModels()
          .filter((model) => matchesTerm(model, term))
          .map((model) => {
            const binding = { kind: "model", value: model };
            return pickerOption(
              !routePicker.all && routePicker.bindings.has(bindingKey(binding)),
              routePicker.all,
              "model",
              model,
              "",
              (checked) => {
                if (checked) routePicker.bindings.set(bindingKey(binding), binding);
                else routePicker.bindings.delete(bindingKey(binding));
                renderRoutePicker();
              },
            );
          });
        for (const binding of routePicker.bindings.values()) if (binding.kind === "model" && !catalogModels().some((model) => model.toLowerCase() === binding.value.toLowerCase()) && matchesTerm(binding.value, term)) modelOptions.push(pickerOption(true, routePicker.all, "model", binding.value, "CPA 当前未公布此模型", (checked) => { if (!checked) routePicker.bindings.delete(bindingKey(binding)); renderRoutePicker(); }));
        sections.push(pickerSection("models", "模型", modelOptions, term ? "没有匹配的模型" : "暂无模型"));

        list.replaceChildren(...sections);
        $("route-picker-save").disabled = false;
      }

      function pickerSection(kind, title, options, emptyText) {
        const bindingKinds = kind === "routes" ? ["route"] : kind === "credentials" ? ["credential", "credential_provider"] : ["model"];
        const selected = [...routePicker.bindings.values()].filter((binding) => bindingKinds.includes(binding.kind)).length + (kind === "routes" && routePicker.all ? 1 : 0);
        const expanded = !!routePicker.expanded[kind];
        return el("div", { class: "route-picker-section" },
          el("button", { type: "button", class: "route-picker-group", "aria-label": (expanded ? "收起" : "展开") + title, "aria-expanded": String(expanded), onclick: () => { routePicker.expanded[kind] = !expanded; renderRoutePicker(); } },
            el("span", { class: "route-picker-chevron", "aria-hidden": "true" }, actionIcon("chevron")),
            el("span", { text: title }),
            el("span", { class: "route-picker-section-count", text: selected + "/" + options.length }),
          ),
          expanded ? el("div", {}, ...(options.length ? options : [el("div", { class: "empty", text: emptyText })])) : null,
        );
      }

      async function saveRoutePicker() {
        const scope = routePicker.scope;
        if (!scope) return;
        const body = { scope, bindings: routePicker.all ? [{ kind: "route", value: ALL_ROUTE_ID }] : [...routePicker.bindings.values()] };
        const button = $("route-picker-save");
        button.disabled = true;
        button.textContent = "正在保存…";
        try {
          await plugin("PUT", "/keys/routes", body);
          notify("API Key 路由规则已保存");
          closeRoutePicker();
          await refreshPage("foreground");
        } finally {
          button.disabled = false;
          button.textContent = "保存";
        }
      }

      function settingsChipList(items, fallback) {
        if (!items.length) return el("span", { class: fallback === "—" ? "muted" : "", text: fallback });
        return el("div", { class: "settings-chip-list" }, items.map((item) =>
          el("span", item.title
            ? { class: "settings-chip settings-item-chip" + (item.tag ? " has-tag" : ""), title: item.title }
            : { class: "settings-chip settings-item-chip" + (item.tag ? " has-tag" : "") },
          item.tag ? el("span", { class: "settings-chip-label", text: item.text }) : item.text,
          item.tag ? el("span", { class: "tag warn", text: item.tag }) : null),
        ));
      }

      function settingsEntryField(label, content) {
        return el("div", { class: "error-event-field settings-entry-field" },
          el("span", { class: "error-event-field-label", text: label }),
          el("div", { class: "error-event-field-value settings-entry-value" }, content),
        );
      }

      function keyChipItems(keys) {
        return keys.map((key) => ({ text: keyDisplayText(key) }));
      }

      function modelChipItems(models) {
        return models.map((model) => ({ text: model }));
      }

      function renderPlans() {
        const cards = state.plans.map((plan) => {
          const boundKeys = state.keys.filter((key) => key.plan_id === plan.id);
          const name = plan.name || plan.id;
          return el(
            "article",
            { class: "auth-file-card", role: "listitem" },
            el(
              "div",
              { class: "event-entry-head settings-entry-header" },
              el("div", { class: "settings-entry-title", text: name }),
              el("div", { class: "row settings-entry-actions" },
                el("button", { class: "link", text: "编辑", onclick: () => editPlan(plan) }),
                el("button", {
                  class: "link danger",
                  text: "删除",
                  onclick: () => guard(async () => {
                    if (!(await confirmAction(
                      "删除订阅计划「" + name + "」？",
                      boundKeys.length ? "已绑定的 " + boundKeys.length + " 个 API Key 将改为不限制。" : "",
                    ))) return;
                    await plugin("DELETE", "/plans?id=" + encodeURIComponent(plan.id));
                    notify("订阅计划已删除");
                    await refreshPage("foreground");
                  }),
                }),
              ),
            ),
            el("div", { class: "settings-entry-fields" },
              el("div", { class: "event-request-meta" },
                settingsEntryField("额度", el("b", { class: "mono", text: usd(plan.amount_usd) })),
                settingsEntryField("周期", periodText(plan.period)),

              settingsEntryField("已绑定 Key", settingsChipList(keyChipItems(boundKeys), "—")),

        });
        replaceContent(

        );
        if ($("plan-dialog").open) renderPlanKeyPicker($("plan-id").value);
      }

      function renderRoutes() {
        const cards = state.routes.map((route) => {
          const rule = route.rule || {};
          const models = rule.models || [];
          const credentials = (rule.credential_providers || [])
            .map((item) => ({ text: (item.source === "auth-files" ? "认证文件" : "AI 供应商") + " · " + item.provider, tag: "整类" }))
            .concat((rule.credential_ids || []).map((ref) => {
              const credential = state.credentials.find((item) => item.ref === ref);
              return { text: credential ? credentialLabel(credential) : "凭证已不存在" };
            }));
          const boundKeys = state.keys.filter((key) => route.id === ALL_ROUTE_ID
            ? !(key.route_bindings || []).length
            : (key.route_bindings || []).some((binding) => binding.kind === "route" && binding.value === route.id));
          const name = route.name || route.id;
          const system = route.id === ALL_ROUTE_ID;
          return el(
            "article",
            { class: "auth-file-card", role: "listitem" },
            el(
              "div",
              { class: "event-entry-head settings-entry-header" },
              el("div", { class: "settings-entry-title", text: name }),
              system ? null : el("div", { class: "row settings-entry-actions" },
                el("button", { class: "link", text: "编辑", onclick: () => editRoute(route) }),
                el("button", {
                  class: "link danger",
                  text: "删除",
                  onclick: () => guard(async () => {
                    if (!(await confirmAction(
                      "删除路由规则「" + name + "」？",
                      route.bound_key_count
                        ? "该规则正被 " + route.bound_key_count + " 个 API Key 使用。删除后会从这些 API Key 中移除；其中 " + (route.fully_unrestricted_keys || 0) + " 个将恢复为「" + ALL_ROUTE_NAME + "」。此操作无法撤销。"
                        : "此操作无法撤销。",
                    ))) return;
                    await plugin("DELETE", "/routes?id=" + encodeURIComponent(route.id));
                    notify("路由规则已删除");
                    await refreshPage("foreground");
                  }),
                }),
              ),
            ),
            el("div", { class: "settings-entry-fields" },
              settingsEntryField("模型范围", settingsChipList(modelChipItems(models), "全部模型")),
              settingsEntryField("凭证范围", settingsChipList(credentials, "全部凭证")),
              settingsEntryField("已绑定 Key", settingsChipList(keyChipItems(boundKeys), "—")),
            ),
          );
        });
        replaceContent(
          $("routes-body"),
          ...(state.access?.credential_inventory_error
            ? [el("div", { class: "notice warn show", text: "凭证信息暂时无法加载：" + state.access.credential_inventory_error })]
            : []),
          el("div", { class: "event-list settings-card-list", role: "list" }, cards),
          ...(state.routes.some((route) => route.id !== ALL_ROUTE_ID)
            ? []
            : [el("div", { class: "empty", text: "暂无自定义路由规则" })]),
        );
        if ($("route-dialog").open) {
          renderRouteModelList();
          renderRouteCredentialList();
          renderRouteKeyList($("route-id").value);
        }
      }

      let routeModels = new Set();
      let routeCredentialIDs = new Set();
      let routeProviders = new Set();

      function providerKey(item) { return item.source + "\u0000" + item.provider; }

      function routeRuleSearchTerm() {
        return $("route-rule-search").value.trim().toLowerCase();
      }

      function routeProviderChoices(selected = routeProviders) {
        const providers = new Map();
        for (const item of state.credentials) providers.set(providerKey(item), { source: item.source, provider: item.provider });
        for (const key of selected) if (!providers.has(key)) { const item = credentialProviderFromValue(key); if (item) providers.set(key, item); }
        return [...providers.values()];
      }

      function renderRouteCredentialList() {
        for (const item of state.credentials) {
          if (routeProviders.has(providerKey(item))) routeCredentialIDs.delete(item.ref);
        }
        const term = routeRuleSearchTerm();
        const options = routeProviderChoices().filter((item) => matchesTerm((item.source === "auth-files" ? "认证文件" : "AI 供应商") + " " + item.provider + " 整类", term)).map((item) => {
          const source = item.source === "auth-files" ? "认证文件" : "AI 供应商";
          const available = state.credentials.some((credential) => credential.source === item.source && credential.provider.toLowerCase() === item.provider.toLowerCase());
          const label = source + " · " + item.provider;
          return el("label", {}, el("input", { type: "checkbox", checked: routeProviders.has(providerKey(item)) || undefined, onchange: (event) => {
            if (event.target.checked) {
              routeProviders.add(providerKey(item));
              for (const credential of state.credentials) {
                if (credential.source === item.source && credential.provider.toLowerCase() === item.provider.toLowerCase()) routeCredentialIDs.delete(credential.ref);
              }
            } else routeProviders.delete(providerKey(item));
            renderRouteCredentialList();
          } }), actionIcon("layers"), el("span", { title: label + " · 整类" }, label), el("span", { class: "tag warn settings-item-chip", text: "整类" }), !available ? el("span", { class: "muted small", text: "暂无凭证" }) : null);
        });
        const credentials = state.credentials.filter((item) => matchesTerm(credentialLabel(item), term));
        for (const item of credentials) {
          const label = credentialLabel(item);
          const covered = routeProviders.has(providerKey(item));
          options.push(el("label", { class: covered ? "disabled" : "" }, el("input", { type: "checkbox", checked: routeCredentialIDs.has(item.ref) || undefined, disabled: covered || undefined, onchange: (event) => { if (event.target.checked) routeCredentialIDs.add(item.ref); else routeCredentialIDs.delete(item.ref); renderRouteCredentialList(); } }), actionIcon("key"), el("span", { title: label }, label)));
        }
        for (const ref of routeCredentialIDs) if (!state.credentials.some((item) => item.ref === ref) && matchesTerm(ref, term)) options.push(el("label", {}, el("input", { type: "checkbox", checked: true, onchange: (event) => { if (!event.target.checked) routeCredentialIDs.delete(ref); renderRouteCredentialList(); } }), actionIcon("key"), el("span", { title: ref }, "凭证已不存在")));
        $("route-credential-list").replaceChildren(...(options.length ? options : [el("div", { class: "empty", text: "没有匹配项" })]));
        const credentialCount = routeCredentialIDs.size + routeProviders.size;
        $("route-credential-count").textContent = credentialCount ? String(credentialCount) : "全部";
      }

      function renderRouteModelList() {
        const node = $("route-model-list");
        const term = routeRuleSearchTerm();
        const retired = new Set(retiredModels(routeModels));
        const models = catalogModels().concat([...retired]);
        $("route-model-count").textContent = routeModels.size ? String(routeModels.size) : "全部";
        const options = models
          .filter((model) => matchesTerm(model, term))
          .map((model) =>
            el(
              "label",
              {},
              el("input", {
                type: "checkbox",
                value: model,
                checked: routeModels.has(model) || undefined,
                onchange: (event) => {
                  if (event.target.checked) routeModels.add(model);
                  else routeModels.delete(model);
                  renderRouteModelList();
                },
              }),
              el("span", { class: "mono", title: model }, model),
              retired.has(model)
                ? el("span", { class: "muted small", text: "CPA 当前未公布此模型" })
                : null,
            ),
          );
        node.replaceChildren(
          ...(options.length
            ? options
            : [
                el("div", {
                  class: "empty",
                  text: (state.prices || []).length
                    ? "没有匹配的模型"
                    : "暂无模型，请先在「模型定价」同步",
                }),
              ]),
        );
      }

      function renderRouteKeyList(routeID) {
        const list = $("route-key-list");
        if (!state.keys.length) {
          list.replaceChildren(el("div", { class: "empty", text: "暂无 API Key" }));
          return;
        }
        list.replaceChildren(...state.keys.map((key) => {
          const checked = !!routeID && (key.route_bindings || []).some((binding) => binding.kind === "route" && binding.value === routeID);
          return el(
            "label",
            {},
            el("input", { type: "checkbox", value: key.scope, checked: checked || undefined }),
            el("span", { title: keyName(key) }, keyName(key)),
            key.preview && key.preview !== keyName(key) ? el("span", { class: "muted small mono", title: key.preview }, key.preview) : null,
          );
        }));
      }

      function selectedRouteScopes() {
        return [...$("route-key-list").querySelectorAll('input[type="checkbox"]:checked')].map((input) => input.value);
      }

      function resetRouteForm() {
        $("route-form-title").textContent = "新建路由规则";
        $("route-save").textContent = "创建";
        $("route-id").value = "";
        $("route-name").value = "";
        $("route-rule-search").value = "";
        routeModels = new Set();
        routeCredentialIDs = new Set();
        routeProviders = new Set();
        renderRouteModelList();
        renderRouteCredentialList();
        renderRouteKeyList("");
      }

      function editRoute(route) {
        $("route-form-title").textContent = "编辑路由规则：" + (route.name || route.id);
        $("route-id").value = route.id;
        $("route-save").textContent = "保存";
        $("route-name").value = route.name || "";
        $("route-rule-search").value = "";
        routeModels = new Set(route.rule?.models || []);
        routeCredentialIDs = new Set(route.rule?.credential_ids || []);
        routeProviders = new Set((route.rule?.credential_providers || []).map(providerKey));
        renderRouteModelList();
        renderRouteCredentialList();
        renderRouteKeyList(route.id);
        $("route-dialog").showModal();
        $("route-name").focus();
      }

      function priceSourceTag(source) {
        switch (source) {
          case "custom":
            return el("span", { class: "tag warn", text: "自定义" });
          case "builtin":
            return el("span", { class: "tag ok", text: "参考价" });
          default:
            return el("span", { class: "tag plain", text: "待定价" });
        }
      }

      function optionalPrice(value) {
        return value === null || value === undefined
          ? el("span", { class: "muted", text: "-" })
          : usd(value);
      }

      function tierPriceCell(row, field, optional) {
        const base = row[field];
        const tier = row.long_context;
        if (!tier) return optional ? optionalPrice(base) : usd(base);
        const threshold = tokenThreshold(tier.threshold_input_tokens);
        const longValue = tier[field];
        if (
          optional &&
          (base === null || base === undefined) &&
          (longValue === null || longValue === undefined)
        ) {
          return el("span", { class: "muted", text: "-" });
        }
        return el(
          "div",
          { class: "tier-price" },
          el("span", {}, optional ? optionalPrice(base) : usd(base)),
          el(
            "span",
            { class: "muted small" },
            ">" + threshold + " ",
            optional ? optionalPrice(longValue) : usd(longValue),
          ),
        );
      }

      // Group prefixed and unprefixed variants by base model name.
      function modelIdParts(pattern) {
        const slash = pattern.indexOf("/");
        if (slash < 0) return { name: pattern, prefix: "" };
        return {
          name: pattern.slice(slash + 1),
          prefix: pattern.slice(0, slash),
        };
      }

      function compareModelId(a, b) {
        const ka = modelIdParts(a);
        const kb = modelIdParts(b);
        if (ka.name !== kb.name) return ka.name < kb.name ? -1 : 1;
        if (ka.prefix !== kb.prefix) return ka.prefix < kb.prefix ? -1 : 1;
        return 0;
      }

      function renderPriceTable(target, prices, filter, editable) {
        filter = filter.trim().toLowerCase();
        const rows = (prices || [])
          .filter(
            (row) => !filter || row.pattern.toLowerCase().includes(filter),
          )
          .sort((a, b) => compareModelId(a.pattern, b.pattern))
          .map((row) => {
            const cells = [
              el("td", { class: "mono" }, row.pattern),
              el(
                "td",
                { class: "num" },
                tierPriceCell(row, "input_per_1m", false),
              ),
              el(
                "td",
                { class: "num" },
                tierPriceCell(row, "output_per_1m", false),
              ),
              el(
                "td",
                { class: "num" },
                tierPriceCell(row, "cache_read_per_1m", true),
              ),
              el(
                "td",
                { class: "num" },
                tierPriceCell(row, "cache_write_per_1m", true),
              ),
            ];
            if (editable) {
              cells.push(el("td", {}, priceSourceTag(row.source)));
              cells.push(
                el(
                  "td",
                  { class: "small" },
                  el("button", {
                    class: "link",
                    text: "编辑",
                    onclick: () => editPrice(row),
                  }),
                ),
              );
            }
            return el("tr", {}, cells);
          });
        const headers = [
          "模型",
          { label: "输入 / 1M Token", num: true },
          { label: "输出 / 1M Token", num: true },
          { label: "缓存读 / 1M Token", num: true },
          { label: "缓存写 / 1M Token", num: true },
        ];
        if (editable) headers.push("来源", "操作");
        replaceContent($(target), table(headers, rows));
      }

      function requestEventKeyName(entry) {
        return (
          entry.label || entry.preview || (entry.scope || "").slice(0, 12) + "…"
        );
      }

      function costTierText(cost) {
        const threshold = tokenThreshold(cost.threshold_input_tokens);
        return cost.long_context
          ? "长上下文 >" + threshold
          : "标准上下文 ≤" + threshold;
      }

      function showCostTooltip(anchor, cost, reasoningTokens) {
        const tooltip = $("cost-tooltip");
        const input =
          Number(cost.uncached_input_tokens || 0) +

        const rows = [
          [

            el("span", { class: "cost-tooltip-head num" }, "金额"),
            rows.flatMap(([name, tokenCount, price, amount]) => [
              el("span", {}, name),
              el(

                { class: "num" },

      }

      function positionCostTooltip(anchor) {
        const tooltip = $("cost-tooltip");
        const anchorRect = anchor.getBoundingClientRect();
        const gap = 8;
        const margin = 8;
        let left = anchorRect.right + gap;
        let top = anchorRect.top;
        const rect = tooltip.getBoundingClientRect();
        if (left + rect.width > innerWidth - margin)
          left = anchorRect.left - rect.width - gap;
        if (left < margin)
          left = Math.max(margin, innerWidth - rect.width - margin);
        if (top + rect.height > innerHeight - margin)
          top = innerHeight - rect.height - margin;
        tooltip.style.left = Math.round(left) + "px";
        tooltip.style.top = Math.round(Math.max(margin, top)) + "px";
      }

      function hideCostTooltip() {
        const tooltip = $("cost-tooltip");
        tooltip.classList.remove("show");
        tooltip.setAttribute("aria-hidden", "true");
      }

      const REQUEST_EVENT_STATUS_LABELS = {
        "": "全部状态",
        normal: "正常",
        failed: "失败",
      };

      // Counts cover the whole field/time selection and ignore the status choice,
      // so each status option can show how many entries selecting it would reveal.
      function labelRequestEventStatuses(select, counts) {
        for (const option of select.options) {
          option.textContent =
            REQUEST_EVENT_STATUS_LABELS[option.value] +
            "（" +
            int((counts || {})[option.value || "all"]) +
            "）";
        }
      }

      function populateEventFilterSelect(
        select,
        defaultLabel,
        values,
        valueOf = (item) => item,
        labelOf = valueOf,
      ) {
        const selected = select.value;
        const selectedLabel =
          select.selectedOptions[0]?.textContent || selected;
        const options = [el("option", { value: "", text: defaultLabel })];
        let found = !selected;
        for (const item of values || []) {
          const value = String(valueOf(item) || "");
          if (!value) continue;
          if (value === selected) found = true;
          options.push(el("option", { value, text: labelOf(item) }));
        }
        if (selected && !found)
          options.push(el("option", { value: selected, text: selectedLabel }));
        select.replaceChildren(...options);
        select.value = selected;
      }

      function populateRequestEventFilters(filters, account) {
        if (!filters) return;
        const prefix = account ? "account-request-event" : "request-event";
        if (!account) populateSharedKeyFilter(filters.api_keys);
        populateEventFilterSelect($(prefix + "-model"), "全部模型", filters.models);
        populateEventFilterSelect($(prefix + "-source"), "全部来源", filters.sources);
      }

      function populateSharedKeyFilter(keys) {
        populateEventFilterSelect(
          $("analysis-key"),
          "全部 API Key",
          keys || [],
          (item) => item.scope,
          (item) =>
            item.label
              ? item.label + (item.preview ? " · " + item.preview : "")
              : item.preview || item.scope,
        );
      }

      function requestEventPath(offset, limit, account) {
        const params = new URLSearchParams({
          offset: String(offset),
          limit: String(limit || REQUEST_EVENT_BATCH_SIZE),
        });
        const prefix = account ? "account-request-event" : "request-event";
        const key = account ? "" : $("analysis-key").value;
        const model = $(prefix + "-model").value;
        const source = $(prefix + "-source").value;
        const status = $(prefix + "-status").value;
        if (key) params.set("api_key", key);
        if (model) params.set("model", model);
        if (source) params.set("source", source);
        if (status) params.set("status", status);
        const range = selectedRange(account);
        if (range.from) params.set("from", range.from);
        if (range.to) params.set("to", range.to);
        return "/events?" + params.toString();
      }

      function updateRequestEventFilterControls(account) {
        const role = account ? "account" : "admin";
        $(
          account ? "account-request-events-filter-clear" : "request-events-filter-clear",
        ).disabled = !REQUEST_EVENT_FILTER_IDS[role].some((id) => $(id).value);
      }

      function sharedTimeID(account, suffix) {
        return (account ? "account-shared" : "shared") + "-time-" + suffix;
      }

      function sharedTimePresetSelector(account) {
        return "[data-" + (account ? "account-" : "") + "shared-time-preset]";
      }

      function localDateTimeValue(date) {
        const local = new Date(
          date.getTime() - date.getTimezoneOffset() * 60000,
        );
        return local.toISOString().slice(0, 16);
      }

      function updateSharedTimeControl(account) {
        const range = sharedTimeRanges[account ? "account" : "admin"];
        let label = SHARED_TIME_LABELS[range.mode] || SHARED_TIME_LABELS["30d"];
        if (range.mode === "custom") {
          const format = (value) =>
            new Date(value).toLocaleString("zh-CN", {
              month: "numeric",
              day: "numeric",
              hour: "2-digit",
              minute: "2-digit",
              hour12: false,
            });
          label = format(range.from) + " – " + format(range.to);
        }
        $(sharedTimeID(account, "label")).textContent = label;
      }

      function closeSharedTimePopover(account) {
        $(sharedTimeID(account, "popover")).classList.add("hidden");
        $(sharedTimeID(account, "backdrop")).classList.add("hidden");
        $(sharedTimeID(account, "trigger")).setAttribute(
          "aria-expanded",
          "false",
        );
      }

      function renderSharedTimePopover(account, mode) {
        document
          .querySelectorAll(sharedTimePresetSelector(account))
          .forEach((button) => {
            const value =
              button.dataset[
                account ? "accountSharedTimePreset" : "sharedTimePreset"
              ];
            button.classList.toggle("active", value === mode);
          });
        $(sharedTimeID(account, "custom")).classList.toggle(
          "hidden",
          mode !== "custom",
        );
        if (mode === "custom") {
          const current = sharedTimeRanges[account ? "account" : "admin"];
          const fallback = recentTimeRange("24h");
          $(sharedTimeID(account, "from")).value = localDateTimeValue(
            new Date(current.mode === "custom" ? current.from : fallback.from),
          );
          $(sharedTimeID(account, "to")).value = localDateTimeValue(
            new Date(current.mode === "custom" ? current.to : fallback.to),
          );
        }
      }

      function openSharedTimePopover(account) {
        const popover = $(sharedTimeID(account, "popover"));
        if (!popover.classList.contains("hidden")) {
          closeSharedTimePopover(account);
          return;
        }
        const mode = sharedTimeRanges[account ? "account" : "admin"].mode;
        renderSharedTimePopover(account, mode);
        popover.classList.remove("hidden");
        $(sharedTimeID(account, "backdrop")).classList.remove("hidden");
        $(sharedTimeID(account, "trigger")).setAttribute(
          "aria-expanded",
          "true",
        );
      }

      function applyTimeRange(account, range) {
        sharedTimeRanges[account ? "account" : "admin"] = range;
        updateSharedTimeControl(account);
        closeSharedTimePopover(account);
        return applySharedTimeRange(account);
      }

      function bindSharedTimeControls(account) {
        $(sharedTimeID(account, "trigger")).onclick = () =>
          openSharedTimePopover(account);
        $(sharedTimeID(account, "backdrop")).onclick = () =>
          closeSharedTimePopover(account);
        document
          .querySelectorAll(sharedTimePresetSelector(account))
          .forEach((button) => {
            button.onclick = () => {
              const mode =
                button.dataset[
                  account ? "accountSharedTimePreset" : "sharedTimePreset"
                ];
              renderSharedTimePopover(account, mode);
              if (mode !== "custom")
                guard(() => applyTimeRange(account, { mode }));
            };
          });
        $(sharedTimeID(account, "cancel")).onclick = () =>
          closeSharedTimePopover(account);
        $(sharedTimeID(account, "apply")).onclick = () =>
          guard(() => {
            const from = new Date($(sharedTimeID(account, "from")).value);
            const to = new Date($(sharedTimeID(account, "to")).value);
            if (
              !Number.isFinite(from.getTime()) ||
              !Number.isFinite(to.getTime())
            ) {
              throw new Error("请选择完整的开始和结束时间");
            }
            if (from >= to) throw new Error("开始时间必须早于结束时间");
            if (to.getTime() - from.getTime() > 30 * 86400000) {
              throw new Error("时间范围不能超过 30 天");
            }
            return applyTimeRange(account, {
              mode: "custom",
              from: from.toISOString(),
              to: to.toISOString(),
            });
          });
      }

      function csvCell(value) {
        if (value === undefined || value === null) return "";
        let text = String(value);
        if (/^[=+\-@]/.test(text)) text = "'" + text;
        return '"' + text.replaceAll('"', '""') + '"';
      }

      function requestEventCSV(entries, account) {
        const columns = account ? ACCOUNT_REQUEST_EVENT_CSV_COLUMNS : REQUEST_EVENT_CSV_COLUMNS;
        const lines = [columns.map(csvCell).join(",")];
        for (const entry of entries) {
          const row = { ...entry, ...entry.cost };
          lines.push(columns.map((column) => csvCell(row[column])).join(","));
        }
        return "\ufeff" + lines.join("\r\n") + "\r\n";
      }

      function downloadCSV(filename, content) {
        const url = URL.createObjectURL(
          new Blob([content], { type: "text/csv;charset=utf-8" }),
        );
        const anchor = el("a", { href: url, download: filename });
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
      }

      async function exportRequestEvents(account) {
        if (requestEventExporting) return;
        requestEventExporting = true;
        const button = $(account ? "account-request-events-export" : "request-events-export");
        button.disabled = true;
        setLabeledActionIcon(button, "download", "正在导出…");
        try {
          const entries = [];
          let total = Infinity;
          while (entries.length < total) {
            const path = requestEventPath(
              entries.length,
              REQUEST_EVENT_EXPORT_BATCH_SIZE,
              account,
            );
            const page = account
              ? await accountAPI(path)
              : await plugin("GET", path);
            const incoming = page.entries || [];
            total = Number(page.total || 0);
            entries.push(...incoming);
            if (!incoming.length) break;
          }
          const stamp = new Date()
            .toISOString()
            .replaceAll(":", "-")
            .slice(0, 19);
          const name = account
            ? "cpa-key-billing-account-request-events-"
            : "cpa-key-billing-request-events-";
          downloadCSV(name + stamp + ".csv", requestEventCSV(entries, account));
          notify("已导出 " + int(entries.length) + " 条请求事件");
        } finally {
          requestEventExporting = false;
          button.disabled = false;
          setLabeledActionIcon(button, "download", "导出");
        }
      }

      function shouldLoadMoreRequestEvents(scroller) {
        return (
          scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight <=
          REQUEST_EVENT_LOAD_MORE_THRESHOLD_PX
        );
      }

      function requestEventLoadState(account) {
        return account ? requestEventLoads.account : requestEventLoads.admin;
      }

      function maybeLoadMoreRequestEvents(account) {
        account = account === true;
        const role = account ? "account" : "admin";
        const tabActive = account
          ? accountTab === "request-events"
          : !!document.querySelector('[data-tab="request-events"].active');
        if (currentRole !== role || !tabActive) return;
        const scroller = $(account ? "account-request-events-body" : "request-events-body");
        const load = requestEventLoadState(account);
        if (
          !load.autoLoadMore ||
          !load.hasMore ||
          load.loading ||
          load.loadingMore ||
          !shouldLoadMoreRequestEvents(scroller)
        )
          return;
        guard(() => loadRequestEvents(true, account));
      }

      async function loadRequestEvents(append, account, options = {}) {
        account = account === true;
        append = append === true;
        const background = options.background === true;
        const deferRender = options.deferRender === true;
        const load = requestEventLoadState(account);
        if (append && (!load.hasMore || load.loading || load.loadingMore))
          return;
        const owner = account ? accountState : state;
        const renderRequestEventsNow = () => renderRequestEvents(account);
        const existing =
          append && owner.requestEvents
            ? owner.requestEvents.entries || []
            : [];
        const offset = existing.length;
        const path = requestEventPath(offset, REQUEST_EVENT_BATCH_SIZE, account);
        if (load.promise && load.requestKey === path) return load.promise;
        const ticket = ++load.request;
        if (append) {
          load.loadingMore = true;
        } else {
          load.loading = true;
          load.loadingMore = false;
          load.hasMore = false;
          load.autoLoadMore = true;
          load.error = "";
        }
        if ((!owner.requestEvents || append) && !deferRender)
          renderRequestEventsNow();
        const task = (async () => {
          const page = account
            ? await accountAPI(path)
            : await plugin("GET", path);
          // Filter changes can overtake an older request. Only the newest request
          // for this role may replace or append rows.
          if (ticket !== load.request) return;
          // A background request that became ineligible while in flight is ignored.
          if (background && !canBackgroundRefreshRequestEvents(account)) return;
          const incoming = page.entries || [];
          const entries = existing.concat(incoming);
          owner.requestEvents = {
            ...page,
            filter_options:
              page.filter_options || owner.requestEvents?.filter_options,
            entries,
          };
          load.hasMore =
            incoming.length > 0 && entries.length < Number(page.total || 0);
          load.autoLoadMore = true;
          load.error = "";
        })();
        load.promise = task;
        load.requestKey = path;
        try {
          return await task;
        } catch (err) {
          if (ticket !== load.request) return undefined;
          load.error = err.message || String(err);
          if (append) load.autoLoadMore = false;
          throw err;
        } finally {
          if (ticket === load.request) {
            load.promise = null;
            load.requestKey = "";
            load.loading = false;
            load.loadingMore = false;
            if (!deferRender) renderRequestEventsNow();
          }
        }
      }

      function renderRequestEvents(account = false) {
        hideCostTooltip();
        const owner = account ? accountState : state;
        const view = owner.requestEvents;
        const load = requestEventLoads[account ? "account" : "admin"];
        const note = $(account ? "account-request-event-note" : "request-event-note");
        const scroller = $(
          account ? "account-request-events-body" : "request-events-body",
        );
        if (!view) {
          note.textContent = "";
          if (load.loading) {
            scroller.replaceChildren(el("div", { class: "empty", text: "加载中…" }));
          } else if (load.error) {
            scroller.replaceChildren(
              el(
                "div",
                { class: "empty" },
                el("div", { text: "请求事件加载失败" }),
                el(
                  "button",
                  {
                    class: "retry-button",
                    onclick: () =>
                      guard(() => loadRequestEvents(false, account)),
                  },
                  "重试",
                ),
              ),
            );
          } else {
            scroller.replaceChildren(
              el("div", { class: "empty", text: "暂无数据" }),
            );
          }
          return;
        }
        const prefix = account ? "account-request-event" : "request-event";
        populateRequestEventFilters(view.filter_options, account);
        labelRequestEventStatuses($(prefix + "-status"), view.status_counts);
        updateRequestEventFilterControls(account);
        const entries = view.entries || [];
        note.textContent =
          "已加载 " + int(entries.length) + " / " + int(view.total) + " 条";
        const previousScrollTop = scroller.scrollTop;
        const previousScrollLeft = scroller.scrollLeft;
        const rows = entries.map((entry) => {
          const cost = entry.cost || {};
          const keyDisplay = account ? "" : requestEventKeyName(entry);
          const statusMarks = [];
          if (entry.failed)
            statusMarks.push(el("span", { class: "tag bad", text: "失败" }));
          if (
            entry.accounting_quality &&
            entry.accounting_quality !== "complete"
          ) {
            statusMarks.push(
              el("span", {
                class: "tag warn",
                text:
                  entry.accounting_quality === "inconsistent"
                    ? "Token 明细异常"
                    : "Token 未分类",
              }),
            );
          }
          if (
            entry.price_source === "none" &&
            entry.accounting_quality === "complete"
          ) {
            statusMarks.push(el("span", { class: "tag warn", text: "待定价" }));
          }
          if (!statusMarks.length)
            statusMarks.push(el("span", { class: "tag ok", text: "正常" }));

          const input =
            (cost.uncached_input_tokens || 0) +
            (cost.cache_read_tokens || 0) +
            (cost.cache_write_tokens || 0);
          const output = cost.billed_output_tokens || 0;
          // Without an observed breakdown the counts are unknown, not zero, and a
          // column of zeroes would read as "this request used nothing".
          const measured = entry.accounting_quality === "complete";
          const tokens = (value) => (measured ? exactTokens(value) : "—");
          const hasTTFT = Number(entry.ttft_ms || 0) > 0;

          const billingModel =
            entry.billing_model || entry.upstream_model || "—";
          const upstreamModel = entry.upstream_model || "—";
          const showUpstreamModel =
            entry.upstream_model && entry.upstream_model !== billingModel;

          return el(
            "tr",
            {},
            el("td", {}, dateTimeLines(entry.at)),
            account
              ? null
              : el(
                  "td",
                  {},
                  el("div", {}, keyDisplay),
                  entry.preview && entry.preview !== keyDisplay
                    ? el("div", { class: "muted small mono" }, entry.preview)
                    : null,
                ),
            el(
              "td",
              { class: "small" },
              el("div", { class: "request-event-cell-line mono" }, billingModel),
              showUpstreamModel
                ? el(
                    "div",
                    { class: "request-event-cell-line muted" },
                    "上游 " + upstreamModel,
                  )
                : null,
            ),
            el(
              "td",
              { class: "small" },
              el(
                "div",
                { class: "request-event-cell-line mono" },
                entry.executor_type || "执行器未知",
              ),
              el(
                "div",
                { class: "request-event-source muted", title: entry.source || null },
                entry.source || "来源未知",
              ),
            ),
            el(
              "td",
              { class: "small" },
              el(
                "div",
                { class: "request-event-cell-line mono" },
                entry.reasoning_effort || "—",
              ),
              el(
                "div",
                { class: "request-event-cell-line muted" },
                entry.service_tier || "—",
              ),
            ),
            el("td", { class: "request-event-status" }, statusMarks),
            el(
              "td",
              { class: "num" },
              el("div", {}, outputTPS(cost, entry.latency_ms, measured)),
              el(
                "div",
                {
                  class: "muted small",
                  title: hasTTFT ? "首字延迟 · 总延迟" : "总延迟",
                },
                hasTTFT
                  ? latency(entry.ttft_ms) + " · " + latency(entry.latency_ms)
                  : latency(entry.latency_ms),
              ),
            ),
            el("td", { class: "num" }, tokens(input)),
            el(
              "td",
              { class: "num" },
              el("div", {}, tokens(cost.cache_read_tokens)),
              measured
                ? el(
                    "div",
                    { class: "muted small" },
                    cacheReadRate(cost.cache_read_tokens, input),
                  )
                : null,
            ),
            el("td", { class: "num" }, tokens(cost.cache_write_tokens)),
            el(
              "td",
              { class: "num" },

      const pluginLogLevels = {

      function matchesPluginLogLevel(pluginLog, level) {
        return level === "all" || pluginLog.level === level;

      function labelPluginLogLevels(pluginLogs) {
        for (const option of $("plugin-log-level").options) {
          const label = option.value === "all" ? "全部级别" : pluginLogLevels[option.value].label;
          const count = pluginLogs.filter((pluginLog) =>

      function loadPluginLogs(options = {}) {
        const background = options.background === true;
        const deferRender = options.deferRender === true;
        const append = options.append === true;
        const before = append ? Number(state.pluginLogsNext || 0) : 0;
        if (append && !before) return Promise.resolve();
        const params = new URLSearchParams({
          level: $("plugin-log-level").value,
          limit: "100",
        });
        if (before) params.set("before_id", String(before));
        return loadResource(
          detailLoads.adminPluginLogs,
          () => plugin("GET", "/plugin-logs?" + params.toString()),
          (result) => {
            if (!background || canBackgroundRefreshPluginLogs()) {
              state.pluginLogs = append
                ? (state.pluginLogs || []).concat(result.entries || [])
                : result.entries || [];
              state.pluginLogsNext = Number(result.next_before_id || 0);
            }
          },
          () =>
            currentRole === "admin" &&
            activeAdminTab() === "settings" &&
            renderPluginLogs(),
          deferRender,
        );
      }

      function renderPluginLogs() {
        const pluginLogs = state.pluginLogs;
        const load = detailLoads.adminPluginLogs;
        const scroller = $("plugin-logs-body");
        if (!pluginLogs) {
          $("plugin-logs-more").classList.add("hidden");
          if (load.promise) {
            scroller.replaceChildren(
              el("div", { class: "empty", text: "加载中…" }),
            );
          } else if (load.error) {
            scroller.replaceChildren(
              el(
                "div",
                { class: "empty" },
                el("div", { text: "插件日志加载失败" }),
                el(
                  "button",
                  {
                    class: "retry-button",
                    onclick: () => guard(() => loadPluginLogs()),
                  },
                  "重试",
                ),
              ),
            );
          } else {
            scroller.replaceChildren(
              el("div", { class: "empty", text: "暂无插件日志" }),
            );
          }
          return;
        }
        const filter = $("plugin-log-filter").value.trim().toLowerCase();
        const currentIDs = new Set(pluginLogs.map((entry) => String(entry.id || "")).filter(Boolean));
        for (const id of expandedPluginLogIDs) if (!currentIDs.has(id)) expandedPluginLogIDs.delete(id);
        const searched = pluginLogs.filter((pluginLog) => {
          if (!filter) return true;
          return [pluginLog.message]
            .filter(Boolean)
            .join(" ")
            .toLowerCase()
            .includes(filter);
        });
        // The counts ignore the level choice itself, so each option says how many
        // entries picking it would show.
        labelPluginLogLevels(searched);
        const matched = searched.filter((pluginLog) =>
          matchesPluginLogLevel(pluginLog, $("plugin-log-level").value),
        );
        const entries = matched.map((pluginLog) => {
          const level =
            pluginLogLevels[pluginLog.level] || pluginLogLevels.info;
          return el(
            "article",
            { class: "event-entry", role: "listitem" },
            el(
              "div",
              { class: "event-entry-head" },
              el(
                "time",
                { class: "event-time", datetime: pluginLog.at || null },
                when(pluginLog.at),
              ),
              el("span", { class: level.class, text: level.label }),
            ),
            renderPluginLogMessage(pluginLog),
          );
        });
        const previousScrollTop = scroller.scrollTop;
        const previousScrollLeft = scroller.scrollLeft;
        replaceContent(
          scroller,
          entries.length
            ? el(
                "div",
                {
                  class: "event-list",
                  role: "list",
                  "aria-label": "插件日志列表",
                },
                entries,
              )
            : el("div", {
                class: "empty",
                text: pluginLogs.length ? "没有匹配的日志" : "暂无插件日志",
              }),
        );
        scroller.scrollTop = previousScrollTop;
        scroller.scrollLeft = previousScrollLeft;
        $("plugin-logs-more").classList.toggle("hidden", !state.pluginLogsNext);
        $("plugin-logs-more").disabled = !!load.promise;
      }

      function renderPluginLogMessage(pluginLog) {
        const message = pluginLog.message || "";
        if (!message.startsWith("route ")) return el("div", { class: "plugin-log-message" }, message);
        try {
          const row = JSON.parse(message.slice(6));
          const model = row.model_result === "deny" ? "模型：拒绝" : row.model_result === "configuration_error" ? "模型：配置错误" : "模型：允许";
          const credential = row.credential_result === "selected" ? "上游凭证：" + row.selected_credential : row.credential_result === "not_reached" ? "上游凭证：未进入选择阶段" : row.credential_result === "not_observed" ? "上游凭证：未观察到选择结果" : row.credential_result === "configuration_error" ? "上游凭证：配置错误" : "上游凭证：全部上游凭证";
          const id = String(pluginLog.id || "");
          return el("details", {
            class: "plugin-log-message",
            open: id && expandedPluginLogIDs.has(id) || undefined,
            ontoggle: (event) => {
              if (!id) return;
              if (event.currentTarget.open) expandedPluginLogIDs.add(id);

        } catch (_) { return el("div", { class: "plugin-log-message" }, message); }
      }
