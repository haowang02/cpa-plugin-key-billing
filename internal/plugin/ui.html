      // /v1/models requires a downstream API Key, so the browser borrows one only
      // for this same-origin request. The plugin never stores it.
      async function syncPriceCatalog(apiKeys) {
        const key = (apiKeys || [])
          .map((value) => (value || "").trim())
          .find(Boolean);
        if (!key) return "";
        try {
          const resp = await fetch(location.origin + "/v1/models", {
            headers: { Authorization: "Bearer " + key },
          });
          if (!resp.ok) {
            throw new Error("HTTP " + resp.status);
          }
          const payload = await resp.json();
          const models = modelIDs(payload);
          if (!models.length) {
            return "";
          }
          const result = await plugin("POST", "/prices/sync", { models });
          if (result.added || result.removed) {
            return (
              "模型同步完成：新增 " +
              result.added +
              " 个（" +
              result.priced +
              " 个有参考价），移除 " +
              result.removed +
              " 个"
            );
          }
          return "";
        } catch (err) {
          if (err instanceof AuthError) throw err;
          notify("同步模型失败：" + (err.message || err), "err");
          return "";
        }
      }

      async function autoSyncKeys() {
        const summaries = [];
        let keys = [];
        try {
          const list = await api("GET", "/v0/management/api-keys", null, {
            raw: true,
          });
          keys = (list && list["api-keys"]) || [];
          const result = await plugin("POST", "/keys/sync", {
            keys,
            allow_empty: true,
          });
          if (result.added || result.removed) {
            summaries.push(
              "API Key 同步完成：新增 " +
                result.added +
                " 个，移除 " +
                result.removed +
                " 个",
            );
          } else if (!keys.length) {
            summaries.push("CLIProxyAPI 尚未配置 API Key");
          }
        } catch (err) {
          if (err instanceof AuthError) throw err;
          notify("同步 API Key 失败：" + (err.message || err), "err");
        }
        const priceCatalog = await syncPriceCatalog(keys);
        if (priceCatalog) summaries.push(priceCatalog);
        return summaries.join("；");
      }

      async function submitLogin() {
        const role = loginMode;
        let key = $("gate-key").value.trim();
        if (!key) key = await recalledCredential(role);
        if (!key) {
          $("gate-error").textContent =
            role === "account" ? "请输入 API Key" : "请输入管理密钥";
          $("gate-error").className = "notice err show";
          return;
        }
        $("gate-submit").disabled = true;
        try {
          if (role === "account") await startAccount(key);
          else await startAdmin(key);
          if ($("gate-remember").checked) {
            try {
              await rememberCredential(role, key);
            } catch (err) {
              const message =
                "已登录，但无法在此浏览器中记住凭据：" + (err.message || err);
              notify(message, "err");
            }
          } else {
            await deleteCredential(role);
          }
          $("gate-key").value = "";
        } catch (err) {
          if (err instanceof AuthError) await deleteCredential(role);
          showGate(
            role,
            err instanceof AuthError
              ? err.message
              : "连接失败：" + (err.message || err),
          );
        } finally {
          $("gate-submit").disabled = false;
        }
      }

            ["path", { d: "M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z" }],
            ["circle", { cx: "16.5", cy: "7.5", r: ".5", fill: "currentColor" }],
          ],
        },
      };

      function actionIcon(name, className = "") {
        const icon = LUCIDE_ICONS[name];
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        const classes = [
          "lucide-icon",
          "lucide-" + icon.name,
          name === "chevron" ? "lucide-chevron-icon" : "",
          className,
        ].filter(Boolean);
        for (const [attribute, value] of Object.entries({
          class: classes.join(" "),
          viewBox: "0 0 24 24",
          fill: "none",
          stroke: "currentColor",
          "stroke-width": "2",
          "stroke-linecap": "round",
          "stroke-linejoin": "round",
          "aria-hidden": "true",
        })) svg.setAttribute(attribute, value);
        for (const [tag, attributes] of icon.nodes) {
          const child = document.createElementNS(svg.namespaceURI, tag);
          for (const [attribute, value] of Object.entries(attributes))
            child.setAttribute(attribute, value);
          svg.append(child);
        }
        return svg;
      }

      function setActionIcon(button, name, label) {
        button.replaceChildren(actionIcon(name));
        button.setAttribute("aria-label", label);
        button.title = label;
      }

      function setLabeledActionIcon(button, name, label) {
        button.replaceChildren(
          actionIcon(name),
          document.createTextNode(label),
        );
        button.setAttribute("aria-label", label);
      }

      function updateThemeButtons() {
        const dark = window.billingTheme?.current() === "dark";
        document
          .querySelectorAll('[data-page-action="theme"]')
          .forEach((button) => {
            setActionIcon(
              button,
              dark ? "sun" : "moon",
              dark ? "切换到浅色主题" : "切换到深色主题",
            );
          });
      }

      function updateThemedVisuals() {
        updateThemeButtons();
        if (
          currentRole === "admin" &&
          activeAdminTab() === "analysis" &&
          state.analysis
        ) {
          renderAnalysis(false);
        } else if (
          currentRole === "account" &&
          accountTab === "analysis" &&
          accountState.analysis
        ) {
          renderAnalysis(true);
        }
      }

      for (const button of document.querySelectorAll(
        '[data-page-action="refresh"]',
      )) {
        setActionIcon(button, "refresh", "刷新");
        button.onclick = () => refreshPage("foreground");
      }
      for (const button of document.querySelectorAll(
        '[data-page-action="logout"]',
      )) {
        setActionIcon(button, "logout", "退出登录");
      }
      document
        .querySelectorAll('[data-page-action="theme"]')
        .forEach((button) => {
          button.onclick = () => {
            window.billingTheme?.toggle();
          };
        });
      document
        .querySelectorAll('[data-page-action="logout"]')
        .forEach((button) => {
          button.onclick = () =>
            guard(async () => {
              const role = currentRole || loginMode;
              await deleteCredential(role);
              showGate(role, "");
            });
        });
      window.addEventListener("billing-theme-change", updateThemedVisuals);

      const AUTO_REFRESH_MS = 10000;
      let autoRefreshTimer = 0;
      let pageRefreshPromise = null;
      let queuedForegroundRefresh = null;

      function stopAutoRefresh() {
        clearTimeout(autoRefreshTimer);
        autoRefreshTimer = 0;
      }

      function activeTab(account) {
        return account ? accountTab : activeAdminTab();
      }

      function scrollerAtTop(id) {
        return $(id).scrollTop <= 0;
      }

      function canBackgroundRefreshRequestEvents(account) {
        const role = account ? "account" : "admin";
        return (
          currentRole === role &&
          activeTab(account) === "request-events" &&
          scrollerAtTop(
            account ? "account-request-events-body" : "request-events-body",
          )
        );
      }

      function canBackgroundRefreshErrors(account) {
        const role = account ? "account" : "admin";
        return (
          currentRole === role &&
          activeTab(account) === "errors" &&
          scrollerAtTop(account ? "account-errors" : "errors-body")
        );
      }

      function canBackgroundRefreshPluginLogs() {
        return (
          currentRole === "admin" &&
          activeAdminTab() === "settings" &&
          scrollerAtTop("plugin-logs-body")
        );
      }

      function shouldRenderRefreshedTab(background, tab, account) {
        if (!background) return true;
        if (tab === "analysis") return false;
        if (tab === "request-events") {
          return canBackgroundRefreshRequestEvents(account);
        }
        if (tab === "errors") return canBackgroundRefreshErrors(account);
        return true;
      }

      async function refreshRolePage(account, reason) {
        const background = reason === "background";
        const tab = activeTab(account);
        const tasks = [loadStatus(account, true)];
        if (account) {
          if (tab === "subscription") {
            tasks.push(loadAccountAccess(true), loadAccountPrices(true));
          }
        } else if (tab === "keys") {
          tasks.push(loadAdminAccess(true));
        } else if (tab === "settings") {
          tasks.push(loadAdminAccess(true), loadAdminPrices(true));
          if (!background || canBackgroundRefreshPluginLogs())
            tasks.push(loadPluginLogs({ background, deferRender: true }));
        }
        if (
          tab === "request-events" &&
          (!background || canBackgroundRefreshRequestEvents(account))
        ) {
          tasks.push(
            loadRequestEvents(false, account, {
              background,
              deferRender: true,
            }),
          );
        } else if (
          tab === "errors" &&
          (!background || canBackgroundRefreshErrors(account))
        ) {
          tasks.push(loadErrors(account, true, background));
        } else if (tab === "auth-files") {
          tasks.push(loadAuthFiles(account, true));
        } else if (tab === "analysis" && !background) {
          tasks.push(loadAnalysis(account, true));
        }
        const results = await Promise.allSettled(tasks);
        const renderDetail =
          activeTab(account) === tab &&
          shouldRenderRefreshedTab(background, tab, account);
        if (account) renderAccount(renderDetail);
        else renderAdminPage(renderDetail);
        const failed = results.find((result) => result.status === "rejected");
        if (failed) throw failed.reason;
      }

      function scheduleAutoRefresh() {
        stopAutoRefresh();
        if (!currentRole || document.hidden) return;
        autoRefreshTimer = setTimeout(() => {
          autoRefreshTimer = 0;
          refreshPage("background");
        }, AUTO_REFRESH_MS);
      }

      function setRefreshButtonsDisabled(disabled) {
        document
          .querySelectorAll('[data-page-action="refresh"]')
          .forEach((button) => {
            button.disabled = disabled;
          });
      }

      function refreshPage(reason) {
        const background = reason === "background";
        if (!currentRole || (background && document.hidden))
          return Promise.resolve();
        if (pageRefreshPromise) {
          if (background) return pageRefreshPromise;
          if (!queuedForegroundRefresh) {
            setRefreshButtonsDisabled(true);
            queuedForegroundRefresh = pageRefreshPromise.then(() => {
              queuedForegroundRefresh = null;
              if (!currentRole) {
                setRefreshButtonsDisabled(false);
                return undefined;
              }
              return refreshPage("foreground");
            });
          }
          return queuedForegroundRefresh;
        }
        stopAutoRefresh();
        if (!background) setRefreshButtonsDisabled(true);
        pageRefreshPromise = (async () => {
          try {
            await refreshRolePage(currentRole === "account", reason);
          } catch (err) {
            if (err instanceof AuthError) {
              await deleteCredential(currentRole);
              showGate(currentRole, err.message);
              return;
            }
            const message =
              (background ? "自动刷新失败：" : "刷新失败：") +
              (err.message || err);
            notify(message, "err");
          } finally {
            pageRefreshPromise = null;
            if (!background && !queuedForegroundRefresh)
              setRefreshButtonsDisabled(false);
            if (!queuedForegroundRefresh) scheduleAutoRefresh();
          }
        })();
        return pageRefreshPromise;
      }

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stopAutoRefresh();
        else if (currentRole) refreshPage("background");
      });
      document.querySelectorAll("[data-account-tab]").forEach((button) => {
        button.onclick = () => {
          setAccountTab(button.dataset.accountTab);
          guard(() => ensureViewInitialized(true));
        };
      });
      $("analysis-key").addEventListener("change", () =>
        guard(() => applySharedTimeRange(false)),
      );

      function resetRequestEventLoad(account) {
        const load = requestEventLoads[account ? "account" : "admin"];
        Object.assign(load, emptyRequestEventLoadState(), {
          request: load.request + 1,
        });
      }

      function applySharedTimeRange(account) {
        const owner = account ? accountState : state;
        owner.analysis = null;
        owner.errors = null;
        owner.requestEvents = null;
        resetLoadState(
          account ? detailLoads.accountAnalysis : detailLoads.adminAnalysis,
        );
        resetLoadState(
          account ? detailLoads.accountErrors : detailLoads.adminErrors,
        );
        resetRequestEventLoad(account);
        const tab = account ? accountTab : activeAdminTab();
        if (tab === "analysis") return loadAnalysis(account, false);
        if (tab === "errors") return loadErrors(account, false);
        if (tab === "request-events") return loadRequestEvents(false, account);
        return Promise.resolve();
      }

      for (const account of [false, true]) {
        const prefix = account ? "account-" : "";
        const load = account
          ? detailLoads.accountErrors
          : detailLoads.adminErrors;
        const ids = [prefix + "error-model", prefix + "error-source"];
        for (const id of ids) {
          $(id).addEventListener("change", () => {
            resetLoadState(load);
            guard(() => loadErrors(account, false));
          });
        }
        $(prefix + "errors-filter-clear").onclick = () => {
          for (const id of ids) $(id).value = "";
          resetLoadState(load);
          guard(() => loadErrors(account, false));
        };
      }
      for (const account of [false, true]) {
        const ui = authUI(account);
        setLabeledActionIcon(ui.bulk, "refresh", "更新限额");
        ui.enabledOnly.addEventListener("change", () =>
          renderAuthFiles(account),
        );
        ui.provider.addEventListener("change", () => renderAuthFiles(account));
        ui.search.addEventListener("input", () => renderAuthFiles(account));
        ui.bulk.onclick = () => guard(() => refreshFilteredAuthQuotas(account));
      }
      $("account-request-events-body").addEventListener(
        "scroll",
        () => {
          hideCostTooltip();
          maybeLoadMoreRequestEvents(true);
        },
        { passive: true },
      );

      const TABS = Array.from(
        document.querySelectorAll(".tabs button[data-tab]"),
      );
      function setAdminTab(name) {
        const selected = ADMIN_TAB_IDS.includes(name) ? name : "keys";
        if (selected !== "keys") closeRoutePicker();
        writePageRoute("admin", selected);
        for (const tab of TABS) {
          const active = tab.dataset.tab === selected;
          tab.classList.toggle("active", active);
          tab.setAttribute("aria-selected", String(active));
        }
        const visible =
          selected === "settings"
            ? new Set(["plans", "routes", "prices", "plugin-logs"])
            : new Set([selected]);
        for (const section of [
          "keys",
          "analysis",
          "plans",
          "routes",
          "prices",
          "request-events",
          "errors",
          "auth-files",
          "plugin-logs",
        ]) {
          $("tab-" + section).classList.toggle("hidden", !visible.has(section));
        }
        $("shared-time-filter").classList.toggle(
          "hidden",
          !["analysis", "request-events", "errors"].includes(selected),
        );
        $("request-events-export").classList.toggle(
          "hidden",
          selected !== "request-events",
        );
        if (!["analysis", "request-events", "errors"].includes(selected)) {
          closeSharedTimePopover(false);
        }
        if (currentRole === "admin" && state.status) {
          renderAdminTab(selected, selected === "keys" && !!routePicker.scope);
        }
        revealTab(document.querySelector(`[data-tab="${selected}"]`));
      }
      for (const tab of TABS)
        tab.onclick = () => {
          setAdminTab(tab.dataset.tab);
          guard(() => ensureViewInitialized(false));
        };

      $("key-filter").addEventListener("input", renderKeys);
      $("plan-kind").addEventListener("change", syncPlanFields);
      $("plan-new").onclick = () => {
        resetPlanForm();
        $("plan-dialog").showModal();
        $("plan-name").focus();
      };
      $("plan-cancel").onclick = () => $("plan-dialog").close();
      $("plan-dialog").addEventListener("close", resetPlanForm);
      $("plan-save").onclick = () =>
        guard(async () => {
          const plan = planFromForm();
          const id = $("plan-id").value;
          if (id) await plugin("PATCH", "/plans", { id, ...plan });
          else await plugin("POST", "/plans", plan);
          notify(id ? "订阅计划已保存" : "订阅计划已创建");
          $("plan-dialog").close();
          await refreshPage("foreground");
        });

      $("route-picker-search").addEventListener("input", () => {
        const searching = !!$("route-picker-search").value.trim();
        if (searching && !routePicker.searching) { routePicker.beforeSearch = { ...routePicker.expanded }; routePicker.expanded = { routes: true, credentials: true, models: true }; }
        if (!searching && routePicker.searching && routePicker.beforeSearch) routePicker.expanded = routePicker.beforeSearch;
        routePicker.searching = searching;
        renderRoutePicker();
      });
      $("route-picker-cancel").onclick = closeRoutePicker;
      $("route-picker-save").onclick = () => guard(saveRoutePicker);
      addEventListener("scroll", positionRoutePicker, {
        passive: true,
        capture: true,
      });
      addEventListener("resize", () => {
        positionRoutePicker();
        for (const tabBar of TAB_BARS) updateTabScrollHint(tabBar);
      });
      addEventListener(
        "pointerdown",
        (event) => {
          if (!routePicker.scope) return;
          if (
            $("route-picker").contains(event.target) ||
            (routePicker.anchor && routePicker.anchor.contains(event.target))
          )
            return;
          closeRoutePicker();
        },
        true,
      );
      addEventListener("keydown", (event) => {
        if (event.key === "Escape" && routePicker.scope) closeRoutePicker();
      });

      $("route-rule-search").addEventListener("input", () => {
        renderRouteModelList();
        renderRouteCredentialList();
      });
      $("route-rule-all").onclick = () => {
        routeModels = new Set(catalogModels());
        routeCredentialIDs = new Set();
        routeProviders = new Set(routeProviderChoices().map(providerKey));
        renderRouteModelList();
        renderRouteCredentialList();
      };
      $("route-rule-none").onclick = () => {
        routeModels = new Set();
        routeCredentialIDs = new Set();
        routeProviders = new Set();
        renderRouteModelList();
        renderRouteCredentialList();
      };
      $("route-new").onclick = () => {
        resetRouteForm();
        $("route-dialog").showModal();
        $("route-name").focus();
      };
      $("route-cancel").onclick = () => $("route-dialog").close();
      $("route-dialog").addEventListener("close", resetRouteForm);
      $("route-save").onclick = () =>
        guard(async () => {
          const button = $("route-save");
          button.disabled = true;
          const originalText = button.textContent;
          button.textContent = "正在保存…";
          try {
            const name = $("route-name").value.trim();
            if (!name) throw new Error("请输入规则名称");
            const id = $("route-id").value;
            const credential_providers = [...routeProviders].map((key) => { const [source, provider] = key.split("\u0000"); return { source, provider }; });
            const rule = { models: [...routeModels], credential_ids: [...routeCredentialIDs], credential_providers };
            const scopes = selectedRouteScopes();
            if (id) {
              const route = state.routes.find((item) => item.id === id);
              if (route?.bound_key_count && !(await confirmAction("保存路由规则？", "保存后将立即影响 " + route.bound_key_count + " 个 API Key，请确认规则效果。"))) return;
              await plugin("PATCH", "/routes", { id, name, rule, scopes });
            } else await plugin("POST", "/routes", { name, rule, scopes });
            notify(id ? "路由规则已保存" : "路由规则已创建");
            $("route-dialog").close();
            await refreshPage("foreground");
          } finally {
            button.disabled = false;
            if ($("route-dialog").open) button.textContent = originalText;
          }
        });

      $("plugin-log-filter").addEventListener("input", renderPluginLogs);
      $("plugin-log-level").addEventListener("change", () => { state.pluginLogs = null; state.pluginLogsNext = 0; guard(() => loadPluginLogs()); });
      $("plugin-logs-more").onclick = () => guard(() => loadPluginLogs({ append: true }));
      $("plugin-logs-clear").onclick = () =>
        guard(async () => {
          if (
            !(await confirmAction(
              "清空全部插件日志？",
              "该操作只清除插件自身的运行记录，不影响计费数据，且无法恢复。",
            ))
          )
            return;
          const result = await plugin("DELETE", "/plugin-logs");
          notify("已清空 " + result.cleared + " 条插件日志");
          await refreshPage("foreground");
        });
      for (const account of [false, true]) {
        const role = account ? "account" : "admin";
        for (const id of REQUEST_EVENT_FILTER_IDS[role]) {
          $(id).addEventListener("change", () =>
            guard(() => loadRequestEvents(false, account)),
          );
        }
        const clear = $(
          account ? "account-request-events-filter-clear" : "request-events-filter-clear",
        );
        clear.onclick = () => {
          for (const id of REQUEST_EVENT_FILTER_IDS[role]) $(id).value = "";
          updateRequestEventFilterControls(account);
          guard(() => loadRequestEvents(false, account));
        };
        const exportButton = $(
          account ? "account-request-events-export" : "request-events-export",
        );
        setLabeledActionIcon(exportButton, "download", "导出");
        exportButton.onclick = () => guard(() => exportRequestEvents(account));
        bindSharedTimeControls(account);
        updateSharedTimeControl(account);
      }
      addEventListener(
        "pointerdown",
        (event) => {
          for (const account of [false, true]) {
            const popover = $(sharedTimeID(account, "popover"));
            if (
              !popover.classList.contains("hidden") &&
              !popover.contains(event.target) &&
              !$(sharedTimeID(account, "trigger")).contains(event.target)
            ) {
              closeSharedTimePopover(account);
            }
          }
        },
        true,
      );
      addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        closeSharedTimePopover(false);
        closeSharedTimePopover(true);
      });
      $("request-events-body").addEventListener(
        "scroll",
        () => {
          hideCostTooltip();
          maybeLoadMoreRequestEvents(false);
        },
        { passive: true },
      );
      $("keys-reset-all").onclick = () =>
        guard(async () => {
          if (
            !(await confirmAction(
              "重置所有周期性额度？",
              "绑定周期性计划的 API Key 会结束当前周期，下一次请求开启新周期；不重置的计划和累计用量不受影响。",
            ))
          )
            return;
          const result = await plugin("POST", "/keys/reset-all");
          notify(
            result.reset
              ? "已重置 " + result.reset + " 个 API Key 的额度"
              : "没有需要重置的额度",
          );
          await refreshPage("foreground");
        });
      $("price-filter").addEventListener("input", () =>
        renderPriceTable(
          "prices-body",
          state.prices,
          $("price-filter").value,
          true,
        ),
      );
      $("price-reference-search").addEventListener("input", () => {
        clearTimeout(priceReferenceTimer);
        priceReferenceTimer = setTimeout(() => {
          priceReferenceTimer = 0;
          searchPriceReferences();
        }, 180);
      });
      $("price-tiered").addEventListener("change", syncPriceTierFields);
      $("price-dlg").addEventListener("close", () => {
        clearTimeout(priceReferenceTimer);
        priceReferenceTimer = 0;
        priceReferenceRequest++;
      });
      $("price-cancel").onclick = () => $("price-dlg").close();
      $("price-save").onclick = () =>
        guard(async () => {
          if (!editingModel) return;
          const rule = {
            pattern: editingModel,
            input_per_1m: Number($("price-in").value || 0),
            output_per_1m: Number($("price-out").value || 0),
            cache_read_per_1m: optionalNumber("price-cr"),
            cache_write_per_1m: optionalNumber("price-cw"),
          };
          if ($("price-tiered").checked) {
            const threshold = Number($("price-tier-threshold").value);
            if (!Number.isInteger(threshold) || threshold <= 0)
              throw new Error("长上下文阈值必须是大于 0 的整数");
            rule.long_context = {
              threshold_input_tokens: threshold,
              input_per_1m: Number($("price-tier-in").value || 0),
              output_per_1m: Number($("price-tier-out").value || 0),
              cache_read_per_1m: optionalNumber("price-tier-cr"),
              cache_write_per_1m: optionalNumber("price-tier-cw"),
            };
          }
          await plugin("PUT", "/prices", rule);
          $("price-dlg").close();
          notify("已保存 " + editingModel + " 的定价");
          await refreshPage("foreground");
        });
      $("price-reset").onclick = () =>
        guard(async () => {
          if (
            !(await confirmAction(
              "恢复全部参考价？",
              "自定义定价将被覆盖；没有参考价的模型将恢复为 0 USD。",
            ))
          )
            return;
          const result = await plugin("POST", "/prices/reset");
          notify("已恢复 " + result.restored + " 个模型的参考价");
          await refreshPage("foreground");
        });
      $("price-catalog-refresh").onclick = () =>
        guard(async () => {
          const button = $("price-catalog-refresh");
          button.disabled = true;
          try {
            const result = await plugin("POST", "/prices/catalog/refresh");
            notify(
              "参考价目录已更新，共 " +
                int(result.catalog?.models) +
                " 个模型；同步更新 " +
                int(result.updated_models) +
                " 个当前价格",
            );
            await refreshPage("foreground");
          } finally {
            button.disabled = false;
          }
        });

      (async function () {
        const panelKey = readPanelKey();
        document.querySelectorAll("[data-lucide-icon]").forEach((placeholder) =>
          placeholder.replaceWith(
            actionIcon(placeholder.dataset.lucideIcon, placeholder.className),
          ),
        );
        updateThemeButtons();
        try {
          if (embedded && panelKey && initialRoute.role !== "account") {
            await startAdmin(panelKey);
            return;
          }
          const saved = await recalledCredential(loginMode);
          if (!saved) {
            showGate(loginMode, "");
            return;
          }
          $("gate-remember").checked = true;
          if (loginMode === "account") await startAccount(saved);
          else await startAdmin(saved);
        } catch (err) {
          await deleteCredential(loginMode);
          showGate(
            loginMode,
            err instanceof AuthError
              ? err.message
              : "连接失败：" + (err.message || err),
          );
        }
      })();
    </script>
  </body>
</html>
