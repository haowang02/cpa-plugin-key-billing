function keyPillText(view) {
  const identity = view.preview || (view.scope || "").slice(0, 12) + "…";
  return view.label && view.label !== identity ? view.label + " · " + identity : identity;
}

async function saveConcurrency(view, raw) {
  const text = String(raw ?? "").trim();
  if (!/^\d+$/.test(text)) throw new Error("并发数必须是 0 到 10000 之间的整数");
  const limit = Number(text);
  if (!Number.isSafeInteger(limit) || limit < 0 || limit > 10000) {
    throw new Error("并发数必须是 0 到 10000 之间的整数");
  }
  await plugin("POST", "/keys/concurrency", { scope: view.scope, concurrency_limit: limit });
  notify(limit ? "并发数已更新为 " + limit : "已取消并发限制");
  await reloadAll();
}

function renderKeys() {
  const filter = $("key-filter").value.trim().toLowerCase();
  const rows = state.keys
    .filter((view) => !filter || (keyName(view) + " " + (view.plan_name || "") + " " + view.scope).toLowerCase().includes(filter))
    .map((view) => {
      const name = keyName(view);
      const select = el("select", {
        name: "plan_id",
        "aria-label": name + " 的订阅计划",
        onchange: (event) => guard(async () => {
          const planID = event.target.value;
          if (planID) await plugin("POST", "/keys/bind", { scope: view.scope, plan_id: planID });
          else await plugin("POST", "/keys/unbind", { scope: view.scope });
          notify("订阅计划已更新");
          await reloadAll();
        }),
      }, el("option", { value: "", text: "不限制" }),
         state.plans.map((plan) => el("option", { value: plan.id, selected: plan.id === view.plan_id }, plan.name || plan.id)));

      const quota = remainingQuota(view.used_percent);
      const usage = view.unlimited
        ? el("span", { class: "muted", text: "—" })
        : el("div", { class: "usage" },
            el("span", { class: "mono" }, "剩余 " + usd(Math.max(0, Number(view.limit_usd || 0) - Number(view.spent_usd || 0))) +
              " / " + usd(view.limit_usd)),
            el("div", { class: "bar", role: "progressbar", "aria-label": name + " 的剩余额度",
              "aria-valuemin": "0", "aria-valuemax": "100", "aria-valuenow": String(Math.round(quota.percent)) },
              el("i", { class: "quota-fill " + quota.level, style: "width:" + quota.percent + "%" })));

      const currentConcurrencyLimit = Number(view.concurrency_limit || 0);
      const concurrencyValues = CONCURRENCY_OPTIONS.includes(currentConcurrencyLimit)
        ? CONCURRENCY_OPTIONS
        : [...CONCURRENCY_OPTIONS, currentConcurrencyLimit].sort((a, b) => a - b);
      const concurrencySelect = el("select", {
        "aria-label": name + " 的最大并发请求数",
        title: "最大并发请求数；0 表示不限制",
        onchange: (event) => guard(async () => {
          if (event.target.value === CUSTOM_CONCURRENCY) {
            const raw = await ask("设置并发数", "请输入 0 到 10000 的整数，0 表示不限制。", String(currentConcurrencyLimit));
            if (raw === null) {
              event.target.value = String(currentConcurrencyLimit);
              return;
            }
            await saveConcurrency(view, raw);
            return;
          }
          await saveConcurrency(view, event.target.value);
        }),
      },
      concurrencyValues.map((limit) => el("option", {
        value: String(limit), selected: limit === currentConcurrencyLimit,
        text: limit === 0 ? "不限制" : String(limit),
      })),
      el("option", { value: CUSTOM_CONCURRENCY, text: "手动输入…" }));
      const concurrency = el("div", { class: "concurrency-editor" },
        el("span", { class: "native-select" }, concurrencySelect),
        el("span", { class: "small muted", text: "当前 " + int(view.current_concurrency) }));

      const notes = [];
      if (view.preview && view.preview !== name) notes.push(view.preview);
      if (!view.in_config) notes.push("不在 CLIProxyAPI Key 列表中");

      return el("tr", {},
        el("td", {},
          el("div", {}, name),
          notes.length ? el("div", { class: "muted small mono" }, notes.join(" · ")) : null,
        ),
        el("td", {}, el("span", { class: "native-select" }, select)),
        el("td", {}, modelTrigger(view)),
        el("td", {}, concurrency),
        el("td", {}, usage),
        el("td", { class: "small muted" }, cycleNote(view)),
        el("td", { class: "num" }, int(view.lifetime?.requests)),
        el("td", { class: "num" }, usd(view.lifetime?.cost_usd)),
        el("td", {}, view.blocked
          ? el("span", { class: "tag bad", text: "额度用尽" })
          : el("span", { class: "tag " + (view.unlimited ? "plain" : "ok"), text: view.unlimited ? "不限制" : "正常" })),
        el("td", { class: "small" },
          el("button", { class: "link", text: "重置额度", disabled: view.unlimited || undefined,
            onclick: () => guard(async () => {
              if (!await confirmAction("重置订阅额度？", "当前周期将结束，下一次请求会开启新周期；累计用量不受影响。")) return;
              await plugin("POST", "/keys/reset", { scope: view.scope });
              notify("订阅额度已重置"); await reloadAll();
            }) }),
          el("button", { class: "link", text: "设置备注",
            onclick: () => guard(async () => {
              const label = await ask("设置备注", keyName(view), view.label || "");
              if (label === null) return;
              await plugin("POST", "/keys/label", { scope: view.scope, label });
              notify("已保存备注"); await reloadAll();
            }) }),
        ),
      );
    });

  replaceContent($("keys-body"), table(
    ["API Key", "订阅计划", "可用模型", "并发数", "剩余额度", "到期时间",
      { label: "累计请求", num: true }, { label: "累计费用", num: true }, "状态", "操作"],
    rows));
}

function cycleNote(view, periodKind) {
  if (view.unlimited) return "—";
  const kind = periodKind || state.plans.find((plan) => plan.id === view.plan_id)?.period?.kind;
  if (kind === "never") return "不重置";
  return view.cycle_end_at ? when(view.cycle_end_at) : "未开始";
}

function groupName(id) {
  const group = state.groups.find((entry) => entry.id === id);
  return group ? (group.name || group.id) : id;
}

// What a key may actually call: the union its groups and single models add up
// to, which is the same reading the plugin enforces.
function effectiveModels(view) {
  const models = new Set(view.models || []);
  for (const id of view.model_groups || []) {
    const group = state.groups.find((entry) => entry.id === id);
    for (const model of (group && group.models) || []) models.add(model);
  }
  return [...models];
}

// The trigger says what the key may call without opening anything: groups first
// in the ordinary face, then single models in the monospace one the model lists
// use. It stays on one line and ellipsizes, with the whole grant in the tooltip.
function modelTrigger(view) {
  const names = view.all_models
    ? [{ text: ALL_GROUP_NAME, mono: false }]
    : (view.model_groups || []).map((id) => ({ text: groupName(id), mono: false }))
        .concat((view.models || []).map((model) => ({ text: model, mono: true })));
  const parts = names.flatMap((entry, index) => [
    index ? "、" : null,
    el("span", { class: entry.mono ? "mono" : "" }, entry.text),
  ]);
  // A selection adding up to no models at all — only empty groups — grants every
  // model rather than none, and the cell has to say so rather than list a
  // selection that limits nothing. It leads, because it is the part that must not
  // be what the line runs out of room for.
  const unlimited = !view.all_models && !effectiveModels(view).length;
  return el("button", {
    class: "model-trigger",
    title: names.map((entry) => entry.text).join("、"),
    "aria-label": keyName(view) + " 的可用模型",
    onclick: (event) => openModelPicker(view, event.currentTarget),
  },
  unlimited
    ? el("span", { class: "tag warn", text: "未限制", title: "所选分组还没有模型，当前等同于「" + ALL_GROUP_NAME + "」" })
    : null,
  parts);
}

// The models the proxy currently serves. Glob rows are pricing rules rather
// than models, so they are not something a key can be granted.
function catalogModels() {
  return state.prices
    .map((row) => row.pattern)
    .filter((pattern) => pattern && !/[*?]/.test(pattern))
    .sort(compareModelId);
}

// A model that left the proxy keeps its place in a selection: a model list is
// synchronized on every visit, and a provider that was briefly unreachable must
// not quietly rewrite who may call what.
function retiredModels(selected) {
  const known = new Set(catalogModels().map((model) => model.toLowerCase()));
  return [...selected].filter((model) => !known.has(model.toLowerCase())).sort(compareModelId);
}

function matchesTerm(text, term) {
  return !term || String(text).toLowerCase().includes(term);
}

let modelPicker = { scope: "", all: true, groups: new Set(), models: new Set(), anchor: null };

function openModelPicker(view, anchor) {
  modelPicker = {
    scope: view.scope,
    all: !!view.all_models,
    groups: new Set(view.model_groups || []),
    models: new Set(view.models || []),
    anchor,
  };
  $("model-picker-search").value = "";
  $("model-picker").classList.remove("hidden");
  renderModelPicker();
  positionModelPicker();
  $("model-picker-search").focus();
}

function closeModelPicker() {
  modelPicker.scope = "";
  modelPicker.anchor = null;
  $("model-picker").classList.add("hidden");
}

// Mirrors the cost tooltip: the popover lives at the document level because the
// cell it belongs to sits inside a table that scrolls horizontally, which would
// otherwise clip it. Narrow screens pin it to the bottom instead, in CSS.
function positionModelPicker() {
  const node = $("model-picker");
  if (!modelPicker.anchor || node.classList.contains("hidden")) return;
  const anchorRect = modelPicker.anchor.getBoundingClientRect();
  const rect = node.getBoundingClientRect();
  const margin = 8;
  let left = anchorRect.left;
  if (left + rect.width > innerWidth - margin) left = innerWidth - rect.width - margin;
  let top = anchorRect.bottom + 4;
  if (top + rect.height > innerHeight - margin) {
    const above = anchorRect.top - rect.height - 4;
    top = above >= margin ? above : Math.max(margin, innerHeight - rect.height - margin);
  }
  node.style.left = Math.round(Math.max(margin, left)) + "px";
  node.style.top = Math.round(top) + "px";
}

function pickerOption(checked, disabled, kind, label, note, onToggle) {
  return el("label", { class: "model-picker-option " + kind + (disabled ? " disabled" : "") },
    el("input", {
      type: "checkbox", checked: checked || undefined, disabled: disabled || undefined,
      onchange: (event) => onToggle(event.target.checked),
    }),
    el("span", {}, label),
    note ? el("span", { class: "count" }, note) : null,
  );
}

function renderModelPicker() {
  const term = $("model-picker-search").value.trim().toLowerCase();
  const list = $("model-picker-list");
  const sections = [];

  const groupOptions = [];
  if (matchesTerm(ALL_GROUP_NAME, term)) {
    groupOptions.push(pickerOption(modelPicker.all, false, "group", ALL_GROUP_NAME, "全部", (checked) => {
      // Selecting every model is exclusive: the other boxes are kept in memory
      // so that clearing this one puts the previous selection back, but while it
      // is on they are neither shown as selected nor selectable.
      modelPicker.all = checked;
      renderModelPicker();
    }));
  }
  for (const group of state.groups) {
    if (!matchesTerm(group.name || group.id, term)) continue;
    groupOptions.push(pickerOption(!modelPicker.all && modelPicker.groups.has(group.id), modelPicker.all, "group",
      group.name || group.id, (group.models || []).length + " 个模型", (checked) => {
        if (checked) modelPicker.groups.add(group.id);
        else modelPicker.groups.delete(group.id);
        renderModelPicker();
      }));
  }
  if (groupOptions.length) {
    sections.push(el("div", { class: "model-picker-group" }, "分组"), ...groupOptions);
  }

  const modelOptions = catalogModels()
    .filter((model) => matchesTerm(model, term))
    .map((model) => pickerOption(!modelPicker.all && modelPicker.models.has(model), modelPicker.all, "model", model, "", (checked) => {
      if (checked) modelPicker.models.add(model);
      else modelPicker.models.delete(model);
      renderModelPicker();
    }));
  if (modelOptions.length) {
    sections.push(el("div", { class: "model-picker-group" }, "模型"), ...modelOptions);
  }

  const retired = retiredModels(modelPicker.models).filter((model) => matchesTerm(model, term));
  if (retired.length) {
    sections.push(el("div", { class: "model-picker-group" }, "已下线"));
    for (const model of retired) {
      sections.push(pickerOption(!modelPicker.all, modelPicker.all, "model", model, "不在模型列表中", (checked) => {
        if (checked) modelPicker.models.add(model);
        else modelPicker.models.delete(model);
        renderModelPicker();
      }));
    }
  }

  list.replaceChildren(...(sections.length ? sections : [el("div", { class: "empty", text: "没有匹配的分组或模型" })]));
  const selected = modelPicker.groups.size + modelPicker.models.size;
  // Saving nothing has no meaning to express: a key that may call every model
  // says so by selecting the all-models group, which is what an empty selection
  // is stored as. Asking for the choice is clearer than making it silently.
  $("model-picker-save").disabled = !modelPicker.all && !selected;
  $("model-picker-hint").textContent = modelPicker.all
    ? "已选择「" + ALL_GROUP_NAME + "」，取消后可选择其他分组和模型"
    : (selected ? "已选择 " + selected + " 项，可用模型为所有分组和模型的并集"
      : "请至少选择一个分组或模型；不限制模型请选择「" + ALL_GROUP_NAME + "」");
}

function saveModelPicker() {
  const scope = modelPicker.scope;
  const unrestricted = modelPicker.all;
  if (!scope || (!unrestricted && !modelPicker.groups.size && !modelPicker.models.size)) return;
  const body = unrestricted
    ? { scope, groups: [ALL_GROUP_ID], models: [] }
    : { scope, groups: [...modelPicker.groups], models: [...modelPicker.models] };
  guard(async () => {
    await plugin("POST", "/keys/models", body);
    notify(unrestricted ? "该 API Key 可以使用全部模型" : "可用模型已更新");
    await reloadAll();
  });
}

function renderModels() {
  const rows = (state.stats?.by_model || []).map((entry) => {
    const input = entry.uncached_input_tokens + entry.cache_read_tokens + entry.cache_creation_tokens;
    return el("tr", {},
      el("td", { class: "mono" }, entry.billing_model),
      el("td", { class: "num" }, int(entry.requests)),
      el("td", { class: "num" }, tokens(input)),
      el("td", { class: "num" }, tokens(entry.output_tokens)),
      el("td", { class: "num" }, tokens(entry.cache_read_tokens)),
      el("td", { class: "num" }, cacheReadRate(entry.cache_read_tokens, input)),
      el("td", { class: "num" }, tokens(entry.cache_creation_tokens)),
      el("td", { class: "num" }, usd(entry.cost_usd)),
    );
  });
  replaceContent($("models-body"), table(
    ["模型", { label: "请求", num: true }, { label: "输入", num: true }, { label: "输出", num: true },
      { label: "缓存读取", num: true }, { label: "缓存率", num: true },
      { label: "缓存写入", num: true }, { label: "费用", num: true }],
    rows));
}

function renderPlans() {
  const rows = state.plans.map((plan) => {
    const boundKeys = state.keys.filter((key) => key.plan_id === plan.id);
    return el("tr", {},
      el("td", {}, plan.name || plan.id),
      el("td", { class: "num" }, usd(plan.amount_usd)),
      el("td", {}, periodText(plan.period)),
      el("td", {}, boundKeys.length
        ? el("div", { class: "key-pill-list" }, boundKeys.map((key) =>
            el("span", { class: "key-pill", text: keyPillText(key), title: key.scope })))
        : el("span", { class: "muted", text: "—" })),
      el("td", { class: "small" },
        el("button", { class: "link", text: "编辑", onclick: () => editPlan(plan) }),
        el("button", { class: "link danger", text: "删除", onclick: () => guard(async () => {
          if (!await confirmAction("删除订阅计划「" + (plan.name || plan.id) + "」？",
            boundKeys.length ? ("已绑定的 " + boundKeys.length + " 个 API Key 将改为不限制。") : "")) return;
          await plugin("DELETE", "/plans?id=" + encodeURIComponent(plan.id));
          notify("订阅计划已删除"); resetPlanForm(); await reloadAll();
        }) }),
      ),
    );
  });
  replaceContent($("plans-body"), table(
    ["名称", { label: "额度", num: true }, "周期", "已绑定 Key", "操作"],
    rows));
  renderPlanKeyPicker($("plan-id").value);
}

function keyPills(keys) {
  return keys.length
    ? el("div", { class: "key-pill-list" }, keys.map((key) =>
        el("span", { class: "key-pill", text: keyPillText(key), title: key.scope })))
    : el("span", { class: "muted", text: "—" });
}

function renderGroups() {
  const allRow = el("tr", {},
    el("td", {}, ALL_GROUP_NAME),
    el("td", { class: "num" }, el("span", { class: "tag plain", text: "全部" })),
    el("td", { class: "small muted" }, "系统内置，始终包含 CLIProxyAPI 当前提供的全部模型"),
    el("td", {}, keyPills(state.keys.filter((key) => key.all_models))),
    el("td", { class: "small muted" }, "—"),
  );
  const rows = [allRow, ...state.groups.map((group) => {
    const models = group.models || [];
    const boundKeys = state.keys.filter((key) => (key.model_groups || []).includes(group.id));
    return el("tr", {},
      el("td", {}, group.name || group.id),
      el("td", { class: "num" }, models.length
        ? String(models.length)
        : el("span", { class: "tag warn", text: "空分组", title: "空分组不限制任何模型" })),
      el("td", {}, models.length
        ? el("div", { class: "key-pill-list group-models" },
            models.slice(0, 4).map((model) => el("span", { class: "key-pill pill-model", text: model }))
              .concat(models.length > 4 ? [el("span", { class: "muted small" }, "+" + (models.length - 4))] : []))
        : el("span", { class: "muted", text: "—" })),
      el("td", {}, keyPills(boundKeys)),
      el("td", { class: "small" },
        el("button", { class: "link", text: "编辑", onclick: () => editGroup(group) }),
        el("button", { class: "link danger", text: "删除", onclick: () => guard(async () => {
          if (!await confirmAction("删除模型分组「" + (group.name || group.id) + "」？",
            boundKeys.length
              ? "已绑定的 " + boundKeys.length + " 个 API Key 将移除该分组；因此不再有任何选择的 Key 会恢复为全部模型。"
              : "")) return;
          await plugin("DELETE", "/model-groups?id=" + encodeURIComponent(group.id));
          notify("模型分组已删除"); resetGroupForm(); await reloadAll();
        }) }),
      ),
    );
  })];
  replaceContent($("groups-body"), table(
    ["名称", { label: "模型数", num: true }, "包含模型", "已绑定 Key", "操作"], rows));
  renderGroupModelPicker();
}

let groupModels = new Set();

function renderGroupModelPicker() {
  const node = $("group-model-picker");
  const term = $("group-model-search").value.trim().toLowerCase();
  const retired = new Set(retiredModels(groupModels));
  const models = catalogModels().concat([...retired]);
  $("group-model-count").textContent = String(groupModels.size);
  const options = models.filter((model) => matchesTerm(model, term)).map((model) =>
    el("label", {},
      el("input", {
        type: "checkbox", value: model, checked: groupModels.has(model) || undefined,
        onchange: (event) => {
          if (event.target.checked) groupModels.add(model);
          else groupModels.delete(model);
          $("group-model-count").textContent = String(groupModels.size);
        },
      }),
      el("span", { class: "mono" }, model),
      retired.has(model) ? el("span", { class: "muted small", text: "不在模型列表中" }) : null,
    ));
  node.replaceChildren(...(options.length
    ? options
    : [el("div", { class: "empty", text: state.prices.length ? "没有匹配的模型" : "暂无模型，请先在「模型定价」同步" })]));
}

function resetGroupForm() {
  $("group-form-title").textContent = "新建模型分组";
  $("group-id").value = "";
  $("group-name").value = "";
  $("group-model-search").value = "";
  $("group-cancel").classList.add("hidden");
  groupModels = new Set();
  renderGroupModelPicker();
}

function editGroup(group) {
  $("group-form-title").textContent = "编辑模型分组：" + (group.name || group.id);
  $("group-id").value = group.id;
  $("group-name").value = group.name || "";
  $("group-model-search").value = "";
  $("group-cancel").classList.remove("hidden");
  groupModels = new Set(group.models || []);
  renderGroupModelPicker();
  $("group-name").scrollIntoView({ block: "center", behavior: "smooth" });
}

function priceSourceTag(source) {
  switch (source) {
    case "custom": return el("span", { class: "tag warn", text: "自定义" });
    case "builtin": return el("span", { class: "tag ok", text: "参考价" });
    default: return el("span", { class: "tag plain", text: "待定价" });
  }
}

function optionalPrice(value) {
  return value === null || value === undefined
    ? el("span", { class: "muted", text: "-" })
    : usd(value);
}

function tierPriceCell(row, field, optional) {
  const base = row[field];
  const tier = row.long_context;
  if (!tier) return optional ? optionalPrice(base) : usd(base);
  const threshold = tokenThreshold(tier.threshold_input_tokens);
  const longValue = tier[field];
  if (optional && (base === null || base === undefined) && (longValue === null || longValue === undefined)) {
    return el("span", { class: "muted", text: "-" });
  }
  return el("div", { class: "tier-price" },
    el("span", {}, optional ? optionalPrice(base) : usd(base)),
    el("span", { class: "muted small" }, ">" + threshold + " ", optional ? optionalPrice(longValue) : usd(longValue)),
  );
}

// Group prefixed and unprefixed variants by base model name.
function modelIdParts(pattern) {
  const slash = pattern.indexOf("/");
  if (slash < 0) return { name: pattern, prefix: "" };
  return { name: pattern.slice(slash + 1), prefix: pattern.slice(0, slash) };
}

function compareModelId(a, b) {
  const ka = modelIdParts(a);
  const kb = modelIdParts(b);
  if (ka.name !== kb.name) return ka.name < kb.name ? -1 : 1;
  if (ka.prefix !== kb.prefix) return ka.prefix < kb.prefix ? -1 : 1;
  return 0;
}

function renderPriceTable(target, prices, filter, editable) {
  filter = filter.trim().toLowerCase();
  const rows = (prices || [])
    .filter((row) => !filter || row.pattern.toLowerCase().includes(filter))
    .sort((a, b) => compareModelId(a.pattern, b.pattern))
    .map((row) => {
      const cells = [
        el("td", { class: "mono" }, row.pattern),
        el("td", { class: "num" }, tierPriceCell(row, "input_per_1m", false)),
        el("td", { class: "num" }, tierPriceCell(row, "output_per_1m", false)),
        el("td", { class: "num" }, tierPriceCell(row, "cache_read_per_1m", true)),
        el("td", { class: "num" }, tierPriceCell(row, "cache_write_per_1m", true)),
      ];
      if (editable) {
        cells.push(el("td", {}, priceSourceTag(row.source)));
        cells.push(el("td", { class: "small" },
          el("button", { class: "link", text: "编辑", onclick: () => editPrice(row) })));
      }
      return el("tr", {}, cells);
    });
  const headers = ["模型", { label: "输入 / 1M Token", num: true }, { label: "输出 / 1M Token", num: true },
    { label: "缓存读取 / 1M Token", num: true }, { label: "缓存写入 / 1M Token", num: true }];
  if (editable) headers.push("来源", "操作");
  replaceContent($(target), table(headers, rows));
}

function logKeyName(entry) {
  return entry.label || entry.preview || (entry.scope || "").slice(0, 12) + "…";
}

function costTierText(cost) {
  const threshold = tokenThreshold(cost.threshold_input_tokens);
  return cost.long_context ? "长上下文 >" + threshold : "标准上下文 ≤" + threshold;
}

function showCostTooltip(anchor, cost, reasoningTokens) {
  const tooltip = $("cost-tooltip");
  const input = Number(cost.uncached_input_tokens || 0) + Number(cost.cache_read_tokens || 0) + Number(cost.cache_write_tokens || 0);
  const output = Number(cost.billed_output_tokens || 0);
  const rows = [
    ["未缓存输入", cost.uncached_input_tokens, cost.applied_input_per_1m, cost.uncached_input_usd],
    ["缓存读取", cost.cache_read_tokens, cost.applied_cache_read_per_1m, cost.cache_read_usd],
    ["缓存写入", cost.cache_write_tokens, cost.applied_cache_write_per_1m, cost.cache_write_usd],
    ["输出", output, cost.applied_output_per_1m, cost.output_usd],
  ];
  tooltip.replaceChildren(
    el("div", { class: "cost-tooltip-title", text: "计价详情" }),
    el("div", { class: "cost-tooltip-summary" },
      cost.tiered ? el("span", {}, "档位") : null,
      cost.tiered ? el("b", {}, costTierText(cost)) : null,
      el("span", {}, "输入 Token"), el("b", {}, exactTokens(input)),
      el("span", {}, "输出 Token"), el("b", {}, exactTokens(output)),
      reasoningTokens ? el("span", {}, "其中推理 Token") : null,
      reasoningTokens ? el("b", {}, exactTokens(reasoningTokens)) : null,
    ),
    el("div", { class: "cost-tooltip-grid" },
      el("span", { class: "cost-tooltip-head" }, "项目"),
      el("span", { class: "cost-tooltip-head num" }, "Token / 单价"),
      el("span", { class: "cost-tooltip-head num" }, "金额"),
      rows.flatMap(([name, tokenCount, price, amount]) => [
        el("span", {}, name),
        el("span", { class: "num" }, exactTokens(tokenCount) + " × " + usd(price) + " / 1M"),
        el("span", { class: "num" }, usd(amount)),
      ]),
    ),
    el("div", { class: "cost-tooltip-total" }, el("span", {}, "总金额"), el("span", {}, usd(cost.total_usd))),
  );
  tooltip.classList.add("show");
  tooltip.setAttribute("aria-hidden", "false");
  positionCostTooltip(anchor);
}

function positionCostTooltip(anchor) {
  const tooltip = $("cost-tooltip");
  const anchorRect = anchor.getBoundingClientRect();
  const gap = 8;
  const margin = 8;
  let left = anchorRect.right + gap;
  let top = anchorRect.top;
  const rect = tooltip.getBoundingClientRect();
  if (left + rect.width > innerWidth - margin) left = anchorRect.left - rect.width - gap;
  if (left < margin) left = Math.max(margin, innerWidth - rect.width - margin);
  if (top + rect.height > innerHeight - margin) top = innerHeight - rect.height - margin;
  tooltip.style.left = Math.round(left) + "px";
  tooltip.style.top = Math.round(Math.max(margin, top)) + "px";
}

function hideCostTooltip() {
  const tooltip = $("cost-tooltip");
  tooltip.classList.remove("show");
  tooltip.setAttribute("aria-hidden", "true");
}

const LOG_STATUS_LABELS = { "": "全部状态", normal: "正常", failed: "失败" };

// Counts cover the whole field/time selection and ignore the status choice,
// so each status option can show how many entries selecting it would reveal.
function labelLogStatuses(select, counts) {
  for (const option of select.options) {
    option.textContent = LOG_STATUS_LABELS[option.value] + "（" + int((counts || {})[option.value || "all"]) + "）";
  }
}

function populateLogSelect(select, defaultLabel, values, valueOf = (item) => item, labelOf = valueOf) {
  const selected = select.value;
  const selectedLabel = select.selectedOptions[0]?.textContent || selected;
  const options = [el("option", { value: "", text: defaultLabel })];
  let found = !selected;
  for (const item of values || []) {
    const value = String(valueOf(item) || "");
    if (!value) continue;
    if (value === selected) found = true;
    options.push(el("option", { value, text: labelOf(item) }));
  }
  if (selected && !found) options.push(el("option", { value: selected, text: selectedLabel }));
  select.replaceChildren(...options);
  select.value = selected;
}

function populateLogFilters(filters, account) {
  if (!filters) return;
  const prefix = account ? "account-log" : "log";
  if (!account) {
    populateLogSelect($("log-key"), "全部 API Key", filters.api_keys,
      (item) => item.scope, (item) => item.label ? item.label + " · " + item.preview : item.preview || item.scope);
  }
  populateLogSelect($(prefix + "-model"), "全部模型", filters.models);
  populateLogSelect($(prefix + "-source"), "全部来源", filters.sources);
}

function logPath(offset, limit, account) {
  const params = new URLSearchParams({
    offset: String(offset),
    limit: String(limit || LOG_BATCH_SIZE),
  });
  const prefix = account ? "account-log" : "log";
  const key = account ? "" : $("log-key").value;
  const model = $(prefix + "-model").value;
  const source = $(prefix + "-source").value;
  const status = $(prefix + "-status").value;
  if (key) params.set("api_key", key);
  if (model) params.set("model", model);
  if (source) params.set("source", source);
  if (status) params.set("status", status);
  const range = logTimeRanges[account ? "account" : "admin"];
  if (range.from) params.set("from", range.from);
  if (range.to) params.set("to", range.to);
  return "/logs?" + params.toString();
}

function logTimeLabel(range) {
  if (range.mode === "custom") {
    const format = (value) => new Date(value).toLocaleString("zh-CN", {
      month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false,
    });
    return format(range.from) + " – " + format(range.to);
  }
  return LOG_TIME_LABELS[range.mode] || LOG_TIME_LABELS.today;
}

function localDateTimeValue(date) {
  const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 16);
}

function recentLogTimeRange(mode) {
  const to = new Date();
  const value = Number.parseInt(mode, 10);
  const duration = value * (mode.endsWith("h") ? 3600000 : 86400000);
  return { mode, from: new Date(to.getTime() - duration).toISOString(), to: to.toISOString() };
}

function naturalLogTimeRange(mode) {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const from = mode === "yesterday"
    ? new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1) : today;
  const to = mode === "yesterday"
    ? today : new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1);
  return { mode, from: from.toISOString(), to: to.toISOString() };
}

function logTimeID(account, suffix) {
  return (account ? "account-log" : "log") + "-time-" + suffix;
}

function logTimePresetSelector(account) {
  return "[data-" + (account ? "account-" : "") + "log-time-preset]";
}

function updateLogFilterControls(account) {
  const role = account ? "account" : "admin";
  $(logTimeID(account, "label")).textContent = logTimeLabel(logTimeRanges[role]);
  $(account ? "account-logs-filter-clear" : "logs-filter-clear").disabled =
    !LOG_FILTER_IDS[role].some((id) => $(id).value);
}

function closeLogTimePopover(account) {
  $(logTimeID(account, "popover")).classList.add("hidden");
  $(logTimeID(account, "backdrop")).classList.add("hidden");
  $(logTimeID(account, "trigger")).setAttribute("aria-expanded", "false");
}

function renderLogTimePopover(mode, account) {
  document.querySelectorAll(logTimePresetSelector(account)).forEach((button) =>
    button.classList.toggle("active", button.dataset[account ? "accountLogTimePreset" : "logTimePreset"] === mode));
  $(logTimeID(account, "custom")).classList.toggle("hidden", mode !== "custom");
  if (mode === "custom") {
    const now = new Date();
    const range = logTimeRanges[account ? "account" : "admin"];
    const from = range.mode === "custom" ? new Date(range.from) : new Date(now.getTime() - 86400000);
    const to = range.mode === "custom" ? new Date(range.to) : now;
    $(logTimeID(account, "from")).value = localDateTimeValue(from);
    $(logTimeID(account, "to")).value = localDateTimeValue(to);
  }
}

function openLogTimePopover(account) {
  const popover = $(logTimeID(account, "popover"));
  if (!popover.classList.contains("hidden")) {
    closeLogTimePopover(account);
    return;
  }
  renderLogTimePopover(logTimeRanges[account ? "account" : "admin"].mode, account);
  popover.classList.remove("hidden");
  $(logTimeID(account, "backdrop")).classList.remove("hidden");
  $(logTimeID(account, "trigger")).setAttribute("aria-expanded", "true");
}

function applyLogTimeRange(range, account) {
  logTimeRanges[account ? "account" : "admin"] = range;
  updateLogFilterControls(account);
  closeLogTimePopover(account);
  guard(() => loadLogs(false, account));
}

function bindLogTimeControls(account) {
  const selector = logTimePresetSelector(account);
  const modeOf = (button) => button.dataset[account ? "accountLogTimePreset" : "logTimePreset"];
  $(logTimeID(account, "trigger")).onclick = () => openLogTimePopover(account);
  $(logTimeID(account, "backdrop")).onclick = () => closeLogTimePopover(account);
  document.querySelectorAll(selector).forEach((button) => {
    button.onclick = () => {
      const mode = modeOf(button);
      renderLogTimePopover(mode, account);
      if (mode === "custom") return;
      if (mode === "today" || mode === "yesterday") {
        applyLogTimeRange(naturalLogTimeRange(mode), account);
      } else {
        applyLogTimeRange(recentLogTimeRange(mode), account);
      }
    };
  });
  $(logTimeID(account, "cancel")).onclick = () => closeLogTimePopover(account);
  $(logTimeID(account, "apply")).onclick = () => guard(async () => {
    const from = new Date($(logTimeID(account, "from")).value);
    const to = new Date($(logTimeID(account, "to")).value);
    if (!Number.isFinite(from.getTime()) || !Number.isFinite(to.getTime())) {
      throw new Error("请选择完整的开始和结束时间");
    }
    if (from >= to) throw new Error("开始时间必须早于结束时间");
    applyLogTimeRange({ mode: "custom", from: from.toISOString(), to: to.toISOString() }, account);
  });
}

function csvCell(value) {
  if (value === undefined || value === null) return "";
  let text = String(value);
  if (/^[=+\-@]/.test(text)) text = "'" + text;
  return '"' + text.replaceAll('"', '""') + '"';
}

function logCSV(entries, account) {
  const columns = account ? ACCOUNT_LOG_CSV_COLUMNS : LOG_CSV_COLUMNS;
  const lines = [columns.map(csvCell).join(",")];
  for (const entry of entries) {
    const row = account ? entry : { ...entry, ...entry.cost };
    lines.push(columns.map((column) => csvCell(row[column])).join(","));
  }
  return "\ufeff" + lines.join("\r\n") + "\r\n";
}

function downloadCSV(filename, content) {
  const url = URL.createObjectURL(new Blob([content], { type: "text/csv;charset=utf-8" }));
  const anchor = el("a", { href: url, download: filename });
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 0);
}

async function exportLogs(account) {
  if (logExporting) return;
  logExporting = true;
  const button = $(account ? "account-logs-export" : "logs-export");
  const original = button.textContent;
  button.disabled = true;
  button.textContent = "正在导出…";
  try {
    const entries = [];
    let total = Infinity;
    while (entries.length < total) {
      const path = logPath(entries.length, LOG_EXPORT_BATCH_SIZE, account);
      const page = account ? await accountAPI(path) : await plugin("GET", path);
      const incoming = page.entries || [];
      total = Number(page.total || 0);
      entries.push(...incoming);
      if (!incoming.length) break;
    }
    const stamp = new Date().toISOString().replaceAll(":", "-").slice(0, 19);
    const name = account ? "cpa-key-billing-account-logs-" : "cpa-key-billing-logs-";
    downloadCSV(name + stamp + ".csv", logCSV(entries, account));
    notify("已导出 " + int(entries.length) + " 条计费日志");
  } finally {
    logExporting = false;
    button.disabled = false;
    button.textContent = original;
  }
}

function shouldLoadMoreLogs(scroller) {
  return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight <= LOG_LOAD_MORE_THRESHOLD_PX;
}

function maybeLoadMoreLogs(account) {
  account = account === true;
  const role = account ? "account" : "admin";
  const tabActive = account ? accountTab === "logs" : !!document.querySelector('[data-tab="logs"].active');
  if (currentRole !== role || !tabActive) return;
  const scroller = $(account ? "account-logs" : "logs-body");
  if (!logAutoLoadMore || !logHasMore || logLoading || logLoadingMore || !shouldLoadMoreLogs(scroller)) return;
  guard(() => loadLogs(true, account));
}

async function loadLogs(append, account) {
  account = account === true;
  append = append === true;
  if (append && (!logHasMore || logLoading || logLoadingMore)) return;
  const owner = account ? accountState : state;
  const scroller = $(account ? "account-logs" : "logs-body");
  const renderLogsNow = account ? renderAccountLogs : renderLogs;
  const existing = append && owner.logs ? (owner.logs.entries || []) : [];
  const offset = existing.length;
  const ticket = ++logRequest;
  if (append) {
    logLoadingMore = true;
  } else {
    logLoading = true;
    logLoadingMore = false;
    logHasMore = false;
    logAutoLoadMore = true;
    logLoadError = "";
  }
  if (!owner.logs || append) renderLogsNow();
  try {
    const path = logPath(offset, LOG_BATCH_SIZE, account);
    const page = account ? await accountAPI(path) : await plugin("GET", path);
    // Filter changes can overtake an older request. Only the newest generation
    // may replace or append rows.
    if (ticket !== logRequest) return;
    const incoming = page.entries || [];
    const entries = existing.concat(incoming);
    owner.logs = { ...page, filter_options: page.filter_options || owner.logs?.filter_options, entries };
    logHasMore = incoming.length > 0 && entries.length < Number(page.total || 0);
    logAutoLoadMore = true;
    logLoadError = "";
  } catch (err) {
    if (ticket === logRequest) {
      logLoadError = err.message || String(err);
      if (append) logAutoLoadMore = false;
    }
    throw err;
  } finally {
    if (ticket === logRequest) {
      logLoading = false;
      logLoadingMore = false;
      renderLogsNow();
    }
  }
}

function renderLogs() {
  hideCostTooltip();
  const view = state.logs;
  const note = $("log-note");
  if (!view) {
    note.textContent = "";
    if (logLoading) {
      $("logs-body").replaceChildren(el("div", { class: "empty", text: "加载中…" }));
    } else if (logLoadError) {
      $("logs-body").replaceChildren(el("div", { class: "empty" },
        el("div", { text: "计费日志加载失败" }),
        el("button", { style: "margin-top:10px", onclick: () => guard(() => loadLogs(false)) }, "重试")));
    } else {
      $("logs-body").replaceChildren(el("div", { class: "empty", text: "暂无数据" }));
    }
    return;
  }
  populateLogFilters(view.filter_options, false);
  labelLogStatuses($("log-status"), view.status_counts);
  updateLogFilterControls(false);
  const entries = view.entries || [];
  note.textContent = "已加载 " + int(entries.length) + " / " + int(view.total) + " 条";
  const scroller = $("logs-body");
  const previousScrollTop = scroller.scrollTop;
  const previousScrollLeft = scroller.scrollLeft;
  const rows = entries
    .map((entry) => {
      const cost = entry.cost || {};
      const keyDisplay = logKeyName(entry);
      const statusMarks = [];
      if (entry.failed) statusMarks.push(el("span", { class: "tag bad", text: "失败" }));
      if (entry.accounting_quality && entry.accounting_quality !== "complete") {
        statusMarks.push(el("span", { class: "tag warn",
          text: entry.accounting_quality === "inconsistent" ? "Token 明细异常" : "Token 未分类" }));
      }
      if (entry.price_source === "none" && entry.accounting_quality === "complete") {
        statusMarks.push(el("span", { class: "tag warn", text: "待定价" }));
      }
      if (!statusMarks.length) statusMarks.push(el("span", { class: "tag ok", text: "正常" }));

      const input = (cost.uncached_input_tokens || 0) + (cost.cache_read_tokens || 0) + (cost.cache_write_tokens || 0);
      const output = cost.billed_output_tokens || 0;
      // Without an observed breakdown the counts are unknown, not zero, and a
      // column of zeroes would read as "this request used nothing".
      const measured = entry.accounting_quality === "complete";
      const tokens = (value) => measured ? exactTokens(value) : "—";
      const hasTTFT = Number(entry.ttft_ms || 0) > 0;

      const billingModel = entry.billing_model || entry.upstream_model || "—";
      const upstreamModel = entry.upstream_model || "—";
      const showUpstreamModel = entry.upstream_model && entry.upstream_model !== billingModel;

      return el("tr", {},
        el("td", { class: "small" }, when(entry.at)),
        el("td", {},
          el("div", {}, keyDisplay),
          entry.preview && entry.preview !== keyDisplay
            ? el("div", { class: "muted small mono" }, entry.preview)
            : null,
        ),
        el("td", { class: "small" },
          el("div", { class: "log-cell-line mono" }, billingModel),
          showUpstreamModel ? el("div", { class: "log-cell-line muted" }, "上游 " + upstreamModel) : null,
        ),
        el("td", { class: "small" },
          el("div", { class: "log-cell-line mono" }, entry.executor_type || "执行器未知"),
          el("div", { class: "log-source muted", title: entry.source || null }, entry.source || "来源未知"),
        ),
        el("td", { class: "small" },
          el("div", { class: "log-cell-line mono" }, entry.reasoning_effort || "—"),
          el("div", { class: "log-cell-line muted" }, entry.service_tier || "—"),
        ),
        el("td", { class: "log-status" }, statusMarks),
        el("td", { class: "num" },
          el("div", {}, outputTPS(cost, entry.latency_ms, measured)),
          el("div", {
            class: "muted small", title: hasTTFT ? "首字延迟 · 总延迟" : "总延迟",
          }, hasTTFT
            ? latency(entry.ttft_ms) + " · " + latency(entry.latency_ms)
            : latency(entry.latency_ms)),
        ),
        el("td", { class: "num" }, tokens(input)),
        el("td", { class: "num" },
          el("div", {}, tokens(cost.cache_read_tokens)),
          measured ? el("div", { class: "muted small" }, cacheReadRate(cost.cache_read_tokens, input)) : null,
        ),
        el("td", { class: "num" }, tokens(cost.cache_write_tokens)),
        el("td", { class: "num" },
          el("div", {}, tokens(output)),
          measured && entry.reasoning_tokens ? el("div", { class: "muted small" }, "推理 " + exactTokens(entry.reasoning_tokens)) : null,
        ),
        el("td", { class: "num" },
          el("div", {},
            measured
              ? el("span", {
                  class: "cost-value",
                  tabindex: "0",
                  "aria-label": "查看计价详情",
                  onmouseenter: (event) => showCostTooltip(event.currentTarget, cost, entry.reasoning_tokens),
                  onmouseleave: hideCostTooltip,
                  onfocus: (event) => showCostTooltip(event.currentTarget, cost, entry.reasoning_tokens),
                  onblur: hideCostTooltip,
                }, usd(cost.total_usd))
              : usd(cost.total_usd),
          ),
          cost.tiered
            ? el("div", { class: "muted small" }, cost.long_context ? "长上下文" : "标准")
            : null,
        ),
      );
    });

  const content = [table(
    ["时间", "API Key", "模型", "执行器 / 来源", "推理 / 速度", "状态", { label: "TPS / 延迟", num: true },
      { label: "输入", num: true }, { label: "缓存读取", num: true },
      { label: "缓存写入", num: true }, { label: "输出", num: true }, { label: "费用", num: true }],
    rows)];
  if (logLoadingMore) {
    content.push(el("div", { class: "log-load-state", role: "status", text: "正在加载更多…" }));
  } else if (!logAutoLoadMore && logHasMore) {
    content.push(el("div", { class: "log-load-state" },
      el("button", { onclick: () => guard(() => loadLogs(true)) }, "重试加载")));
  }
  replaceContent(scroller, ...content);
  scroller.scrollTop = previousScrollTop;
  scroller.scrollLeft = previousScrollLeft;
  requestAnimationFrame(() => maybeLoadMoreLogs(false));
}

const eventLevels = {
  error: { label: "错误", class: "tag bad" },
  info: { label: "信息", class: "tag info" },
};

function matchesEventLevel(event, level) {
  return !level || event.level === level;
}

function labelEventLevels(events) {
  for (const option of $("event-level").options) {
    const label = option.value ? eventLevels[option.value].label : "全部级别";
    const count = events.filter((event) => matchesEventLevel(event, option.value)).length;
    option.textContent = label + "（" + int(count) + "）";
  }
}

function eventField(label, value) {
  if (!value) return null;
  return el("div", { class: "event-field" },
    el("span", { class: "event-field-label", text: label }),
    el("span", { class: "event-field-value mono", text: value }));
}

function renderEvents() {
  const events = state.events;
  if (!events) {
    $("events-body").replaceChildren(el("div", { class: "empty", text: "加载中…" }));
    return;
  }
  const filter = $("event-filter").value.trim().toLowerCase();
  const searched = events.filter((event) => {
    if (!filter) return true;
    const failure = event.request_failure || {};
    return [event.message, failure.api_key, failure.model, failure.upstream,
      failure.status_code ? "HTTP " + failure.status_code : "", failure.error_type, failure.body]
      .filter(Boolean).join(" ").toLowerCase().includes(filter);
  });
  // The counts ignore the level choice itself, so each option says how many
  // entries picking it would show.
  labelEventLevels(searched);
  const matched = searched.filter((event) => matchesEventLevel(event, $("event-level").value));
  const entries = matched
    .map((event) => {
      const level = eventLevels[event.level] || eventLevels.info;
      const failure = event.request_failure;
      if (failure) {
        const tags = [];
        if (failure.status_code) tags.push(el("span", { class: "tag bad", text: "HTTP " + failure.status_code }));
        if (failure.error_type) tags.push(el("span", { class: "tag bad", text: failure.error_type }));
        if (!tags.length) tags.push(el("span", { class: level.class, text: level.label }));
        return el("article", { class: "event-entry request-failure", role: "listitem" },
          el("div", { class: "event-entry-head" },
            el("time", { class: "event-time", datetime: event.at || null }, when(event.at)),
            el("div", { class: "event-request-meta" },
              eventField("上游", failure.upstream),
              eventField("API Key", failure.api_key),
              eventField("模型", failure.model)),
            el("div", { class: "event-entry-tags" }, tags)),
          el("pre", { class: "event-error-body mono", text: failure.body || "宿主未提供错误内容。" }),
        );
      }
      return el("article", { class: "event-entry", role: "listitem" },
        el("div", { class: "event-entry-head" },
          el("time", { class: "event-time", datetime: event.at || null }, when(event.at)),
          el("span", { class: level.class, text: level.label })),
        el("div", { class: "event-message" }, event.message || ""),
      );
    });
  replaceContent($("events-body"), entries.length
    ? el("div", { class: "event-list", role: "list", "aria-label": "插件日志列表" }, entries)
    : el("div", { class: "empty", text: events.length ? "没有匹配的日志" : "暂无插件日志" }));
}

function syncPlanFields() {
  const kind = $("plan-kind").value;
  $("plan-seconds-field").classList.toggle("hidden", kind !== "custom");
}
function renderPlanKeyPicker(planID) {
  const picker = $("plan-key-picker");
  if (!state.keys.length) {
    picker.replaceChildren(el("div", { class: "empty", text: "暂无 API Key" }));
    return;
  }
  picker.replaceChildren(...state.keys.map((key) => {
    const ownedByOther = !!key.plan_id && key.plan_id !== planID;
    const owner = ownedByOther ? state.plans.find((plan) => plan.id === key.plan_id) : null;
    return el("label", { class: ownedByOther ? "disabled" : "" },
    el("input", { type: "checkbox", value: key.scope, checked: key.plan_id === planID && !!planID,
      disabled: ownedByOther || undefined }),
    el("span", {}, keyName(key)),
    key.preview && key.preview !== keyName(key) ? el("span", { class: "muted small mono" }, key.preview) : null,
    owner ? el("span", { class: "muted small", text: "已绑定「" + (owner.name || owner.id) + "」" }) : null,
  );
  }));
}

function selectedPlanScopes() {
  return Array.from($("plan-key-picker").querySelectorAll('input[type="checkbox"]:checked')).map((input) => input.value);
}

function resetPlanForm() {
  $("plan-form-title").textContent = "新建订阅计划";
  $("plan-id").value = ""; $("plan-name").value = ""; $("plan-amount").value = "";
  $("plan-kind").value = "daily";
  $("plan-seconds").value = "3600";
  $("plan-cancel").classList.add("hidden");
  syncPlanFields();
  renderPlanKeyPicker("");
}
function editPlan(plan) {
  $("plan-form-title").textContent = "编辑订阅计划：" + (plan.name || plan.id);
  $("plan-id").value = plan.id;
  $("plan-name").value = plan.name || "";
  $("plan-amount").value = plan.amount_usd ?? 0;
  $("plan-kind").value = plan.period?.kind || "daily";
  $("plan-seconds").value = String(plan.period?.seconds || 3600);
  $("plan-cancel").classList.remove("hidden");
  syncPlanFields();
  renderPlanKeyPicker(plan.id);
  $("plan-name").scrollIntoView({ block: "center", behavior: "smooth" });
}
function planFromForm() {
  const kind = $("plan-kind").value;
  const period = { kind };
  if (kind === "custom") period.seconds = Number($("plan-seconds").value);
  const amount = Number($("plan-amount").value);
  if (!Number.isFinite(amount) || amount <= 0) throw new Error("额度必须大于 0");
  return {
    name: $("plan-name").value.trim(),
    amount_usd: amount,
    period,
    scopes: selectedPlanScopes(),
  };
}

let editingModel = "";
let priceReferenceTimer = 0;
let priceReferenceRequest = 0;

function optionalNumber(id) {
  const raw = $(id).value.trim();
  return raw === "" ? null : Number(raw);
}

function fillPriceFields(row) {
  $("price-in").value = row.input_per_1m ?? 0;
  $("price-out").value = row.output_per_1m ?? 0;
  $("price-cr").value = row.cache_read_per_1m ?? "";
  $("price-cw").value = row.cache_write_per_1m ?? "";
  const tier = row.long_context;
  $("price-tiered").checked = !!tier;
  $("price-tier-threshold").value = tier?.threshold_input_tokens ?? 272000;
  $("price-tier-in").value = tier?.input_per_1m ?? 0;
  $("price-tier-out").value = tier?.output_per_1m ?? 0;
  $("price-tier-cr").value = tier?.cache_read_per_1m ?? "";
  $("price-tier-cw").value = tier?.cache_write_per_1m ?? "";
  syncPriceTierFields();
}

function referencePriceText(row) {
  const prices = ["输入 " + usd(row.input_per_1m), "输出 " + usd(row.output_per_1m)];
  if (row.cache_read_per_1m !== null && row.cache_read_per_1m !== undefined) {
    prices.push("缓存读 " + usd(row.cache_read_per_1m));
  }
  if (row.cache_write_per_1m !== null && row.cache_write_per_1m !== undefined) {
    prices.push("缓存写 " + usd(row.cache_write_per_1m));
  }
  if (row.long_context) {
    prices.push(">" + tokenThreshold(row.long_context.threshold_input_tokens) + " 阶梯：输入 " + usd(row.long_context.input_per_1m) +
      " · 输出 " + usd(row.long_context.output_per_1m));
  }
  return prices.join(" · ");
}

function syncPriceTierFields() {
  $("price-tier-fields").classList.toggle("hidden", !$("price-tiered").checked);
}

function renderPriceReferences(models) {
  const results = $("price-reference-results");
  if (!models.length) {
    results.replaceChildren(el("div", { class: "price-reference-empty", text: "未找到参考价" }));
    return;
  }
  results.replaceChildren(...models.map((row) => el("button", {
    class: "price-reference-option",
    type: "button",
    onclick: (event) => {
      fillPriceFields(row);
      for (const option of results.querySelectorAll(".price-reference-option")) option.classList.remove("selected");
      event.currentTarget.classList.add("selected");
    },
  },
  el("span", { class: "mono price-reference-name", text: row.pattern }),
  el("span", { class: "price-reference-prices", text: referencePriceText(row) }))));
  results.scrollTop = 0;
}

async function searchPriceReferences() {
  const query = $("price-reference-search").value.trim();
  const request = ++priceReferenceRequest;
  if (!query) {
    $("price-reference-results").replaceChildren(
      el("div", { class: "price-reference-empty", text: "输入模型名称" }));
    return;
  }
  $("price-reference-results").replaceChildren(
    el("div", { class: "price-reference-empty", text: "正在搜索…" }));
  try {
    const result = await plugin("GET", "/prices/catalog?q=" + encodeURIComponent(query) + "&limit=20");
    if (request === priceReferenceRequest) renderPriceReferences(result.models || []);
  } catch (err) {
    if (request === priceReferenceRequest) {
      if (err instanceof AuthError) {
        $("price-dlg").close();
        fail(err);
        return;
      }
      $("price-reference-results").replaceChildren(
        el("div", { class: "price-reference-empty", text: "搜索失败：" + (err.message || err) }));
    }
  }
}

function editPrice(row) {
  editingModel = row.pattern;
  $("price-model").textContent = row.pattern;
  fillPriceFields(row);
  $("price-reference-search").value = row.pattern;
  $("price-dlg").showModal();
  $("price-reference-search").focus();
  searchPriceReferences();
}

// /v1/models requires a downstream API Key, so the browser borrows one only
// for this same-origin request. The plugin never stores it.
async function autoSyncModels(apiKeys) {
  const key = (apiKeys || []).map((value) => (value || "").trim()).find(Boolean);
  if (!key) return "";
  try {
    const resp = await fetch(location.origin + "/v1/models", { headers: { "Authorization": "Bearer " + key } });
    if (!resp.ok) {
      throw new Error("HTTP " + resp.status);
    }
    const payload = await resp.json();
    const models = modelIDs(payload);
    if (!models.length) {
      return "";
    }
    const result = await plugin("POST", "/prices/sync", { models });
    if (result.added || result.removed) {
      return "模型同步完成：新增 " + result.added + " 个（" + result.priced + " 个有参考价），移除 " + result.removed + " 个";
    }
    return "";
  } catch (err) {
    if (err instanceof AuthError) throw err;
    notify("同步模型失败：" + (err.message || err), "err");
    return "";
  }
}

async function autoSyncKeys() {
  const summaries = [];
  let keys = [];
  try {
    const list = await api("GET", "/v0/management/api-keys", null, { raw: true });
    keys = (list && list["api-keys"]) || [];
    const result = await plugin("POST", "/keys/sync", { keys, allow_empty: true });
    if (result.added || result.removed) {
      summaries.push("API Key 同步完成：新增 " + result.added + " 个，移除 " + result.removed + " 个");
    } else if (!keys.length) {
      summaries.push("CLIProxyAPI 尚未配置 API Key");
    }
  } catch (err) {
    if (err instanceof AuthError) throw err;
    notify("同步 API Key 失败：" + (err.message || err), "err");
  }
  const models = await autoSyncModels(keys);
  if (models) summaries.push(models);
  return summaries.join("；");
}

async function submitLogin() {
  const role = loginMode;
  let key = $("gate-key").value.trim();
  if (!key) key = await recalledCredential(role);
  if (!key) {
    $("gate-error").textContent = role === "account" ? "请输入 API Key" : "请输入管理密钥";
    $("gate-error").className = "notice err show";
    return;
  }
  $("gate-submit").disabled = true;
  try {
    if (role === "account") await startAccount(key);
    else await startAdmin(key);
    if ($("gate-remember").checked) {
      try {
        await rememberCredential(role, key);
      } catch (err) {
        const message = "已登录，但无法在此浏览器中记住凭据：" + (err.message || err);
        notify(message, "err");
      }
    } else {
      await deleteCredential(role);
    }
    $("gate-key").value = "";
  } catch (err) {
    if (err instanceof AuthError) await deleteCredential(role);
    showGate(role, err instanceof AuthError ? err.message : ("连接失败：" + (err.message || err)));
  } finally {
    $("gate-submit").disabled = false;
  }
}

$("gate-form").onsubmit = (event) => { event.preventDefault(); submitLogin(); };
$("gate-mode-admin").onclick = () => setLoginMode("admin");
$("gate-mode-account").onclick = () => setLoginMode("account");

function actionIcon(name) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  const paths = {
    refresh: ["M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8", "M21 3v5h-5"],
    sun: ["M12 2v2", "M12 20v2", "M4.93 4.93l1.41 1.41", "M17.66 17.66l1.41 1.41", "M2 12h2", "M20 12h2", "M6.34 17.66l-1.41 1.41", "M19.07 4.93l-1.41 1.41", "M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0"],
    moon: ["M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"],
    logout: ["M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4", "M16 17l5-5-5-5", "M21 12H9"],
  };
  for (const value of paths[name] || []) {
    const path = document.createElementNS(svg.namespaceURI, "path");
    path.setAttribute("d", value);
    svg.append(path);
  }
  return svg;
}

function setActionIcon(button, name, label) {
  button.replaceChildren(actionIcon(name));
  button.setAttribute("aria-label", label);
  button.title = label;
}

function updateThemeButtons() {
  const dark = window.billingTheme?.current() === "dark";
  document.querySelectorAll('[data-page-action="theme"]').forEach((button) => {
    setActionIcon(button, dark ? "sun" : "moon", dark ? "切换到浅色主题" : "切换到深色主题");
  });
}

for (const button of document.querySelectorAll('[data-page-action="refresh"]')) {
  setActionIcon(button, "refresh", "刷新");
  button.onclick = () => refreshCurrentView(false);
}
for (const button of document.querySelectorAll('[data-page-action="logout"]')) {
  setActionIcon(button, "logout", "退出登录");
}
document.querySelectorAll('[data-page-action="theme"]').forEach((button) => {
  button.onclick = () => { window.billingTheme?.toggle(); updateThemeButtons(); };
});
document.querySelectorAll('[data-page-action="logout"]').forEach((button) => {
  button.onclick = () => guard(async () => {
    const role = currentRole || loginMode;
    await deleteCredential(role);
    accountState = { overview: null, prices: null, logs: null, models: [] };
    showGate(role, "");
  });
});
window.addEventListener("billing-theme-change", updateThemeButtons);

const AUTO_REFRESH_MS = 10000;
let autoRefreshTimer = 0;
let refreshPromise = null;

function stopAutoRefresh() {
  clearTimeout(autoRefreshTimer);
  autoRefreshTimer = 0;
}

function scheduleAutoRefresh() {
  stopAutoRefresh();
  if (!currentRole || document.hidden) return;
  autoRefreshTimer = setTimeout(() => {
    autoRefreshTimer = 0;
    refreshCurrentView(true);
  }, AUTO_REFRESH_MS);
}

function refreshCurrentView(automatic) {
  if (!currentRole || (automatic && document.hidden)) return Promise.resolve();
  if (refreshPromise) return refreshPromise;
  stopAutoRefresh();
  if (!automatic) {
    document.querySelectorAll('[data-page-action="refresh"]').forEach((button) => { button.disabled = true; });
  }
  refreshPromise = (async () => {
    try {
      if (currentRole === "account") await reloadAccount();
      else await reloadAll();
    } catch (err) {
      if (err instanceof AuthError) {
        await deleteCredential(currentRole);
        showGate(currentRole, err.message);
        return;
      }
      const message = (automatic ? "自动刷新失败：" : "刷新失败：") + (err.message || err);
      notify(message, "err");
    } finally {
      refreshPromise = null;
      if (!automatic) {
        document.querySelectorAll('[data-page-action="refresh"]').forEach((button) => { button.disabled = false; });
      }
      scheduleAutoRefresh();
    }
  })();
  return refreshPromise;
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopAutoRefresh();
  else if (currentRole) refreshCurrentView(true);
});
document.querySelectorAll("[data-account-tab]").forEach((button) => {
  button.onclick = () => setAccountTab(button.dataset.accountTab);
});
$("account-price-filter").addEventListener("input", () =>
  renderPriceTable("account-prices-body", accountState.prices, $("account-price-filter").value, false));
$("account-logs").addEventListener("scroll", () => {
  hideCostTooltip();

}, { passive: true });

const TABS = Array.from(document.querySelectorAll(".tabs button[data-tab]"));
for (const tab of TABS) {
  tab.onclick = () => {
    for (const other of TABS) other.classList.toggle("active", other === tab);
    for (const other of TABS) $("tab-" + other.dataset.tab).classList.toggle("hidden", other !== tab);
    guard(reloadAll);
  };
}

$("key-filter").addEventListener("input", renderKeys);
$("plan-kind").addEventListener("change", syncPlanFields);
$("plan-cancel").onclick = resetPlanForm;
$("plan-save").onclick = () => guard(async () => {
  const plan = planFromForm();
  const id = $("plan-id").value;
  if (id) await plugin("PATCH", "/plans", { id, ...plan });
  else await plugin("POST", "/plans", plan);
  notify(id ? "订阅计划已保存" : "订阅计划已创建");

  await reloadAll();
});

$("model-picker-search").addEventListener("input", renderModelPicker);
$("model-picker-cancel").onclick = closeModelPicker;
$("model-picker-save").onclick = () => {
  saveModelPicker();
  closeModelPicker();
};
// The popover is anchored to a cell rather than owned by it, so it follows the
// page and closes on anything that is not itself.
addEventListener("scroll", positionModelPicker, { passive: true, capture: true });
addEventListener("resize", positionModelPicker);
addEventListener("pointerdown", (event) => {
  if (!modelPicker.scope) return;
  if ($("model-picker").contains(event.target) || (modelPicker.anchor && modelPicker.anchor.contains(event.target))) return;
  closeModelPicker();
}, true);
addEventListener("keydown", (event) => {
  if (event.key === "Escape" && modelPicker.scope) closeModelPicker();
});

$("group-model-search").addEventListener("input", renderGroupModelPicker);
$("group-model-all").onclick = () => {
  for (const model of catalogModels()) groupModels.add(model);
  renderGroupModelPicker();
};
$("group-model-none").onclick = () => {
  groupModels = new Set();
  renderGroupModelPicker();
};
$("group-cancel").onclick = resetGroupForm;
$("group-save").onclick = () => guard(async () => {
  const name = $("group-name").value.trim();
  if (!name) throw new Error("分组名称不能为空");
  const id = $("group-id").value;
  const models = [...groupModels];
  if (id) await plugin("PATCH", "/model-groups", { id, name, models });
  else await plugin("POST", "/model-groups", { name, models });
  notify(id ? "模型分组已保存" : "模型分组已创建");
  resetGroupForm();
  await reloadAll();
});

$("event-filter").addEventListener("input", renderEvents);
$("event-level").addEventListener("change", renderEvents);
$("events-clear").onclick = () => guard(async () => {
  if (!await confirmAction("清空全部插件日志？", "该操作只清除插件自身的运行记录，不影响计费数据，且无法恢复。")) return;
  const result = await plugin("DELETE", "/events");
  notify("已清空 " + result.cleared + " 条插件日志");
  await reloadAll();
});
for (const account of [false, true]) {
  const role = account ? "account" : "admin";
  for (const id of LOG_FILTER_IDS[role]) {
    $(id).addEventListener("change", () => guard(() => loadLogs(false, account)));
  }
  const clear = $(account ? "account-logs-filter-clear" : "logs-filter-clear");
  clear.onclick = () => {
    for (const id of LOG_FILTER_IDS[role]) $(id).value = "";
    updateLogFilterControls(account);
    guard(() => loadLogs(false, account));
  };
  $(account ? "account-logs-export" : "logs-export").onclick = () => guard(() => exportLogs(account));
  bindLogTimeControls(account);
}
addEventListener("pointerdown", (event) => {
  for (const account of [false, true]) {
    const popover = $(logTimeID(account, "popover"));
    if (!popover.classList.contains("hidden") && !popover.contains(event.target) &&
      !$(logTimeID(account, "trigger")).contains(event.target)) closeLogTimePopover(account);
  }
}, true);
addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    closeLogTimePopover(false);
    closeLogTimePopover(true);
  }
});
$("logs-body").addEventListener("scroll", () => {
  hideCostTooltip();
  maybeLoadMoreLogs(false);
}, { passive: true });
$("keys-reset-all").onclick = () => guard(async () => {
  if (!await confirmAction("重置所有周期性额度？",
    "绑定周期性计划的 API Key 会结束当前周期，下一次请求开启新周期；不重置的计划和累计用量不受影响。")) return;
  const result = await plugin("POST", "/keys/reset-all");
  notify(result.reset ? "已重置 " + result.reset + " 个 API Key 的额度" : "没有需要重置的额度");
  await reloadAll();
});
$("logs-clear").onclick = () => guard(async () => {
  if (!await confirmAction("清空全部计费日志？", "该操作不会修改累计用量、费用或订阅额度，且无法恢复。")) return;
  const result = await plugin("DELETE", "/logs");
  notify("已清空 " + result.cleared + " 条计费日志");
  await reloadAll();
});

$("price-filter").addEventListener("input", () =>
  renderPriceTable("prices-body", state.prices, $("price-filter").value, true));
$("price-reference-search").addEventListener("input", () => {
  clearTimeout(priceReferenceTimer);
  priceReferenceTimer = setTimeout(() => {
    priceReferenceTimer = 0;
    searchPriceReferences();
  }, 180);
});
$("price-tiered").addEventListener("change", syncPriceTierFields);
$("price-dlg").addEventListener("close", () => {
  clearTimeout(priceReferenceTimer);
  priceReferenceTimer = 0;
  priceReferenceRequest++;
});
$("price-cancel").onclick = () => $("price-dlg").close();
$("price-save").onclick = () => guard(async () => {
  if (!editingModel) return;
  const rule = {
    pattern: editingModel,
    input_per_1m: Number($("price-in").value || 0),
    output_per_1m: Number($("price-out").value || 0),
    cache_read_per_1m: optionalNumber("price-cr"),
    cache_write_per_1m: optionalNumber("price-cw"),
  };
  if ($("price-tiered").checked) {
    const threshold = Number($("price-tier-threshold").value);
    if (!Number.isInteger(threshold) || threshold <= 0) throw new Error("长上下文阈值必须是大于 0 的整数");
    rule.long_context = {
      threshold_input_tokens: threshold,
      input_per_1m: Number($("price-tier-in").value || 0),
      output_per_1m: Number($("price-tier-out").value || 0),
      cache_read_per_1m: optionalNumber("price-tier-cr"),
      cache_write_per_1m: optionalNumber("price-tier-cw"),
    };
  }
  await plugin("PUT", "/prices", rule);
  $("price-dlg").close();
  notify("已保存 " + editingModel + " 的定价");
  await reloadAll();
});
$("price-reset").onclick = () => guard(async () => {
  if (!await confirmAction("恢复全部参考价？", "自定义定价将被覆盖；没有参考价的模型将恢复为 0 USD。")) return;
  const result = await plugin("POST", "/prices/reset");
  notify("已恢复 " + result.restored + " 个模型的参考价");
  await reloadAll();
});
$("price-catalog-refresh").onclick = () => guard(async () => {
  const button = $("price-catalog-refresh");
  button.disabled = true;
  try {
    const result = await plugin("POST", "/prices/catalog/refresh");
    notify("参考价目录已更新，共 " + int(result.catalog?.models) + " 个模型；同步更新 " + int(result.updated_models) + " 个当前价格");
    await reloadAll();
  } finally {
    button.disabled = false;
  }
});

resetPlanForm();
resetGroupForm();

(async function () {
  const panelKey = readPanelKey();
  updateThemeButtons();
  try {
    if (embedded && panelKey) {
      await startAdmin(panelKey);
      return;
    }
    const saved = await recalledCredential(loginMode);
    if (!saved) {
      showGate(loginMode, "");
      return;
    }
    $("gate-remember").checked = true;
    if (loginMode === "account") await startAccount(saved);
    else await startAdmin(saved);
  } catch (err) {
    await deleteCredential(loginMode);
    showGate(loginMode, err instanceof AuthError ? err.message : ("连接失败：" + (err.message || err)));
  }
})();
