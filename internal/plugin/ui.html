<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Key 计费</title>
<style>
/* Keep the embedded page aligned with the management panel's three themes. */
:root{
  --bg-secondary:#faf9f5; --bg-primary:#f0eee8; --bg-tertiary:#e9e6df; --bg-hover:var(--bg-tertiary);
  --floating-surface:#fffdf9; --floating-shadow:0 12px 26px #00000024;
  --text-primary:#2d2a26; --text-secondary:#6d6760; --text-tertiary:#a29c95;
  --border-color:#e3e1db; --border-primary:#d5d2cb; --border-hover:#cecac4;
  --primary-color:#8b8680; --primary-hover:#7f7a74; --primary-active:#726d67; --primary-contrast:#fff;
  --error-color:#c65746;
  --success-badge-bg:#d1fae5; --success-badge-text:#065f46; --success-badge-border:#6ee7b7;
  --failure-badge-bg:#c6574624; --failure-badge-text:#8a3a30; --failure-badge-border:#c6574659;
  --count-badge-bg:#8b86802e; --count-badge-text:var(--primary-active);
  --amber-color:#d97706; --amber-text:#92400e;
  --amber-10:color-mix(in srgb, var(--amber-color) 10%, transparent);
  --amber-30:color-mix(in srgb, var(--amber-color) 30%, transparent);
  --primary-10:color-mix(in srgb, var(--primary-color) 10%, transparent);
  --shadow:0 1px 2px 0 #00000014;
  --radius-md:8px;
}
[data-theme=white]{
  --bg-secondary:#fff; --bg-primary:#fff; --bg-tertiary:#f6f6f6;
  --floating-surface:#fff; --floating-shadow:0 12px 26px #0000001f;
  --border-color:#e5e5e5; --border-primary:#d9d9d9; --border-hover:#ccc;
}
[data-theme=dark]{
  --bg-secondary:#151412; --bg-primary:#1d1b18; --bg-tertiary:#262320; --bg-hover:#2e2a26;
  --floating-surface:#2a2723; --floating-shadow:0 14px 30px #0006;
  --text-primary:#f6f4f1; --text-secondary:#c9c3bb; --text-tertiary:#9c958d;
  --border-color:#3a3530; --border-primary:#4a453f; --border-hover:#5a544d;
  --primary-hover:#9a948e; --primary-active:#a6a099;
  --success-badge-bg:#064e3b4d; --success-badge-text:#6ee7b7; --success-badge-border:#059669;
  --failure-badge-bg:#c657463d; --failure-badge-text:#f1b0a6; --failure-badge-border:#c6574680;
  --count-badge-bg:#8b868047;
  --amber-color:#f59e0b; --amber-text:#fcd34d;
  --amber-10:color-mix(in srgb, var(--amber-color) 14%, transparent);
  --amber-30:color-mix(in srgb, var(--amber-color) 38%, transparent);
  --shadow:0 1px 3px 0 #0000004d;
}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg-secondary);color:var(--text-primary);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Fira Sans","Droid Sans","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background-color .3s,color .3s}
a{color:var(--primary-active)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px}
h1{font-size:18px;margin:0}
h2{font-size:15px;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1}
.muted{color:var(--text-tertiary)}
.small{font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
.card{background:var(--bg-primary);border:1px solid var(--border-color);border-radius:var(--radius-md);
  box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
button{font:inherit;border:1px solid var(--border-primary);background:var(--bg-primary);color:var(--text-primary);
  border-radius:var(--radius-md);padding:6px 12px;cursor:pointer;transition:background-color .15s,border-color .15s,color .15s}
button:hover:not(:disabled){border-color:var(--border-hover);background:var(--bg-hover)}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--primary-color);border-color:var(--primary-color);color:var(--primary-contrast)}
button.primary:hover:not(:disabled){background:var(--primary-hover);border-color:var(--primary-hover);color:var(--primary-contrast)}
button.danger{color:var(--error-color)}
button.danger:hover:not(:disabled){border-color:var(--error-color)}
button.link{border:none;background:none;padding:2px 4px;color:var(--primary-active)}
button.link:hover:not(:disabled){background:none;color:var(--text-primary);text-decoration:underline}
button.link.danger:hover:not(:disabled){color:var(--error-color)}
input,select,textarea{font:inherit;color:var(--text-primary);background:var(--bg-secondary);
  border:1px solid var(--border-primary);border-radius:var(--radius-md);padding:6px 9px}
input:focus,select:focus{border-color:var(--primary-color);box-shadow:0 0 0 3px var(--primary-10);outline:none}
input[type=number]{width:110px}
label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-secondary)}
.table-scroll{width:100%;max-width:100%;overflow-x:auto;overscroll-behavior-inline:contain;
  -webkit-overflow-scrolling:touch}
table{width:max-content;min-width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border-color);vertical-align:middle}
th{font-size:12px;color:var(--text-secondary);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--bg-hover)}
/* The management panel floats its own action bar (refresh, language, theme,
   sign out) over the top-right corner of this iframe, so that corner holds
   nothing: the header stays left-aligned and tall enough that the content below
   it clears the overlay. */
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:52px;padding-right:200px;margin-bottom:16px}
@media (max-width:640px){.head{padding-right:0;min-height:0;margin-bottom:12px}}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--border-color)}
.tabs button[data-tab]{border:none;border-bottom:2px solid transparent;border-radius:0;padding:8px 14px;
  background:none;color:var(--text-secondary)}
.tabs button[data-tab]:hover{background:none;color:var(--text-primary)}
.tabs button[data-tab].active{color:var(--text-primary);border-bottom-color:var(--primary-color)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;white-space:nowrap;border:1px solid transparent}
.tag.ok{background:var(--success-badge-bg);color:var(--success-badge-text);border-color:var(--success-badge-border)}
.tag.warn{background:var(--amber-10);color:var(--amber-text);border-color:var(--amber-30)}
.tag.bad{background:var(--failure-badge-bg);color:var(--failure-badge-text);border-color:var(--failure-badge-border)}
.tag.plain{background:var(--count-badge-bg);color:var(--count-badge-text)}
.usage{display:flex;flex-direction:column;gap:5px;min-width:150px;max-width:210px}
.usage>span{font-size:12px;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--bg-tertiary);overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--primary-color)}
.bar.full>i{background:var(--error-color)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--bg-primary);border:1px solid var(--border-color);border-radius:var(--radius-md);
  box-shadow:var(--shadow);padding:12px 14px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.notice{padding:10px 14px;border-radius:var(--radius-md);margin-bottom:14px;display:none;border:1px solid transparent}
.notice.show{display:block}
.notice.err{background:var(--failure-badge-bg);color:var(--failure-badge-text);border-color:var(--failure-badge-border)}
.notice.ok{background:var(--success-badge-bg);color:var(--success-badge-text);border-color:var(--success-badge-border)}
.hidden{display:none!important}
.gate{max-width:460px;margin:12vh auto}
.empty{padding:26px;text-align:center;color:var(--text-tertiary)}
dialog{border:1px solid var(--border-color);border-radius:12px;background:var(--floating-surface);
  color:var(--text-primary);box-shadow:var(--floating-shadow);padding:18px;
  width:min(420px,calc(100vw - 32px));min-width:0;max-width:90vw}
dialog::backdrop{background:rgba(0,0,0,.4)}
.price-dialog{width:min(620px,calc(100vw - 32px));min-width:0;padding:22px}
.price-dialog-model{margin:0 0 16px;font-size:14px;overflow-wrap:anywhere}
.price-reference{margin-bottom:18px}
.price-reference input{width:100%}
.price-reference-results{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto;margin-top:8px}
.price-reference-option{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;
  width:100%;padding:7px 9px;text-align:left;background:var(--bg-secondary);font-size:12px;line-height:1.35}
.price-reference-option.selected{border-color:var(--success-badge-border);background:var(--success-badge-bg)}
.price-reference-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.price-reference-prices{color:var(--text-secondary);font-size:10px;font-variant-numeric:tabular-nums;
  text-align:right;white-space:normal}
.price-reference-empty{padding:9px 2px;color:var(--text-tertiary);font-size:12px}
.price-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.price-fields .field{min-width:0}
.price-fields input[type=number]{width:100%}
.price-dialog-actions{justify-content:flex-end;margin-top:20px}
.switch-field{display:flex;align-items:center;gap:8px;color:var(--text-primary);font-size:13px;margin-top:16px}
.switch-field input{width:auto}
.tier-fields{margin-top:14px;padding-top:14px;border-top:1px solid var(--border-color)}
.tier-price{display:flex;flex-direction:column;gap:2px;white-space:nowrap}
.key-picker{width:100%;max-height:210px;overflow:auto;border:1px solid var(--border-color);border-radius:var(--radius-md);padding:6px;background:var(--bg-secondary)}
.key-picker label{display:flex;align-items:center;gap:8px;padding:6px;border-radius:6px;cursor:pointer}
.key-picker label span{min-width:0;overflow-wrap:anywhere}
.key-picker label:hover{background:var(--bg-hover)}
.key-picker input{width:auto}
.key-picker label.disabled{cursor:not-allowed;opacity:.55}
.key-picker label.disabled:hover{background:transparent}
.key-pill-list{display:flex;align-items:center;flex-wrap:wrap;gap:5px;min-width:180px;max-width:520px}
.key-pill{display:inline-block;padding:2px 8px;border:1px solid transparent;border-radius:999px;
  max-width:100%;background:var(--count-badge-bg);color:var(--count-badge-text);font-size:12px;
  white-space:normal;overflow-wrap:anywhere}
.wide-search{width:360px;max-width:100%}
.card-actions{min-width:0}
.log-card{height:calc(100dvh - 245px);min-height:360px;border-radius:12px;display:flex;flex-direction:column;margin-bottom:0}
.log-table-region{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.log-table-region .table-scroll{overflow:visible}
.log-table-region thead th{position:sticky;top:0;z-index:2;background:var(--bg-primary);box-shadow:0 1px 0 var(--border-color)}
.log-cell-line{display:flex;align-items:center;gap:4px;min-height:20px;white-space:nowrap}
.cost-value{display:inline-block;cursor:help;text-decoration:underline dotted var(--text-tertiary);text-underline-offset:3px}
.cost-tooltip{position:fixed;z-index:1000;width:min(430px,calc(100vw - 24px));padding:12px 14px;border:1px solid var(--border-color);
  border-radius:10px;background:var(--floating-surface);color:var(--text-primary);box-shadow:var(--floating-shadow);
  pointer-events:none;opacity:0;visibility:hidden;transition:opacity .05s linear;font-size:12px;text-align:left}
.cost-tooltip.show{opacity:1;visibility:visible}
.cost-tooltip-title{font-size:13px;font-weight:600;margin-bottom:8px}
.cost-tooltip-summary{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin-bottom:9px;color:var(--text-secondary)}
.cost-tooltip-summary b{color:var(--text-primary);font-weight:500;text-align:right}
.cost-tooltip-grid{display:grid;grid-template-columns:minmax(90px,1fr) auto auto;gap:5px 14px;align-items:center;font-variant-numeric:tabular-nums}
.cost-tooltip-head{color:var(--text-tertiary);font-size:11px;border-bottom:1px solid var(--border-color)}
.cost-tooltip-grid .num{text-align:right;white-space:nowrap}
.cost-tooltip-total{display:flex;justify-content:space-between;gap:16px;margin-top:9px;padding-top:8px;border-top:1px solid var(--border-color);font-weight:600}
.log-pagination{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-height:45px;padding-top:10px;margin-top:10px;border-top:1px solid var(--border-color)}
.log-pagination select{width:auto;min-width:72px;padding:5px 8px}
.log-pagination button{padding:5px 10px}
.log-page-number{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
@media (max-width:640px){
  .wrap{padding:14px 12px 40px}
  .section-toolbar{align-items:flex-start}
  .section-toolbar>.card-actions{flex:1 1 100%;width:100%}
  .card-actions .wide-search,#price-filter{flex:1 0 100%;width:100%!important;max-width:none!important;min-width:0}
  .card-actions #log-note{flex:1 0 100%}
  .log-card{height:calc(100dvh - 215px);min-height:320px}
  .log-pagination{justify-content:center;flex-wrap:wrap}
}
@media (max-width:520px){
  dialog{width:calc(100vw - 24px);max-width:none;padding:16px}
  .price-dialog{padding:18px}
  .price-fields{grid-template-columns:1fr}
  .price-reference-option{grid-template-columns:1fr;gap:2px}
  .price-reference-prices{text-align:left}
}
@media (max-width:360px){
  .log-pagination{display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
  .log-pagination>.muted{grid-column:1;grid-row:1;justify-self:end}
  .log-pagination>select{grid-column:2;grid-row:1}
  #log-prev{grid-column:1;grid-row:2;justify-self:end}
  #log-page-number{grid-column:2;grid-row:2}
  #log-next{grid-column:3;grid-row:2;justify-self:start}
  .cost-tooltip{width:calc(100vw - 16px);padding:10px;font-size:11px}
  .cost-tooltip-summary{gap:3px 8px}
  .cost-tooltip-grid{grid-template-columns:minmax(62px,1fr) auto auto;gap:4px 6px;font-size:11px}
}
</style>
<script>
"use strict";
/* Mirror the panel's live theme. A cross-origin parent cannot be read, so the
 * fallback uses its persisted preference or the operating system. This runs
 * before the body to avoid painting in the wrong theme. */
(function () {
  const STORE_KEY = "cli-proxy-theme";
  const PREFIX = "enc::v1::";
  const SALT = "cli-proxy-api-webui::secure-storage";

  function parentDocument() {
    if (window.parent === window) return null;
    try { return window.parent.document; } catch (_) { return null; }
  }

  function storedTheme() {
    let raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (_) { return ""; }
    if (!raw) return "";
    try {
      if (raw.startsWith(PREFIX)) {
        const secret = new TextEncoder().encode(SALT + "|" + location.host + "|" + navigator.userAgent);
        const binary = atob(raw.slice(PREFIX.length));
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i) ^ secret[i % secret.length];
        raw = new TextDecoder().decode(bytes);
      }
      const theme = JSON.parse(raw)?.state?.theme;
      return typeof theme === "string" ? theme : "";
    } catch (_) { return ""; }
  }

  const systemDark = () => !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);

  function resolve(theme) {
    if (theme === "dark" || theme === "white") return theme;
    if (theme === "" || theme === "auto") return systemDark() ? "dark" : "white";
    return "";
  }

  function currentTheme() {
    const doc = parentDocument();
    if (doc) return doc.documentElement.getAttribute("data-theme") || "";
    return resolve(storedTheme());
  }

  function apply(theme) {
    const root = document.documentElement;
    if (theme === "dark" || theme === "white") root.setAttribute("data-theme", theme);
    else root.removeAttribute("data-theme");
    root.style.colorScheme = theme === "dark" ? "dark" : "light";
  }

  const sync = () => apply(currentTheme());
  sync();

  const doc = parentDocument();
  if (doc) {
    new MutationObserver(sync).observe(doc.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  } else {
    window.addEventListener("storage", (event) => { if (!event.key || event.key === STORE_KEY) sync(); });
  }
  if (window.matchMedia) {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", sync);
  }
})();
</script>
</head>
<body>
<div class="wrap">

<section id="gate" class="card gate hidden">
  <h2>需要管理密钥</h2>
  <p class="muted small" id="gate-reason"></p>
  <div id="gate-error" class="notice err"></div>
  <label class="field">管理密钥
    <input id="gate-key" type="password" autocomplete="current-password" placeholder="Management Key">
  </label>
  <button id="gate-submit" class="primary" style="margin-top:10px">确定</button>
</section>

<main id="app" class="hidden">
  <header class="head">
    <h1>API Key 计费</h1>
    <span id="head-status" class="tag plain">…</span>
  </header>

  <div id="notice" class="notice"></div>

  <div class="stats" style="margin-bottom:16px">
    <div class="stat"><span class="muted small">累计费用</span><b id="s-cost">—</b></div>
    <div class="stat"><span class="muted small">累计请求</span><b id="s-req">—</b></div>
    <div class="stat"><span class="muted small">API Key 数量</span><b id="s-keys">—</b></div>
    <div class="stat"><span class="muted small">额度用尽</span><b id="s-blocked">—</b></div>
  </div>

  <div class="tabs">
    <button data-tab="keys" class="active">API Key</button>
    <button data-tab="plans">订阅计划</button>
    <button data-tab="prices">模型定价</button>
    <button data-tab="logs">计费日志</button>
    <button data-tab="diag">运行诊断</button>
  </div>

  <section id="tab-keys">
    <div class="card">
      <div class="row spread section-toolbar" style="margin-bottom:12px">
        <h2 style="margin:0">API Key</h2>
        <div class="row card-actions">
          <input id="key-filter" placeholder="搜索 API Key、备注或计划" class="wide-search">
        </div>
      </div>
      <div id="keys-body"></div>
    </div>
    <div class="card">
      <h2>模型用量</h2>
      <div id="models-body"></div>
    </div>
  </section>

  <section id="tab-plans" class="hidden">
    <div class="card">
      <h2>订阅计划</h2>
      <div id="plans-body"></div>
    </div>
    <div class="card">
      <h2 id="plan-form-title">新建订阅计划</h2>
      <input id="plan-id" type="hidden">
      <div class="row" style="align-items:flex-end">
        <label class="field">名称<input id="plan-name" placeholder="团队 30 天额度"></label>
        <label class="field">额度（USD）<input id="plan-amount" type="number" step="any" min="0.000001"></label>
        <label class="field">周期
          <select id="plan-kind">
            <option value="daily">24 小时</option>
            <option value="weekly">7 天</option>
            <option value="monthly">30 天</option>
            <option value="custom">自定义周期</option>
            <option value="never">不重置</option>
          </select>
        </label>
        <label class="field hidden" id="plan-seconds-field">时长（秒）<input id="plan-seconds" type="number" min="1" value="3600"></label>
        <button id="plan-save" class="primary">保存</button>
        <button id="plan-cancel" class="hidden">取消编辑</button>
      </div>
      <div style="margin-top:14px">
        <div class="small muted" style="margin-bottom:6px">绑定 API Key</div>
        <div id="plan-key-picker" class="key-picker"></div>
      </div>
    </div>
  </section>

  <section id="tab-prices" class="hidden">
    <div class="card">
      <div class="row spread section-toolbar" style="margin-bottom:12px">
        <h2 style="margin:0">模型定价</h2>
        <div class="row card-actions">
          <input id="price-filter" placeholder="搜索模型" style="max-width:220px">
          <button id="price-catalog-refresh">更新参考价</button>
          <button id="price-reset" class="danger">恢复参考价</button>
        </div>
      </div>
      <div id="prices-body"></div>
    </div>
  </section>

  <section id="tab-logs" class="hidden">
    <div class="card log-card">
      <div class="row spread section-toolbar" style="margin-bottom:12px">
        <h2 style="margin:0">计费日志</h2>
        <div class="row card-actions">
          <span id="log-note" class="muted small"></span>
          <input id="log-filter" placeholder="搜索 API Key、备注或模型" class="wide-search">
          <button id="logs-clear" class="danger">清空日志</button>
        </div>
      </div>
      <div id="logs-body" class="log-table-region"></div>
      <div id="log-pagination" class="log-pagination hidden">
        <span class="muted small">大小</span>
        <select id="log-page-size" aria-label="每页日志条数">
          <option value="20">20</option>
          <option value="50" selected>50</option>
          <option value="100">100</option>
          <option value="500">500</option>
          <option value="1000">1000</option>
        </select>
        <button id="log-prev">上一页</button>
        <span id="log-page-number" class="log-page-number">1/1</span>
        <button id="log-next">下一页</button>
      </div>
    </div>
  </section>

  <section id="tab-diag" class="hidden">
    <div class="card">

<div id="cost-tooltip" class="cost-tooltip" role="tooltip" aria-hidden="true"></div>

<script>
"use strict";
const PLUGIN_BASE = "/v0/management/plugins/cpa-key-billing";
const $ = (id) => document.getElementById(id);

/* A same-origin iframe can borrow the panel's obfuscated management key. When
 * it is unavailable, the fallback keeps a manually entered key for this browser
 * tab only. */
const PANEL_STORE_KEY = "cli-proxy-auth";
const PANEL_LEGACY_KEY = "managementKey";
const PANEL_PREFIX = "enc::v1::";
const PANEL_SALT = "cli-proxy-api-webui::secure-storage";
const FALLBACK_KEY = "cpa-key-billing:mgmt-key";

function panelDeobfuscate(raw) {
  if (typeof raw !== "string" || !raw.startsWith(PANEL_PREFIX)) return raw;
  const secret = new TextEncoder().encode(PANEL_SALT + "|" + location.host + "|" + navigator.userAgent);
  const binary = atob(raw.slice(PANEL_PREFIX.length));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i) ^ secret[i % secret.length];
  return new TextDecoder().decode(bytes);
}

function panelStoredValue(name) {
  let raw = null;
  try { raw = localStorage.getItem(name); } catch (_) { return null; }
  if (!raw) return null;
  try { return JSON.parse(panelDeobfuscate(raw)); } catch (_) { return null; }
}

function readPanelKey() {
  const session = panelStoredValue(PANEL_STORE_KEY);
  const fromStore = session && session.state && session.state.managementKey;
  if (typeof fromStore === "string" && fromStore.trim()) return fromStore.trim();

  const legacy = panelStoredValue(PANEL_LEGACY_KEY);
  if (typeof legacy === "string" && legacy.trim()) return legacy.trim();

  return "";
}

let authKey = "";
let state = { keys: [], plans: [], prices: [], status: null, stats: null, logs: null };
let logPage = 1;
let logPageSize = 50;

// CLIProxyAPI HTML-escapes every string in a plugin management response, so a
// label saved as "A & B" comes back as "A &amp; B". Left alone it would gain
// another layer on every round trip, so responses are decoded on arrival.
const ENTITIES = [[/&lt;/g, "<"], [/&gt;/g, ">"], [/&#34;/g, '"'], [/&#39;/g, "'"], [/&amp;/g, "&"]];
function unescapeDeep(value) {
  if (typeof value === "string") {
    let out = value;
    for (const [pattern, replacement] of ENTITIES) out = out.replace(pattern, replacement);
    return out;
  }
  if (Array.isArray(value)) return value.map(unescapeDeep);
  if (value && typeof value === "object") {
    const out = {};
    for (const key of Object.keys(value)) out[key] = unescapeDeep(value[key]);
    return out;
  }
  return value;
}

class AuthError extends Error {}

async function api(method, path, body, opts) {
  const init = { method, headers: { "Authorization": "Bearer " + authKey } };
  if (body !== undefined && body !== null) {
    init.headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(body);
  }
  const resp = await fetch(location.origin + path, init);
  const text = await resp.text();
  let payload = null;
  if (text) { try { payload = JSON.parse(text); } catch (_) { payload = null; } }
  if (!resp.ok) {
    const detail = payload && payload.error ? (payload.error.message ?? payload.error) : text;
    const message = typeof detail === "string" ? unescapeDeep(detail).trim() : "";
    if (resp.status === 401 || resp.status === 403) {
      throw new AuthError(message || "管理密钥无效或已被拒绝");
    }
    throw new Error(message || ("HTTP " + resp.status));
  }
  return (opts && opts.raw) ? payload : unescapeDeep(payload);
}

const plugin = (method, path, body) => api(method, PLUGIN_BASE + path, body);

function usd(value) {
  const amount = Number(value || 0);
  if (amount === 0) return "$0";
  const absolute = Math.abs(amount);
  const digits = absolute >= 1 ? 2 : absolute >= 0.01 ? 4 : 6;
  const compact = amount.toLocaleString("en-US", { maximumFractionDigits: digits });
  const rounded = Number(compact.replaceAll(",", ""));
  if (rounded === 0) return "<$0.000001";
  const tolerance = Number.EPSILON * Math.max(1, absolute) * 8;
  if (Math.abs(amount - rounded) <= tolerance) return "$" + compact;
  return "$" + amount.toLocaleString("en-US", {
    minimumFractionDigits: digits,
    maximumFractionDigits: digits,
  });
}
function int(value) { return Number(value || 0).toLocaleString("zh-CN"); }
function tokens(value) {
  const n = Number(value || 0);
  if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return String(n);
}
function exactTokens(value) {
  return Math.trunc(Number(value || 0)).toLocaleString("en-US");
}
function cacheReadRate(cacheRead, totalInput) {
  const input = Number(totalInput || 0);
  if (input <= 0) return "0.00%";
  return (Number(cacheRead || 0) / input * 100).toFixed(2) + "%";
}
function tokenThreshold(value) {
  const n = Number(value || 0);
  if (n >= 1e9) return String(Number((n / 1e9).toFixed(3))) + "B";
  if (n >= 1e6) return String(Number((n / 1e6).toFixed(3))) + "M";
  if (n >= 1e3) return String(Number((n / 1e3).toFixed(3))) + "K";
  return exactTokens(n);
}
function when(value) {
  if (!value) return "—";
  const date = new Date(value);
  if (isNaN(date.getTime()) || date.getFullYear() < 2000) return "—";
  return date.toLocaleString("zh-CN", { hour12: false });
}

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attrs || {})) {
    if (name === "class") node.className = value;
    else if (name === "text") node.textContent = value;
    else if (name.startsWith("on")) node.addEventListener(name.slice(2), value);
    else if (value !== null && value !== undefined && value !== false) node.setAttribute(name, value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  return node;
}
function table(headers, rows) {
  if (!rows.length) return el("div", { class: "empty", text: "暂无数据" });
  const head = el("tr", {}, headers.map((h) => el("th", { class: h.num ? "num" : "" }, h.label ?? h)));
  return el("div", { class: "table-scroll" },
    el("table", {}, el("thead", {}, head), el("tbody", {}, rows)));
}
function periodText(period) {
  if (!period) return "—";
  switch (period.kind) {
    case "weekly": return "7 天";
    case "monthly": return "30 天";
    case "custom": return "每 " + int(period.seconds) + " 秒";
    case "never": return "不重置";
    default: return "24 小时";
  }
}

let noticeTimer = 0;
function notify(message, kind) {
  const node = $("notice");
  node.textContent = message;
  node.className = "notice show " + (kind || "ok");
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { node.className = "notice"; }, kind === "err" ? 9000 : 4000);
}
function fail(err) {
  if (err instanceof AuthError) { gate(GATE_REJECTED, err.message); return; }
  notify(err.message || String(err), "err");
}
async function guard(fn) { try { await fn(); } catch (err) { fail(err); } }

function ask(title, text, value) {
  return new Promise((resolve) => {
    $("dlg-title").textContent = title;
    $("dlg-text").textContent = text || "";
    $("dlg-input").value = value || "";
    $("dlg-input").classList.toggle("hidden", value === undefined);
    const close = (result) => { $("dlg").close(); resolve(result); };
    $("dlg-ok").onclick = () => close(value === undefined ? true : $("dlg-input").value);
    $("dlg-cancel").onclick = () => close(null);
    $("dlg").showModal();
    if (value !== undefined) $("dlg-input").focus();
  });
}
const confirmAction = (title, text) => ask(title, text, undefined);

const GATE_NO_PANEL_KEY = "无法读取管理密钥。请在此输入，或在登录管理中心时勾选「记住密码」。";
const GATE_REJECTED = "管理密钥已失效，请重新输入或返回管理中心登录。";

function gate(reason, error) {
  authKey = "";
  try { sessionStorage.removeItem(FALLBACK_KEY); } catch (_) {}
  $("app").classList.add("hidden");
  $("gate").classList.remove("hidden");
  $("gate-reason").textContent = reason || "";
  const box = $("gate-error");
  box.textContent = error || "";
  box.className = error ? "notice err show" : "notice err";
}

async function start(key) {
  authKey = key;
  // Repeated invalid management keys can trigger an IP ban, so probe once only.
  await plugin("GET", "/status");
  $("gate").classList.add("hidden");
  $("app").classList.remove("hidden");
  const summary = await autoSyncKeys();
  await reloadAll();
  if (summary) notify(summary);
}

async function reloadAll() {
  // The log is the one payload that grows with traffic rather than with
  // configuration, so it is fetched only while its own tab is open. Switching
  // tabs reloads, so opening it is what fetches it.
  const [status, directory, plans, prices, stats, logs] = await Promise.all([
    plugin("GET", "/status"),
    plugin("GET", "/keys"),
    plugin("GET", "/plans"),
    plugin("GET", "/prices"),
    plugin("GET", "/stats"),
    document.querySelector('[data-tab="logs"].active') ? plugin("GET", "/logs") : Promise.resolve(null),
  ]);
  state.status = status;
  state.keys = directory.keys || [];
  state.plans = plans.plans || [];
  state.prices = prices.models || [];
  state.stats = stats;
  if (logs) state.logs = logs;
  render();
}

function render() {
  renderHeader();
  renderKeys();
  renderModels();
  renderPlans();
  renderPrices();
  renderLogs();
  renderDiag();
}

function renderHeader() {
  const status = state.status || {};
  const stats = state.stats || {};
  const badge = $("head-status");
  badge.textContent = status.enabled ? "运行中" : "已停用";
  badge.className = "tag " + (status.enabled ? "ok" : "warn");
  $("s-cost").textContent = usd(stats.lifetime?.cost_usd);
  $("s-req").textContent = int(stats.lifetime?.requests);
  $("s-keys").textContent = int(stats.keys);
  $("s-blocked").textContent = int(stats.blocked_keys);
}

function keyName(view) {
  return view.label || view.preview || (view.scope || "").slice(0, 12) + "…";
}

function keyPillText(view) {
  const identity = view.preview || (view.scope || "").slice(0, 12) + "…";
  return view.label && view.label !== identity ? view.label + " · " + identity : identity;
}

function renderKeys() {
  const filter = $("key-filter").value.trim().toLowerCase();
  const rows = state.keys
    .filter((view) => !filter || (keyName(view) + " " + (view.plan_name || "") + " " + view.scope).toLowerCase().includes(filter))
    .map((view) => {
      const name = keyName(view);
      const select = el("select", {
        name: "plan_id",
        "aria-label": name + " 的订阅计划",
        onchange: (event) => guard(async () => {
          const planID = event.target.value;
          if (planID) await plugin("POST", "/keys/bind", { scope: view.scope, plan_id: planID });
          else await plugin("POST", "/keys/unbind", { scope: view.scope });
          notify("订阅计划已更新");
          await reloadAll();
        }),
      }, el("option", { value: "", text: "不限制" }),
         state.plans.map((plan) => el("option", { value: plan.id, selected: plan.id === view.plan_id }, plan.name || plan.id)));

      const percent = view.unlimited ? 0 : Math.min(100, view.used_percent || 0);
      const usage = view.unlimited
        ? el("span", { class: "muted", text: "—" })
        : el("div", { class: "usage" },
            el("span", { class: "mono" }, usd(view.spent_usd) + " / " + usd(view.limit_usd)),
            el("div", { class: "bar" + (view.blocked ? " full" : "") }, el("i", { style: "width:" + percent + "%" })));

      const notes = [];
      if (view.preview && view.preview !== name) notes.push(view.preview);
      if (!view.in_config) notes.push("不在 CLIProxyAPI Key 列表中");

      return el("tr", {},
        el("td", {},
          el("div", {}, name),
          notes.length ? el("div", { class: "muted small mono" }, notes.join(" · ")) : null,
        ),
        el("td", {}, select),
        el("td", {}, usage),
        el("td", { class: "small muted" }, view.unlimited ? "—" :
          (state.plans.find((plan) => plan.id === view.plan_id)?.period?.kind === "never"
            ? "不重置"
            : (view.cycle_end_at ? when(view.cycle_end_at) : "未开始"))),
        el("td", { class: "num" }, int(view.lifetime?.requests)),
        el("td", { class: "num" }, usd(view.lifetime?.cost_usd)),
        el("td", {}, view.blocked
          ? el("span", { class: "tag bad", text: "额度用尽" })
          : el("span", { class: "tag " + (view.unlimited ? "plain" : "ok"), text: view.unlimited ? "不限制" : "正常" })),
        el("td", { class: "small" },
          el("button", { class: "link", text: "重置额度", disabled: view.unlimited || undefined,
            onclick: () => guard(async () => {
              if (!await confirmAction("重置订阅额度？", "当前周期将结束，下一次请求会开启新周期；累计用量不受影响。")) return;
              await plugin("POST", "/keys/reset", { scope: view.scope });
              notify("订阅额度已重置"); await reloadAll();
            }) }),
          el("button", { class: "link", text: "设置备注",
            onclick: () => guard(async () => {
              const label = await ask("设置备注", keyName(view), view.label || "");
              if (label === null) return;
              await plugin("POST", "/keys/label", { scope: view.scope, label });
              notify("已保存备注"); await reloadAll();
            }) }),
        ),
      );
    });

  $("keys-body").replaceChildren(table(
    ["API Key", "订阅计划", "本期费用", "到期时间",
      { label: "累计请求", num: true }, { label: "累计费用", num: true }, "状态", "操作"],
    rows));
}

function renderModels() {
  const rows = (state.stats?.by_model || []).map((entry) => el("tr", {},
    el("td", { class: "mono" }, entry.model),
    el("td", { class: "num" }, int(entry.requests)),
    el("td", { class: "num" }, tokens(entry.uncached_input_tokens + entry.cache_read_tokens + entry.cache_creation_tokens)),
    el("td", { class: "num" }, tokens(entry.output_tokens)),
    el("td", { class: "num" }, tokens(entry.cache_read_tokens)),
    el("td", { class: "num" }, tokens(entry.cache_creation_tokens)),
    el("td", { class: "num" }, usd(entry.cost_usd)),
  ));
  $("models-body").replaceChildren(table(
    ["模型", { label: "请求", num: true }, { label: "输入", num: true }, { label: "输出", num: true },
      { label: "缓存读取", num: true }, { label: "缓存写入", num: true }, { label: "费用", num: true }],
    rows));
}

function renderPlans() {
  const rows = state.plans.map((plan) => {
    const boundKeys = state.keys.filter((key) => key.plan_id === plan.id);
    return el("tr", {},
      el("td", {}, plan.name || plan.id),
      el("td", { class: "num" }, usd(plan.amount_usd)),
      el("td", {}, periodText(plan.period)),
      el("td", {}, boundKeys.length
        ? el("div", { class: "key-pill-list" }, boundKeys.map((key) =>
            el("span", { class: "key-pill", text: keyPillText(key), title: key.scope })))
        : el("span", { class: "muted", text: "—" })),
      el("td", { class: "small" },
        el("button", { class: "link", text: "编辑", onclick: () => editPlan(plan) }),
        el("button", { class: "link danger", text: "删除", onclick: () => guard(async () => {
          if (!await confirmAction("删除订阅计划「" + (plan.name || plan.id) + "」？",
            boundKeys.length ? ("已绑定的 " + boundKeys.length + " 个 API Key 将改为不限制。") : "")) return;
          await plugin("DELETE", "/plans?id=" + encodeURIComponent(plan.id));
          notify("订阅计划已删除"); resetPlanForm(); await reloadAll();
        }) }),
      ),
    );
  });
  $("plans-body").replaceChildren(table(
    ["名称", { label: "额度", num: true }, "周期", "已绑定 Key", "操作"],
    rows));
  renderPlanKeyPicker($("plan-id").value);
}

function priceSourceTag(source) {
  switch (source) {
    case "custom": return el("span", { class: "tag warn", text: "自定义" });
    case "builtin": return el("span", { class: "tag ok", text: "参考价" });
    default: return el("span", { class: "tag plain", text: "待定价" });
  }
}

function optionalPrice(value) {
  return value === null || value === undefined
    ? el("span", { class: "muted", text: "-" })
    : usd(value);
}

function tierPriceCell(row, field, optional) {
  const base = row[field];
  const tier = row.long_context;
  if (!tier) return optional ? optionalPrice(base) : usd(base);
  const threshold = tokenThreshold(tier.threshold_input_tokens);
  const longValue = tier[field];
  if (optional && (base === null || base === undefined) && (longValue === null || longValue === undefined)) {
    return el("span", { class: "muted", text: "-" });
  }
  return el("div", { class: "tier-price" },
    el("span", {}, optional ? optionalPrice(base) : usd(base)),
    el("span", { class: "muted small" }, ">" + threshold + " ", optional ? optionalPrice(longValue) : usd(longValue)),
  );
}

function renderPrices() {
  const filter = $("price-filter").value.trim().toLowerCase();
  const rows = state.prices
    .filter((row) => !filter || row.pattern.toLowerCase().includes(filter))
    .map((row) => el("tr", {},
      el("td", { class: "mono" }, row.pattern),
      el("td", { class: "num" }, tierPriceCell(row, "input_per_1m", false)),
      el("td", { class: "num" }, tierPriceCell(row, "output_per_1m", false)),
      el("td", { class: "num" }, tierPriceCell(row, "cache_read_per_1m", true)),
      el("td", { class: "num" }, tierPriceCell(row, "cache_write_per_1m", true)),
      el("td", {}, priceSourceTag(row.source)),
      el("td", { class: "small" }, el("button", { class: "link", text: "编辑", onclick: () => editPrice(row) })),
    ));
  $("prices-body").replaceChildren(table(
    ["模型", { label: "输入 / 1M Token", num: true }, { label: "输出 / 1M Token", num: true },
      { label: "缓存读取 / 1M Token", num: true }, { label: "缓存写入 / 1M Token", num: true }, "来源", "操作"],
    rows));
}

function logKeyName(entry) {
  return entry.label || entry.preview || (entry.scope || "").slice(0, 12) + "…";
}

function costTierText(cost) {
  const threshold = tokenThreshold(cost.threshold_input_tokens);
  return cost.long_context ? "长上下文 >" + threshold : "标准上下文 ≤" + threshold;
}

function showCostTooltip(anchor, cost, reasoningTokens) {
  const tooltip = $("cost-tooltip");
  const input = Number(cost.uncached_input_tokens || 0) + Number(cost.cache_read_tokens || 0) + Number(cost.cache_write_tokens || 0);
  const output = Number(cost.billed_output_tokens || 0);
  const rows = [
    ["未缓存输入", cost.uncached_input_tokens, cost.applied_input_per_1m, cost.uncached_input_usd],
    ["缓存读取", cost.cache_read_tokens, cost.applied_cache_read_per_1m, cost.cache_read_usd],
    ["缓存写入", cost.cache_write_tokens, cost.applied_cache_write_per_1m, cost.cache_write_usd],
    ["输出", output, cost.applied_output_per_1m, cost.output_usd],
  ];
  tooltip.replaceChildren(
    el("div", { class: "cost-tooltip-title", text: "计价详情" }),
    el("div", { class: "cost-tooltip-summary" },
      cost.tiered ? el("span", {}, "档位") : null,
      cost.tiered ? el("b", {}, costTierText(cost)) : null,
      el("span", {}, "输入 Token"), el("b", {}, exactTokens(input)),
      el("span", {}, "输出 Token"), el("b", {}, exactTokens(output)),
      reasoningTokens ? el("span", {}, "其中推理 Token") : null,
      reasoningTokens ? el("b", {}, exactTokens(reasoningTokens)) : null,
    ),
    el("div", { class: "cost-tooltip-grid" },
      el("span", { class: "cost-tooltip-head" }, "项目"),
      el("span", { class: "cost-tooltip-head num" }, "Token / 单价"),
      el("span", { class: "cost-tooltip-head num" }, "金额"),
      rows.flatMap(([name, tokenCount, price, amount]) => [
        el("span", {}, name),
        el("span", { class: "num" }, exactTokens(tokenCount) + " × " + usd(price) + " / 1M"),
        el("span", { class: "num" }, usd(amount)),
      ]),
    ),
    el("div", { class: "cost-tooltip-total" }, el("span", {}, "总金额"), el("span", {}, usd(cost.total_usd))),
  );
  tooltip.classList.add("show");
  tooltip.setAttribute("aria-hidden", "false");
  positionCostTooltip(anchor);
}

function positionCostTooltip(anchor) {
  const tooltip = $("cost-tooltip");
  const anchorRect = anchor.getBoundingClientRect();
  const gap = 8;
  const margin = 8;
  let left = anchorRect.right + gap;
  let top = anchorRect.top;
  const rect = tooltip.getBoundingClientRect();
  if (left + rect.width > innerWidth - margin) left = anchorRect.left - rect.width - gap;
  if (left < margin) left = Math.max(margin, innerWidth - rect.width - margin);
  if (top + rect.height > innerHeight - margin) top = innerHeight - rect.height - margin;
  tooltip.style.left = Math.round(left) + "px";
  tooltip.style.top = Math.round(Math.max(margin, top)) + "px";
}

function hideCostTooltip() {
  const tooltip = $("cost-tooltip");
  tooltip.classList.remove("show");
  tooltip.setAttribute("aria-hidden", "true");
}

function renderLogs() {
  hideCostTooltip();
  const view = state.logs;
  const note = $("log-note");
  const pagination = $("log-pagination");
  if (!view) {
    note.textContent = "";
    pagination.classList.add("hidden");
    $("logs-body").replaceChildren(el("div", { class: "empty", text: "加载中…" }));
    return;
  }
  if (!view.limit) {
    note.textContent = "";
    pagination.classList.add("hidden");
    $("logs-body").replaceChildren(el("div", { class: "empty" },
      "计费日志已关闭。将插件配置项 log_entries 设为大于 0 的值即可开启。"));
    return;
  }
  note.textContent = "已保留 " + int(view.retained) + " / " + int(view.limit) + " 条";

  const filter = $("log-filter").value.trim().toLowerCase();
  const filtered = (view.entries || []).filter((entry) => !filter ||
      (logKeyName(entry) + " " + (entry.preview || "") + " " + (entry.scope || "") + " " +
        (entry.model || "") + " " + (entry.alias || "") + " " +
        (entry.client_protocol || "") + " " + (entry.provider || "") + " " + (entry.request_id || "")).toLowerCase().includes(filter));
  const totalPages = Math.max(1, Math.ceil(filtered.length / logPageSize));
  logPage = Math.min(Math.max(1, logPage), totalPages);
  const start = (logPage - 1) * logPageSize;
  const rows = filtered
    .slice(start, start + logPageSize)
    .map((entry) => {
      const cost = entry.cost || {};
      const keyDisplay = logKeyName(entry);
      const statusMarks = [];
      if (entry.failed) statusMarks.push(el("span", { class: "tag bad", text: "失败" }));
      if (entry.price_source === "none") statusMarks.push(el("span", { class: "tag warn", text: "待定价" }));
      if (entry.accounting_quality && entry.accounting_quality !== "complete") {
        statusMarks.push(el("span", { class: "tag warn",
          text: entry.accounting_quality === "inconsistent" ? "Token 明细异常" : "Token 未分类" }));
      }
      let tierMark = null;
      if (cost.tiered) {
        tierMark = el("span", {
          class: "tag " + (cost.long_context ? "warn" : "plain"),
          text: cost.long_context ? "长上下文" : "标准",
        });
      }

      const input = (cost.uncached_input_tokens || 0) + (cost.cache_read_tokens || 0) + (cost.cache_write_tokens || 0);
      const output = cost.billed_output_tokens || 0;

      return el("tr", {},
        el("td", { class: "small" }, when(entry.at)),
        el("td", {},
          el("div", {}, keyDisplay),
          entry.preview && entry.preview !== keyDisplay
            ? el("div", { class: "muted small mono" }, entry.preview)
            : null,
        ),
        el("td", { class: "mono small" },
          el("div", { class: "log-cell-line" }, entry.model || "—"),
          entry.alias ? el("div", { class: "log-cell-line muted" }, "别名 " + entry.alias) : null,
        ),
        el("td", {}, tierMark || el("span", { class: "muted", text: "—" })),
        el("td", {},
          el("div", { class: "log-cell-line" },
            el("span", {}, entry.client_protocol || "—"),
            statusMarks),
          el("div", { class: "log-cell-line muted small" }, entry.provider || "未知"),
        ),
        el("td", { class: "num" }, exactTokens(input)),
        el("td", { class: "num" },
          el("div", {}, exactTokens(cost.cache_read_tokens)),
          el("div", { class: "muted small" }, cacheReadRate(cost.cache_read_tokens, input)),
        ),
        el("td", { class: "num" }, exactTokens(cost.cache_write_tokens)),
        el("td", { class: "num" },
          el("div", {}, exactTokens(output)),
          entry.reasoning_tokens ? el("div", { class: "muted small" }, "推理 " + exactTokens(entry.reasoning_tokens)) : null,
        ),
        el("td", { class: "num" },
          el("span", {
            class: "cost-value",
            tabindex: "0",
            "aria-label": "查看计价详情",
            onmouseenter: (event) => showCostTooltip(event.currentTarget, cost, entry.reasoning_tokens),
            onmouseleave: hideCostTooltip,
            onfocus: (event) => showCostTooltip(event.currentTarget, cost, entry.reasoning_tokens),
            onblur: hideCostTooltip,
          }, usd(cost.total_usd)),
        ),
      );
    });

  $("logs-body").replaceChildren(table(
    ["时间", "API Key", "模型", "计价档位", "协议/上游", { label: "输入", num: true }, { label: "缓存读取", num: true },
      { label: "缓存写入", num: true }, { label: "输出", num: true }, { label: "费用", num: true }],
    rows));
  pagination.classList.remove("hidden");
  $("log-page-size").value = String(logPageSize);
  $("log-page-number").textContent = logPage + "/" + totalPages;
  $("log-prev").disabled = logPage <= 1;
  $("log-next").disabled = logPage >= totalPages;
}

function renderDiag() {
  const status = state.status || {};
  const counters = status.counters || {};
  const pairs = [
    ["状态", status.enabled ? "已启用" : "已停用（不会计费或限制请求）"],
    ["数据保存", status.last_error ? "失败：" + status.last_error : (status.pending_write ? "待保存" : "正常")],
    ["未定价请求", int(counters.usage_unpriced), "未匹配模型定价，费用按 0 USD 记录。"],
    ["Token 缺失", int(counters.usage_no_tokens), "未取得 Token 明细，费用按 0 USD 记录。"],
    ["Token 分类异常", int(counters.usage_unclassified), "Token 明细无效或分类不完整，费用按 0 USD 记录。"],
    ["处理中请求", int(counters.pending_requests), "已通过额度检查、尚未结束的请求。"],
  ];
  $("diag-body").replaceChildren(table(["项目", "值", "说明"],
    pairs.map(([name, value, note]) => el("tr", {},
      el("td", {}, name),
      el("td", { class: "mono small" }, String(value ?? "—")),
      el("td", { class: "muted small" }, note)))));
}

function syncPlanFields() {
  const kind = $("plan-kind").value;
  $("plan-seconds-field").classList.toggle("hidden", kind !== "custom");
}
function renderPlanKeyPicker(planID) {
  const picker = $("plan-key-picker");
  if (!state.keys.length) {
    picker.replaceChildren(el("div", { class: "empty", text: "暂无 API Key" }));
    return;
  }
  picker.replaceChildren(...state.keys.map((key) => {
    const ownedByOther = !!key.plan_id && key.plan_id !== planID;
    const owner = ownedByOther ? state.plans.find((plan) => plan.id === key.plan_id) : null;
    return el("label", { class: ownedByOther ? "disabled" : "" },
    el("input", { type: "checkbox", value: key.scope, checked: key.plan_id === planID && !!planID,
      disabled: ownedByOther || undefined }),
    el("span", {}, keyName(key)),
    key.preview && key.preview !== keyName(key) ? el("span", { class: "muted small mono" }, key.preview) : null,
    owner ? el("span", { class: "muted small", text: "已绑定「" + (owner.name || owner.id) + "」" }) : null,
  );
  }));
}

function selectedPlanScopes() {
  return Array.from($("plan-key-picker").querySelectorAll('input[type="checkbox"]:checked')).map((input) => input.value);
}

function resetPlanForm() {
  $("plan-form-title").textContent = "新建订阅计划";
  $("plan-id").value = ""; $("plan-name").value = ""; $("plan-amount").value = "";
  $("plan-kind").value = "daily";
  $("plan-seconds").value = "3600";
  $("plan-cancel").classList.add("hidden");
  syncPlanFields();
  renderPlanKeyPicker("");
}
function editPlan(plan) {
  $("plan-form-title").textContent = "编辑订阅计划：" + (plan.name || plan.id);
  $("plan-id").value = plan.id;
  $("plan-name").value = plan.name || "";
  $("plan-amount").value = plan.amount_usd ?? 0;
  $("plan-kind").value = plan.period?.kind || "daily";
  $("plan-seconds").value = String(plan.period?.seconds || 3600);
  $("plan-cancel").classList.remove("hidden");
  syncPlanFields();
  renderPlanKeyPicker(plan.id);
  $("plan-name").scrollIntoView({ block: "center", behavior: "smooth" });
}
function planFromForm() {
  const kind = $("plan-kind").value;
  const period = { kind };
  if (kind === "custom") period.seconds = Number($("plan-seconds").value);
  const amount = Number($("plan-amount").value);
  if (!Number.isFinite(amount) || amount <= 0) throw new Error("额度必须大于 0");
  return {
    name: $("plan-name").value.trim(),
    amount_usd: amount,
    period,
    scopes: selectedPlanScopes(),
  };
}

let editingModel = "";
let priceReferenceTimer = 0;
let priceReferenceRequest = 0;

function optionalNumber(id) {
  const raw = $(id).value.trim();
  return raw === "" ? null : Number(raw);
}

function fillPriceFields(row) {
  $("price-in").value = row.input_per_1m ?? 0;
  $("price-out").value = row.output_per_1m ?? 0;
  $("price-cr").value = row.cache_read_per_1m ?? "";
  $("price-cw").value = row.cache_write_per_1m ?? "";
  const tier = row.long_context;
  $("price-tiered").checked = !!tier;
  $("price-tier-threshold").value = tier?.threshold_input_tokens ?? 272000;
  $("price-tier-in").value = tier?.input_per_1m ?? 0;
  $("price-tier-out").value = tier?.output_per_1m ?? 0;
  $("price-tier-cr").value = tier?.cache_read_per_1m ?? "";
  $("price-tier-cw").value = tier?.cache_write_per_1m ?? "";
  syncPriceTierFields();
}

function referencePriceText(row) {
  const prices = ["输入 " + usd(row.input_per_1m), "输出 " + usd(row.output_per_1m)];
  if (row.cache_read_per_1m !== null && row.cache_read_per_1m !== undefined) {
    prices.push("缓存读 " + usd(row.cache_read_per_1m));
  }
  if (row.cache_write_per_1m !== null && row.cache_write_per_1m !== undefined) {
    prices.push("缓存写 " + usd(row.cache_write_per_1m));
  }
  if (row.long_context) {
    prices.push(">" + tokenThreshold(row.long_context.threshold_input_tokens) + " 阶梯：输入 " + usd(row.long_context.input_per_1m) +
      " · 输出 " + usd(row.long_context.output_per_1m));
  }
  return prices.join(" · ");
}

function syncPriceTierFields() {
  $("price-tier-fields").classList.toggle("hidden", !$("price-tiered").checked);
}

function renderPriceReferences(models) {
  const results = $("price-reference-results");
  if (!models.length) {
    results.replaceChildren(el("div", { class: "price-reference-empty", text: "未找到参考价" }));
    return;
  }
  results.replaceChildren(...models.map((row) => el("button", {
    class: "price-reference-option",
    type: "button",
    onclick: (event) => {
      fillPriceFields(row);
      for (const option of results.querySelectorAll(".price-reference-option")) option.classList.remove("selected");
      event.currentTarget.classList.add("selected");
    },
  },
  el("span", { class: "mono price-reference-name", text: row.pattern }),
  el("span", { class: "price-reference-prices", text: referencePriceText(row) }))));
  results.scrollTop = 0;
}

async function searchPriceReferences() {
  const query = $("price-reference-search").value.trim();
  const request = ++priceReferenceRequest;
  if (!query) {
    $("price-reference-results").replaceChildren(
      el("div", { class: "price-reference-empty", text: "输入模型名称" }));
    return;
  }
  $("price-reference-results").replaceChildren(
    el("div", { class: "price-reference-empty", text: "正在搜索…" }));
  try {
    const result = await plugin("GET", "/prices/catalog?q=" + encodeURIComponent(query) + "&limit=20");
    if (request === priceReferenceRequest) renderPriceReferences(result.models || []);
  } catch (err) {
    if (request === priceReferenceRequest) {
      if (err instanceof AuthError) {
        $("price-dlg").close();
        fail(err);
        return;
      }
      $("price-reference-results").replaceChildren(
        el("div", { class: "price-reference-empty", text: "搜索失败：" + (err.message || err) }));
    }
  }
}

function editPrice(row) {
  editingModel = row.pattern;
  $("price-model").textContent = row.pattern;
  fillPriceFields(row);
  $("price-reference-search").value = row.pattern;
  $("price-dlg").showModal();
  $("price-reference-search").focus();
  searchPriceReferences();
}

// /v1/models requires a downstream API Key, so the browser borrows one only
// for this same-origin request. The plugin never stores it.
async function autoSyncModels(apiKeys) {
  const key = (apiKeys || []).map((value) => (value || "").trim()).find(Boolean);
  if (!key) return "";
  try {
    const resp = await fetch(location.origin + "/v1/models", { headers: { "Authorization": "Bearer " + key } });
    if (!resp.ok) {
      throw new Error("HTTP " + resp.status);
    }
    const payload = await resp.json();
    const list = (payload && payload.data) || (payload && payload.models) || (Array.isArray(payload) ? payload : []);
    const models = list.map((item) => (typeof item === "string" ? item : item && (item.id || item.name))).filter(Boolean);
    if (!models.length) {
      return "";
    }
    const result = await plugin("POST", "/prices/sync", { models });
    if (result.added || result.removed) {
      return "模型同步完成：新增 " + result.added + " 个（" + result.priced + " 个有参考价），移除 " + result.removed + " 个";
    }
    return "";
  } catch (err) {
    if (err instanceof AuthError) throw err;
    notify("同步模型失败：" + (err.message || err), "err");
    return "";
  }
}

async function autoSyncKeys() {
  const summaries = [];
  let keys = [];
  try {
    const list = await api("GET", "/v0/management/api-keys", null, { raw: true });
    keys = (list && list["api-keys"]) || [];
    const result = await plugin("POST", "/keys/sync", { keys, allow_empty: true });
    if (result.added || result.removed) {
      summaries.push("API Key 同步完成：新增 " + result.added + " 个，移除 " + result.removed + " 个");
    } else if (!keys.length) {
      summaries.push("CLIProxyAPI 尚未配置 API Key");
    }
  } catch (err) {
    if (err instanceof AuthError) throw err;
    notify("同步 API Key 失败：" + (err.message || err), "err");
  }
  const models = await autoSyncModels(keys);
  if (models) summaries.push(models);
  return summaries.join("；");
}

$("gate-submit").onclick = () => {
  const key = $("gate-key").value.trim();
  if (!key) { $("gate-error").textContent = "请输入管理密钥"; $("gate-error").className = "notice err show"; return; }
  $("gate-submit").disabled = true;
  start(key)
    .then(() => { try { sessionStorage.setItem(FALLBACK_KEY, key); } catch (_) {} })
    .catch((err) => gate(GATE_NO_PANEL_KEY, err instanceof AuthError ? err.message : ("连接失败：" + err.message)))
    .finally(() => { $("gate-submit").disabled = false; });
};
$("gate-key").addEventListener("keydown", (event) => { if (event.key === "Enter") $("gate-submit").click(); });

const TABS = Array.from(document.querySelectorAll(".tabs button[data-tab]"));
for (const tab of TABS) {
  tab.onclick = () => {
    for (const other of TABS) other.classList.toggle("active", other === tab);
    for (const other of TABS) $("tab-" + other.dataset.tab).classList.toggle("hidden", other !== tab);
    guard(reloadAll);
  };
}

$("key-filter").addEventListener("input", renderKeys);
$("plan-kind").addEventListener("change", syncPlanFields);
$("plan-cancel").onclick = resetPlanForm;
$("plan-save").onclick = () => guard(async () => {
  const plan = planFromForm();
  const id = $("plan-id").value;
  if (id) await plugin("PATCH", "/plans", { id, ...plan });
  else await plugin("POST", "/plans", plan);
  notify(id ? "订阅计划已保存" : "订阅计划已创建");
  resetPlanForm();
  await reloadAll();
});

$("log-filter").addEventListener("input", () => { logPage = 1; renderLogs(); });
$("logs-body").addEventListener("scroll", hideCostTooltip, { passive: true });
$("log-page-size").addEventListener("change", (event) => {
  logPageSize = Number(event.target.value) || 50;
  logPage = 1;
  renderLogs();
  $("logs-body").scrollTop = 0;
});
$("log-prev").onclick = () => {
  if (logPage <= 1) return;
  logPage--;
  renderLogs();
  $("logs-body").scrollTop = 0;
};
$("log-next").onclick = () => {
  logPage++;
  renderLogs();
  $("logs-body").scrollTop = 0;
};
$("logs-clear").onclick = () => guard(async () => {
  if (!await confirmAction("清空全部计费日志？", "该操作不会修改累计用量、费用或订阅额度，且无法恢复。")) return;
  const result = await plugin("DELETE", "/logs");
  state.logs = { entries: [], retained: 0, limit: state.logs?.limit || 0 };
  logPage = 1;
  renderLogs();
  notify("已清空 " + result.cleared + " 条计费日志");
});

$("data-clear").onclick = () => guard(async () => {
  if (!await confirmAction("重新初始化插件？",
    "模型定价、订阅计划、API Key 记录、用量和计费日志都会删除。插件配置不受影响，此操作无法撤销。")) return;
  await plugin("DELETE", "/data");
  state = { keys: [], plans: [], prices: [], status: null, stats: null, logs: null };
  notify("插件已重新初始化");
  await reloadAll();
});

$("price-filter").addEventListener("input", renderPrices);
$("price-reference-search").addEventListener("input", () => {
  clearTimeout(priceReferenceTimer);
  priceReferenceTimer = setTimeout(() => {
    priceReferenceTimer = 0;
    searchPriceReferences();
  }, 180);
});
$("price-tiered").addEventListener("change", syncPriceTierFields);
$("price-dlg").addEventListener("close", () => {
  clearTimeout(priceReferenceTimer);
  priceReferenceTimer = 0;
  priceReferenceRequest++;
});
$("price-cancel").onclick = () => $("price-dlg").close();
$("price-save").onclick = () => guard(async () => {
  if (!editingModel) return;
  const rule = {
    pattern: editingModel,
    input_per_1m: Number($("price-in").value || 0),
    output_per_1m: Number($("price-out").value || 0),
    cache_read_per_1m: optionalNumber("price-cr"),
    cache_write_per_1m: optionalNumber("price-cw"),
  };
  if ($("price-tiered").checked) {
    const threshold = Number($("price-tier-threshold").value);
    if (!Number.isInteger(threshold) || threshold <= 0) throw new Error("长上下文阈值必须是大于 0 的整数");
    rule.long_context = {
      threshold_input_tokens: threshold,
      input_per_1m: Number($("price-tier-in").value || 0),
      output_per_1m: Number($("price-tier-out").value || 0),
      cache_read_per_1m: optionalNumber("price-tier-cr"),
      cache_write_per_1m: optionalNumber("price-tier-cw"),
    };
  }
  await plugin("PUT", "/prices", rule);
  $("price-dlg").close();
  notify("已保存 " + editingModel + " 的定价");
  await reloadAll();
});
$("price-reset").onclick = () => guard(async () => {
  if (!await confirmAction("恢复全部参考价？", "自定义定价将被覆盖；没有参考价的模型将恢复为 0 USD。")) return;
  const result = await plugin("POST", "/prices/reset");
  notify("已恢复 " + result.restored + " 个模型的参考价");
  await reloadAll();
});
$("price-catalog-refresh").onclick = () => guard(async () => {
  const button = $("price-catalog-refresh");
  button.disabled = true;
  try {
    const result = await plugin("POST", "/prices/catalog/refresh");
    notify("参考价目录已更新，共 " + int(result.catalog?.models) + " 个模型；同步更新 " + int(result.updated_models) + " 个当前价格");
    await reloadAll();
  } finally {
    button.disabled = false;
  }
});

resetPlanForm();

(async function boot() {
  const panelKey = readPanelKey();
  let fallback = "";
  try { fallback = sessionStorage.getItem(FALLBACK_KEY) || ""; } catch (_) {}
  const key = panelKey || fallback;
  if (!key) {
    gate(GATE_NO_PANEL_KEY, "");
    return;
  }
  try {
    await start(key);
  } catch (err) {
    if (err instanceof AuthError) {
      gate(panelKey ? GATE_REJECTED : GATE_NO_PANEL_KEY, err.message);
      return;
    }
    gate(GATE_NO_PANEL_KEY, "连接失败：" + (err.message || err));
  }
})();
</script>
