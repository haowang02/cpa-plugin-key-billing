name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to rebuild and republish.
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  RELEASE_REF: ${{ inputs.release_tag || github.ref }}

jobs:
  check:
    name: Verify tagged source
    uses: ./.github/workflows/check.yml
    with:
      checkout_ref: ${{ inputs.release_tag || github.ref }}
      release_tag: ${{ inputs.release_tag || github.ref_name }}
      verify_release_version: true

  build:
    name: Build ${{ matrix.target }}
    needs:
      - check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            runner: macos-15-intel
            os: darwin
            arch: amd64
            extension: dylib
          - target: darwin-arm64
            runner: macos-15
            os: darwin
            arch: arm64
            extension: dylib
          - target: linux-amd64
            runner: ubuntu-24.04
            os: linux
            arch: amd64
            extension: so
            image: quay.io/pypa/manylinux2014_x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            extension: so
            image: quay.io/pypa/manylinux2014_aarch64
          - target: windows-amd64
            runner: windows-2025
            os: windows
            arch: amd64
            extension: dll
            cc: gcc
          - target: windows-arm64
            runner: windows-11-arm
            os: windows
            arch: arm64
            extension: dll
            cc: aarch64-w64-mingw32-clang

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify native runner architecture
        if: matrix.os != 'windows'
        run: |
          test "$(go env GOOS)" = "${{ matrix.os }}"
          test "$(go env GOARCH)" = "${{ matrix.arch }}"

      - name: Verify native Windows runner architecture
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          if ((go env GOOS) -ne $env:TARGET_OS) {
            throw "Expected GOOS=$($env:TARGET_OS), got $(go env GOOS)"
          }
          if ((go env GOARCH) -ne $env:TARGET_ARCH) {
            throw "Expected GOARCH=$($env:TARGET_ARCH), got $(go env GOARCH)"
          }

      - name: Set up LLVM MinGW for Windows arm64
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        env:
          LLVM_MINGW_VERSION: "20260826"
          LLVM_MINGW_SHA256: dbce5a314c44cf44d02ab0d0e6bce948955b46429274df25544f9cfea4986f7b
          TARGET_CC: ${{ matrix.cc }}
        run: |
          $archiveName = "llvm-mingw-$($env:LLVM_MINGW_VERSION)-ucrt-aarch64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$($env:LLVM_MINGW_VERSION)/$archiveName"
          curl.exe -fsSL --retry 3 --connect-timeout 15 -o $archive $url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actualChecksum = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualChecksum -ne $env:LLVM_MINGW_SHA256) {
            throw "LLVM MinGW checksum mismatch"
          }
          Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP
          $toolchainBin = Join-Path $env:RUNNER_TEMP "llvm-mingw-$($env:LLVM_MINGW_VERSION)-ucrt-aarch64/bin"
          if (-not (Test-Path (Join-Path $toolchainBin "$($env:TARGET_CC).exe"))) {
            throw "LLVM MinGW compiler not found: $($env:TARGET_CC)"
          }
          $toolchainBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build macOS plugin
        if: matrix.os == 'darwin'
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=darwin GOARCH="$TARGET_ARCH" \
            go build -buildvcs=false -tags cshared -buildmode=c-shared \
            -o dist/cpa-key-billing.dylib ./cmd/cpa-key-billing
          rm -f dist/cpa-key-billing.h

      - name: Build Linux plugin with manylinux2014
        if: matrix.os == 'linux'
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p dist
          go_version="$(go env GOVERSION)"
          go_version="${go_version#go}"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e GO_VERSION="$go_version" -e TARGET_ARCH \
            "$TARGET_IMAGE" \
            bash -euo pipefail -c '
              curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-${TARGET_ARCH}.tar.gz" -o /tmp/go.tar.gz
              tar -C /usr/local -xzf /tmp/go.tar.gz
              export PATH=/usr/local/go/bin:$PATH
              CGO_ENABLED=1 GOOS=linux GOARCH="$TARGET_ARCH" \
                go build -buildvcs=false -tags cshared -buildmode=c-shared \
                -o dist/cpa-key-billing.so ./cmd/cpa-key-billing
            '
          rm -f dist/cpa-key-billing.h

      - name: Build Windows plugin
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_CC: ${{ matrix.cc }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:CGO_ENABLED = "1"
          $env:GOOS = "windows"
          $env:GOARCH = $env:TARGET_ARCH
          $env:CC = $env:TARGET_CC
          & $env:CC --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -buildvcs=false -tags cshared -buildmode=c-shared `
            -o dist/cpa-key-billing.dll ./cmd/cpa-key-billing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Force -ErrorAction SilentlyContinue dist/cpa-key-billing.h

      - name: Verify and package Unix plugin
        if: matrix.os != 'windows'
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          binary="dist/cpa-key-billing.${EXTENSION}"
          test -s "$binary"
          file "$binary"
          version="${RELEASE_TAG#v}"

          legacy_archive="cpa-key-billing_${TARGET_OS}_${TARGET_ARCH}.tar.gz"
          tar -czf "$legacy_archive" -C dist "cpa-key-billing.${EXTENSION}"

          store_archive="cpa-key-billing_${version}_${TARGET_OS}_${TARGET_ARCH}.zip"
          zip -j "$store_archive" "$binary"
          test "$(unzip -Z1 "$store_archive")" = "cpa-key-billing.${EXTENSION}"

      - name: Verify and package Windows plugin
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          $binary = "dist/cpa-key-billing.$($env:EXTENSION)"
          if (-not (Test-Path $binary) -or (Get-Item $binary).Length -eq 0) {
            throw "Missing or empty plugin binary: $binary"
          }
          Get-Item $binary
          $version = $env:RELEASE_TAG -replace '^v', ''

          $legacyArchive = "cpa-key-billing_$($env:TARGET_OS)_$($env:TARGET_ARCH).tar.gz"
          tar -czf $legacyArchive -C dist "cpa-key-billing.$($env:EXTENSION)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $storeArchive = "cpa-key-billing_$($version)_$($env:TARGET_OS)_$($env:TARGET_ARCH).zip"
          Compress-Archive -Path $binary -DestinationPath $storeArchive -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($storeArchive)
          try {
            $entries = @($archive.Entries | ForEach-Object FullName)
            if ($entries.Count -ne 1 -or $entries[0] -ne "cpa-key-billing.$($env:EXTENSION)") {
              throw "Unexpected archive contents: $($entries -join ', ')"
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target }}
          path: |
            cpa-key-billing_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
            cpa-key-billing_*_${{ matrix.os }}_${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - name: Download release packages
        uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum cpa-key-billing_*.tar.gz cpa-key-billing_*.zip | sort > checksums.txt

      - name: Generate changelog
        run: |
          changelog="release-assets/CHANGELOG.md"
          release_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          if previous_tag="$(git describe --tags --abbrev=0 "${release_sha}^" 2>/dev/null)"; then
            revision_range="${previous_tag}..${release_sha}"
          else
            revision_range="$release_sha"
          fi

          printf '### Changelog\n\n' > "$changelog"
          git log --pretty=tformat:'%s%x09%h%x09%H' "$revision_range" \
            | while IFS="$(printf '\t')" read -r subject short_sha full_sha; do
                printf -- '- %s ([%s](https://github.com/%s/commit/%s))\n' \
                  "$subject" "$short_sha" "$GITHUB_REPOSITORY" "$full_sha"
              done >> "$changelog"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-assets/CHANGELOG.md
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/checksums.txt
          fail_on_unmatched_files: true
          overwrite_files: true
